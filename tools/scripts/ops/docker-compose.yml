version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: careercopilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-careercopilot}
      POSTGRES_USER: ${DB_USER:-careercopilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careercopilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-careercopilot} -d ${DB_NAME:-careercopilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - careercopilot-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: careercopilot-backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-careercopilot}:${DB_PASSWORD:-careercopilot}@postgres:5432/${DB_NAME:-careercopilot}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me}
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - careercopilot-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: careercopilot-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - careercopilot-network

networks:
  careercopilot-network:
    driver: bridge

volumes:
  postgres_data:
