$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://careercopilot.local/schemas/sprint_plan_schema.yaml"
title: Sprint Plan Schema
description: >-
  Schema for sprint coordinator planning artifacts. Supports sprint plan generation,
  standup snapshots, risk tracking, and deployment readiness metadata.
type: object
additionalProperties: false
required:
  - sprint
  - goals
  - milestones
  - tasks
  - risks
properties:
  version:
    type: string
    pattern: '^\d+\.\d+\.\d+$'
    default: '1.0.0'
  generated_at:
    type: string
    format: date-time
  generated_by:
    type: string
    minLength: 1
  sprint:
    type: object
    additionalProperties: false
    required:
      - id
      - name
      - phase
      - start_date
      - end_date
      - duration_days
      - environment
    properties:
      id:
        type: string
        pattern: '^SPRINT-[0-9]{4}-[0-9]{2}$'
      name:
        type: string
        minLength: 3
      phase:
        type: string
        enum: ["phase-1", "phase-2", "phase-3", "phase-4", "phase-5", "phase-6", "final-push"]
      start_date:
        type: string
        format: date
      end_date:
        type: string
        format: date
      duration_days:
        type: integer
        minimum: 1
        maximum: 60
      environment:
        type: string
        enum: ["local", "staging", "production"]
      owner:
        type: string
      notes:
        type: string
  goals:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/goal'
  milestones:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/milestone'
  tasks:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/task'
  risks:
    type: array
    items:
      $ref: '#/$defs/risk'
  blockers:
    type: array
    items:
      $ref: '#/$defs/blocker'
  metrics_baseline:
    $ref: '#/$defs/metrics'
  deployment_readiness:
    $ref: '#/$defs/deploymentReadiness'
  mcp_delegation:
    type: object
    additionalProperties: false
    required: [workflow_name, queue_file, mode]
    properties:
      workflow_name:
        type: string
      queue_file:
        type: string
      mode:
        type: string
        enum: ["manual", "batch", "hybrid"]
      delegated_tasks:
        type: array
        items:
          type: string

$defs:
  actor:
    type: string
    minLength: 2

  priority:
    type: string
    enum: ["critical", "high", "medium", "low"]

  severity:
    type: string
    enum: ["critical", "high", "medium", "low"]

  status:
    type: string
    enum: ["pending", "in_progress", "blocked", "completed", "failed", "cancelled"]

  dependencyId:
    type: string
    pattern: '^T[0-9]+$'

  acceptanceCriterion:
    type: string
    minLength: 6

  goal:
    type: object
    additionalProperties: false
    required: [id, title, description, success_metrics, priority]
    properties:
      id:
        type: string
        pattern: '^G[0-9]+$'
      title:
        type: string
        minLength: 3
      description:
        type: string
      priority:
        $ref: '#/$defs/priority'
      success_metrics:
        type: array
        minItems: 1
        items:
          type: string
      owner:
        $ref: '#/$defs/actor'

  milestone:
    type: object
    additionalProperties: false
    required: [id, name, target_date, acceptance_criteria, dependencies]
    properties:
      id:
        type: string
        pattern: '^M[0-9]+$'
      name:
        type: string
      target_date:
        type: string
        format: date
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/acceptanceCriterion'
      dependencies:
        type: array
        items:
          type: string
          pattern: '^M[0-9]+$'
      status:
        $ref: '#/$defs/status'

  task:
    type: object
    additionalProperties: false
    required:
      - id
      - title
      - description
      - milestone
      - priority
      - effort_hours
      - assigned_to
      - dependencies
      - acceptance_criteria
      - status
    properties:
      id:
        type: string
        pattern: '^T[0-9]+$'
      title:
        type: string
        minLength: 3
      description:
        type: string
      milestone:
        type: string
        pattern: '^M[0-9]+$'
      priority:
        $ref: '#/$defs/priority'
      effort_hours:
        type: number
        minimum: 0.25
        maximum: 80
      story_points:
        type: integer
        minimum: 1
        maximum: 13
      assigned_to:
        $ref: '#/$defs/actor'
      assigned_skill:
        type: string
      dependencies:
        type: array
        items:
          $ref: '#/$defs/dependencyId'
      acceptance_criteria:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/acceptanceCriterion'
      status:
        $ref: '#/$defs/status'
      started_at:
        type: string
        format: date-time
      completed_at:
        type: string
        format: date-time
      blockers:
        type: array
        items:
          type: string
      retry_strategy:
        type: string
        enum: ["immediate", "exponential_backoff", "linear_backoff"]
      retry_delay_base:
        type: integer
        minimum: 1
        maximum: 3600
      metadata:
        type: object

  risk:
    type: object
    additionalProperties: false
    required: [id, description, severity, owner, mitigation]
    properties:
      id:
        type: string
        pattern: '^R[0-9]+$'
      description:
        type: string
      severity:
        $ref: '#/$defs/severity'
      owner:
        $ref: '#/$defs/actor'
      mitigation:
        type: string
      trigger:
        type: string
      contingency:
        type: string
      status:
        $ref: '#/$defs/status'

  blocker:
    type: object
    additionalProperties: false
    required: [id, description, severity, blocking_tasks, owner, escalates_after_days]
    properties:
      id:
        type: string
        pattern: '^B[0-9]+$'
      description:
        type: string
      severity:
        $ref: '#/$defs/severity'
      owner:
        $ref: '#/$defs/actor'
      blocking_tasks:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/dependencyId'
      escalates_after_days:
        type: integer
        minimum: 1
        maximum: 30
      mitigation_plan:
        type: string
      status:
        $ref: '#/$defs/status'

  metrics:
    type: object
    additionalProperties: false
    properties:
      test_coverage:
        type: number
        minimum: 0
        maximum: 100
      build_status:
        type: string
        enum: ["passing", "failing", "unstable"]
      lint_issues:
        type: integer
        minimum: 0
      wcag_aa_compliance:
        type: number
        minimum: 0
        maximum: 100
      token_compliance:
        type: number
        minimum: 0
        maximum: 100
      security_high_critical:
        type: integer
        minimum: 0
      lighthouse_score:
        type: number
        minimum: 0
        maximum: 100

  weightedMetric:
    type: object
    additionalProperties: false
    required: [value, target, weight, score, status]
    properties:
      value:
        type: number
      target:
        type: number
      weight:
        type: number
        minimum: 0
        maximum: 100
      score:
        type: number
        minimum: 0
        maximum: 100
      status:
        type: string
        enum: ["pass", "warn", "fail"]

  deploymentReadiness:
    type: object
    additionalProperties: false
    required: [overall_score, recommendation, confidence, breakdown]
    properties:
      overall_score:
        type: number
        minimum: 0
        maximum: 100
      recommendation:
        type: string
        enum: ["go", "no_go", "go_with_conditions"]
      confidence:
        type: string
        enum: ["low", "medium", "high"]
      breakdown:
        type: object
        additionalProperties: false
        properties:
          test_coverage:
            $ref: '#/$defs/weightedMetric'
          build_status:
            $ref: '#/$defs/weightedMetric'
          lint:
            $ref: '#/$defs/weightedMetric'
          wcag:
            $ref: '#/$defs/weightedMetric'
          token:
            $ref: '#/$defs/weightedMetric'
          security:
            $ref: '#/$defs/weightedMetric'
          performance:
            $ref: '#/$defs/weightedMetric'
      blockers:
        type: array
        items:
          type: string
      actions:
        type: array
        items:
          type: string
