[allowlist]
  description = "Allowlist for false positives and test data"

  # Ignore common false positive paths
  paths = [
    '''node_modules/''',
    '''\.yarn/''',
    '''\.git/''',
    '''\.venv/''',
    '''venv/''',
    '''__pycache__/''',
    '''dist/''',
    '''build/''',
    '''coverage/''',
    '''.pytest_cache/''',
    '''test-results/''',
    '''playwright-report/''',
    '''storybook-static/''',
    '''\.next/''',
    '''\.turbo/''',
    '''package-lock.json''',
    '''yarn.lock''',
    '''pnpm-lock.yaml''',
  ]

  # Ignore example/test secrets
  regexes = [
    '''EXAMPLE_''',
    '''TEST_''',
    '''MOCK_''',
    '''DEMO_''',
    '''PLACEHOLDER_''',
    '''YOUR_.*_HERE''',
    '''sk-proj-.*example''',
    '''ghp_.*example''',
  ]

  # Ignore specific known safe patterns
  stopwords = [
    '''commit''',
    '''password''',
    '''secret''',
  ]
