name: Flash-Sidekick Dual-Engine Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop, chromebook]

permissions:
  contents: read
  pull-requests: write

jobs:
  sidekick-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-generativeai

      - name: Run Flash Sidekick Check
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --mcp-config '{
              "mcpServers": {
                "flash-sidekick": {
                  "command": "python",
                  "args": ["servers/flash_sidekick.py"],
                  "env": {
                    "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
                    "GEMINI_MODEL": "${{ secrets.GEMINI_MODEL }}",
                    "GEMINI_PRO_MODEL": "${{ secrets.GEMINI_PRO_MODEL }}",
                    "GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                  }
                },
                "design-system-sidekick": {
                  "command": "python",
                  "args": ["servers/design_system_sidekick.py"],
                  "env": {
                    "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"
                  }
                }
              }
            }'
            --allowedTools mcp__flash-sidekick__quick_summarize
            --prompt "Verify the flash-sidekick MCP is working. Call the 'quick_summarize' tool on this text: 'GitHub Actions integration testing is crucial for reliability and stability of software deployment pipelines.' then summarize the result to prove it is working."
