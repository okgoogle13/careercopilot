name: Flash-Sidekick Dual-Engine Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop, chromebook ]

jobs:
  sidekick:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GEMINI_PRO_MODEL: ${{ secrets.GEMINI_PRO_MODEL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-generativeai

      - name: Start Flash-Sidekick (background)
        run: |
          . .venv/bin/activate
          nohup python servers/flash_sidekick.py > /tmp/flash_sidekick.log 2>&1 &
          echo $! > /tmp/flash_sidekick.pid
        timeout-minutes: 1

      - name: Wait for server to be ready
        run: sleep 5

      - name: Fast summarizer test
        id: fast_summary
        run: |
          . .venv/bin/activate
          echo '{"method":"tools/call","id":1,"params":{"name":"quick_summarize","arguments":{"text":"GitHub Actions sanity check"}}}' |
          python servers/flash_sidekick.py > fast_summary.json
          cat fast_summary.json

      - name: Smart IDF test (one changed Python file)
        id: idf_gen
        run: |
          . .venv/bin/activate
          CONTENT=$(cat .github/workflows/flash_sidekick.yml)
          REQUEST=$(cat <<EOF
{
  "method":"tools/call",
  "id":2,
  "params":{
    "name":"generate_idf",
    "arguments":{"code_content":"$CONTENT"}
  }
}
EOF
)
          echo "$REQUEST" | python servers/flash_sidekick.py > idf_output.json
          cat idf_output.json

      - name: Publish fast summary as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = require('fs').readFileSync('fast_summary.json', 'utf8');
            const comment = `**Flash-Sidekick Fast Summary**\n\`\`\`json\n${summary}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Stop server (cleanup)
        if: always()
        run: |
          kill $(cat /tmp/flash_sidekick.pid) || true
