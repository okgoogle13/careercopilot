name: Build and Deploy Backend to Staging

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  PROJECT_ID: careercopilot-staging
  REGION: us-central1
  SERVICE_NAME: careercopilot-backend-staging
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: careercopilot-repo

jobs:
  # ======================================================================================
  #  TEST JOB - Runs on every push to the develop branch
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Create Python virtual environment
        run: python3.11 -m venv ./backend/.venv

      - name: Activate venv and install dependencies
        run: |
          source ./backend/.venv/bin/activate
          pip install --upgrade pip
          pip install -r ./backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          source ./backend/.venv/bin/activate
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage-report

  # ======================================================================================

