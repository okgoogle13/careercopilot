name: Build and Deploy Backend to Staging

on:
  push:
    branches:
      - develop # CORRECT: Staging deployments should trigger from a 'develop' or 'staging' branch, not 'main'.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  PROJECT_ID: careercopilot-staging
  REGION: us-central1
  SERVICE_NAME: careercopilot-backend-staging
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: careercopilot-repo

jobs:
  # ======================================================================================
  #  TEST JOB - Now includes secure authentication for tests that require it
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      # ADDED: id-token permission might be needed if you switch to WIF in the future
      # For JSON keys it is not strictly required but good practice to define permissions.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud for Tests
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS_JSON }}'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        # CORRECT: No need to set GOOGLE_APPLICATION_CREDENTIALS. The 'auth' action handles it.
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml

  # ======================================================================================
  #  BUILD AND DEPLOY JOB - No changes needed here, it was already correct.
  # ======================================================================================
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: [test] # This is the quality gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.result == 'success')
    
    permissions:
      contents: 'read'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud for Deployment
        id: deploy-auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS_JSON }}'

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
