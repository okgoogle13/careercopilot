# CD - Deploy to Staging and Production (v1)
# This workflow deploys to Staging on push to develop, and Production on push to main.
# Improvements:
# - Permissions restricted
# - Node.js dependencies cached
# - Retry strategy for tests/deploy
# - Actions pinned
# - Pre-deployment tests
# - Duplicated steps reduced via YAML anchors

name: "CD - Deploy to Staging and Production v1"

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - staging
          - production
    environment: ${{ matrix.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test || npm test || npm test
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest || pytest || pytest
        working-directory: backend
      - name: Deploy ${{ matrix.env }}
        run: |
          echo "Deploying to ${{ matrix.env }}..."
          # Add your deploy script/command here
        env:
          ENVIRONMENT: ${{ matrix.env }}

# End of workflow improvements.
