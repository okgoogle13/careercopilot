# .github/workflows/deploy.yml
#
# FULLY REFACTORED DEPLOYMENT WORKFLOW (POLISHED)
#
# Implements:
# 1. Workload Identity Federation (WIF): Authenticates to GCP/Firebase using secure OIDC tokens.
# 2. Image-Based Deployment: Deploys the *exact* Docker image built in CI.
# 3. SHA-Pinning: All 'uses:' actions are pinned to full commit SHAs.
# 4. Robust Rollback: Corrects the rollback health check logic.
name: CD - Deploy to Staging and Production

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Default permissions. 'id-token: write' is REQUIRED for WIF.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Docker image location, must match ci.yml
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    # Run only if the CI workflow was successful
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      should-deploy-staging: ${{ steps.check.outputs.staging }}
      should-deploy-production: ${{ steps.check.outputs.production }}
      commit-sha: ${{ steps.vars.outputs.commit_sha }}
      # --- EDITED: Standardized to run_id (underscore) ---
      run_id: ${{ steps.vars.outputs.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      - name: Check deployment conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.environment }}" == "staging" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          fi

      # --- EDITED: Ensure run_id output name consistency ---
      - name: Set commit SHA and run ID
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            # Correctly referencing the workflow run ID
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-staging == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: staging
    timeout-minutes: 20
    permissions:
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      # --- EDITED: Use standardized run_id (underscore) ---
      - name: Prepare Frontend for Deployment
        id: prepare-frontend
        uses: ./.github/actions/prepare-frontend-deploy
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: frontend-dist
          fallback-build: true
          ci-run-id: ${{ needs.pre-deploy-checks.outputs.run_id }}

      - name: Validate Frontend Artifact
        run: |
          echo "Validation logic unchanged. Uses the downloaded artifact."
          if [ ! -d "./dist" ] && [ ! -d "./frontend/dist" ]; then
            echo "❌ Frontend artifact validation failed"
            exit 1
          fi
          if [ -d "./frontend/dist" ] && [ ! -d "./dist" ]; then
            cp -r ./frontend/dist ./dist
          fi
          echo "✅ Artifact validation passed"

      # SECURE: Authenticate to GCP/Firebase using WIF
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@061d3e8e1610e7b7e3e3c0b17bef6c04f05b14e8 # v2.1.3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_WIF_SA_EMAIL }}

      - name: Deploy Frontend to Staging (using WIF)
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@a5103c3a9d4e32d3e1119b08d23d8c1106c1a84b # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          workloadIdentityProvider: ${{ secrets.GCP_STAGING_WIF_PROVIDER }}
          serviceAccount: ${{ secrets.GCP_STAGING_WIF_SA_EMAIL }}
          channelId: live
          projectId: careercopilot-staging # Your staging project
        timeout-minutes: 10

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@0d5fde2d56c353d1000f0745582f34f6ea2ad50e # v2.1.0

      # --- NEW STEP: Verify Image Exists ---
      - name: Verify Backend Image Tag Exists
        run: |
          IMAGE_TAG_SHA="${{ needs.pre-deploy-checks.outputs.commit-sha }}"
          IMAGE_PATH="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"

          echo "Checking for image tag: $IMAGE_TAG_SHA"
          if ! gcloud artifacts docker tags list $IMAGE_PATH \
            --filter="tag=$IMAGE_TAG_SHA" \
            --limit=1 \
            --format="value(tag)" | grep -q "$IMAGE_TAG_SHA"; then

            echo "::error::Image tag $IMAGE_TAG_SHA not found in Artifact Registry. Ensure the CI 'Build and Push' job ran successfully."
            exit 1
          fi
          echo "✅ Image tag $IMAGE_TAG_SHA verified."

      # RELIABLE: Deploy the immutable image from CI
      - name: Deploy Backend to Cloud Run (from Image)
        id: deploy-backend
        run: |
          # Use the commit SHA from the CI run to identify the exact image
          IMAGE_URL="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ needs.pre-deploy-checks.outputs.commit-sha }}"

          echo "Deploying image: $IMAGE_URL"

          gcloud run deploy careercopilot-backend-staging \
            --image $IMAGE_URL \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_STAGING_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 1 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars="ENVIRONMENT=staging,LOG_LEVEL=INFO" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_STAGING:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_STAGING:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }}" \
            --allow-unauthenticated \
            --format=json > deployment-output.json

          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 10

      - name: Health check for backend
        run: |
          SERVICE_URL="${{ steps.deploy-backend.outputs.service_url }}"
          echo "Checking health of backend at $SERVICE_URL/health"

          MAX_RETRIES=10
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s "$SERVICE_URL/health" > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          exit 1
        timeout-minutes: 5

      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend URL: https://careercopilot-staging.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- Backend URL: ${{ steps.deploy-backend.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ needs.pre-deploy-checks.outputs.commit-sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-production == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: production
    timeout-minutes: 25
    permissions:
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      # --- EDITED: Use standardized run_id (underscore) ---
      - name: Prepare Frontend for Deployment
        id: prepare-frontend
        uses: ./.github/actions/prepare-frontend-deploy
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: frontend-dist
          fallback-build: true
          ci-run-id: ${{ needs.pre-deploy-checks.outputs.run_id }}

      - name: Validate Frontend Artifact
        run: |
          echo "Validation logic unchanged. Uses the downloaded artifact."
          if [ ! -d "./dist" ] && [ ! -d "./frontend/dist" ]; then
            echo "❌ Frontend artifact validation failed"
            exit 1
          fi
          if [ -d "./frontend/dist" ] && [ ! -d "./dist" ]; then
            cp -r ./frontend/dist ./dist
          fi
          echo "✅ Artifact validation passed"

      # SECURE: Authenticate to GCP/Firebase using WIF
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@061d3e8e1610e7b7e3e3c0b17bef6c04f05b14e8 # v2.1.3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_WIF_SA_EMAIL }}

      - name: Deploy Frontend to Production (using WIF)
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@a5103c3a9d4e32d3e1119b08d23d8c1106c1a84b # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          workloadIdentityProvider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          serviceAccount: ${{ secrets.GCP_PROD_WIF_SA_EMAIL }}
          channelId: live
          projectId: careercopilot-468811 # Your production project
        timeout-minutes: 12

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@0d5fde2d56c353d1000f0745582f34f6ea2ad50e # v2.1.0

      # --- NEW STEP: Verify Image Exists ---
      - name: Verify Backend Image Tag Exists
        run: |
          IMAGE_TAG_SHA="${{ needs.pre-deploy-checks.outputs.commit-sha }}"
          IMAGE_PATH="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"

          echo "Checking for image tag: $IMAGE_TAG_SHA"
          if ! gcloud artifacts docker tags list $IMAGE_PATH \
            --filter="tag=$IMAGE_TAG_SHA" \
            --limit=1 \
            --format="value(tag)" | grep -q "$IMAGE_TAG_SHA"; then

            echo "::error::Image tag $IMAGE_TAG_SHA not found in Artifact Registry. Ensure the CI 'Build and Push' job ran successfully."
            exit 1
          fi
          echo "✅ Image tag $IMAGE_TAG_SHA verified."

      # RELIABLE: Deploy the immutable image from CI
      - name: Deploy Backend to Cloud Run (from Image)
        id: deploy-backend
        run: |
          IMAGE_URL="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ needs.pre-deploy-checks.outputs.commit-sha }}"

          echo "Deploying image: $IMAGE_URL"

          gcloud run deploy careercopilot-backend-production \
            --image $IMAGE_URL \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 1 \
            --max-instances 100 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=WARNING" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_PROD:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_PROD:latest,REDIS_URL=REDIS_URL:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }}" \
            --allow-unauthenticated \
            --format=json > deployment-output.json

          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 12

      - name: Health check for backend
        id: health-check
        continue-on-error: true
        run: |
          SERVICE_URL="${{ steps.deploy-backend.outputs.service_url }}"
          echo "Checking health of backend at $SERVICE_URL/health"

          MAX_RETRIES=12
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f -s "$SERVICE_URL/health" > /dev/null 2>&1; then
              echo "✅ Backend health check passed"
              echo "success=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT failed, retrying in 10s..."
            sleep 10
          done

          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          echo "success=false" >> $GITHUB_OUTPUT
          exit 1
        timeout-minutes: 5

      - name: Rollback on failure
        if: steps.health-check.outputs.success == 'false'
        run: |
          echo "⚠️ Health check failed, initiating rollback..."

          # Get the previous revision
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=careercopilot-backend-production \
            --region=us-central1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(name)" \
            --limit=2 \
            --sort-by=~metadata.creationTimestamp \
            | tail -n 1)

          if [ -n "$PREVIOUS_REVISION" ]; then
            echo "Rolling back to revision: $PREVIOUS_REVISION"
            gcloud run services update-traffic careercopilot-backend-production \
              --region=us-central1 \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --to-revisions=$PREVIOUS_REVISION=100

            echo "✅ Rollback completed"
          else
            echo "❌ No previous revision found for rollback"
          fi

          exit 1

      - name: Deployment summary
        if: steps.health-check.outputs.success == 'true'
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend URL: https://careercopilot-468811.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- Backend URL: ${{ steps.deploy-backend.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit SHA: ${{ needs.pre-deploy-checks.outputs.commit-sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All health checks passed" >> $GITHUB_STEP_SUMMARY
