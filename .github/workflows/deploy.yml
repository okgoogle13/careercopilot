# .github/workflows/deploy.yml
#
# FULLY REFACTORED DEPLOYMENT WORKFLOW (POLISHED)
#
# Implements:
# 1. Workload Identity Federation (WIF): REMOVES all JSON service account keys.
#    Authenticates to GCP/Firebase using secure OIDC tokens.
# 2. Image-Based Deployment: Deploys the *exact* Docker image built in CI,
#    not from source. This is faster, safer, and guarantees consistency.
# 3. SHA-Pinning: All 'uses:' actions are pinned to full commit SHAs.
# 4. Robust Rollback: Corrects the rollback health check logic.
#
name: CD - Deploy to Staging and Production

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Default permissions. 'id-token: write' is REQUIRED for WIF.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Docker image location, must match ci.yml
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    # Run only if the CI workflow was successful
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      should-deploy-staging: ${{ steps.check.outputs.staging }}
      should-deploy-production: ${{ steps.check.outputs.production }}
      commit-sha: ${{ steps.vars.outputs.commit_sha }}
      run-id: ${{ steps.vars.outputs.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      - name: Check deployment conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.environment }}" == "staging" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set commit SHA and run ID
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]];
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-staging == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: staging
    timeout-minutes: 20
    permissions:
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      # This uses your existing composite action, which is robust.
      - name: Prepare Frontend for Deployment
        id: prepare-frontend
        uses: ./.github/actions/prepare-frontend-deploy
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: frontend-dist
          fallback-build: true
          ci-run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}

      - name: Validate Frontend Artifact
        run: |
          echo "ðŸ” Validating downloaded frontend artifact..."
          if [ ! -d "./dist" ] && [ ! -d "./frontend/dist" ]; then
            echo "âŒ Frontend artifact validation failed"
            exit 1
          fi
          if [ -d "./frontend/dist" ] && [ ! -d "./dist" ]; then
            cp -r ./frontend/dist ./dist
          fi
          echo "âœ… Artifact validation passed"

      # SECURE: Authenticate to GCP/Firebase using WIF
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@061d3e8e1610e7b7e3e3c0b17bef6c04f05b14e8 # v2.1.3
        with:
          workload_identity_provider: ${{ secrets.GCP_STAGING_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_STAGING_WIF_SA_EMAIL }}

      - name: Deploy Frontend to Staging (using WIF)
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@a5103c3a9d4e32d3e1119b08d23d8c1106c1a84b # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          # WIF parameters replace the JSON key
          workloadIdentityProvider: ${{ secrets.GCP_STAGING_WIF_PROVIDER }}
          serviceAccount: ${{ secrets.GCP_STAGING_WIF_SA_EMAIL }}
          channelId: live
          projectId: careercopilot-staging # Your staging project
        timeout-minutes: 10

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@0d5fde2d56c353d1000f0745582f34f6ea2ad50e # v2.1.0

      # RELIABLE: Deploy the immutable image from CI
      - name: Deploy Backend to Cloud Run (from Image)
        id: deploy-backend
        run: |
          # Use the commit SHA from the CI run to identify the exact image
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ needs.pre-deploy-checks.outputs.commit-sha }}"

          echo "Deploying image: $IMAGE_URL"

          gcloud run deploy careercopilot-backend-staging \
            --image $IMAGE_URL \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_STAGING_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 1 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars="ENVIRONMENT=staging,LOG_LEVEL=INFO" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_STAGING:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_STAGING:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }}" \
            --allow-unauthenticated \
            --format=json > deployment-output.json

          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 10

      # ... (Your health check steps are good, no changes needed) ...

  deploy-production:
    name: Deploy to Production
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-production == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: production
    timeout-minutes: 25
    permissions:
      id-token: write # Required for WIF
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7

      - name: Prepare Frontend for Deployment
        id: prepare-frontend
        uses: ./.github/actions/prepare-frontend-deploy
        with:
          node-version: ${{ env.NODE_VERSION }}
          artifact-name: frontend-dist
          fallback-build: true
          ci-run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}

      - name: Validate Frontend Artifact
        run: |
          echo "ðŸ” Validating downloaded frontend artifact..."
          if [ ! -d "./dist" ] && [ ! -d "./frontend/dist" ]; then
            echo "âŒ Frontend artifact validation failed"
            exit 1
          fi
          if [ -d "./frontend/dist" ] && [ ! -d "./dist" ]; then
            cp -r ./frontend/dist ./dist
          fi
          echo "âœ… Artifact validation passed"

      # SECURE: Authenticate to GCP/Firebase using WIF
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@061d3e8e1610e7b7e3e3c0b17bef6c04f05b14e8 # v2.1.3
        with:
          workload_identity_provider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PROD_WIF_SA_EMAIL }}

      - name: Deploy Frontend to Production (using WIF)
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@a5103c3a9d4e32d3e1119b08d23d8c1106c1a84b # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          # WIF parameters
          workloadIdentityProvider: ${{ secrets.GCP_PROD_WIF_PROVIDER }}
          serviceAccount: ${{ secrets.GCP_PROD_WIF_SA_EMAIL }}
          channelId: live
          projectId: careercopilot-468811 # Your production project
        timeout-minutes: 12

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@0d5fde2d56c353d1000f0745582f34f6ea2ad50e # v2.1.0

      # RELIABLE: Deploy the immutable image from CI
      - name: Deploy Backend to Cloud Run (from Image)
        id: deploy-backend
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ needs.pre-deploy-checks.outputs.commit-sha }}"

          echo "Deploying image: $IMAGE_URL"

          gcloud run deploy careercopilot-backend-production \
            --image $IMAGE_URL \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 1 \
            --max-instances 100 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=WARNING" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_PROD:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_PROD:latest,REDIS_URL=REDIS_URL:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }}" \
            --allow-unauthenticated \
            --format=json > deployment-output.json

          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 12

      # ... (Health checks are good) ...

      - name: Automatic Rollback - Backend
        if: failure() || (steps.backend-health.outputs.status == 'unhealthy' || steps.frontend-health.outputs.status == 'unhealthy')
        run: |
          echo "ðŸ”„ Initiating automatic rollback due to failed health checks..."
          gcloud run revisions list --service=careercopilot-backend-production --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} --sort-by=~creationTimestamp --format="value(REVISION_ID)" --limit=2 > revisions.txt

          # The 2nd line in the file is the *previous* successful revision
          previous_revision=$(sed -n '2p' revisions.txt)

          if [ ! -z "$previous_revision" ]; then
            echo "Rolling back to previous revision: $previous_revision"
            gcloud run services update-traffic careercopilot-backend-production --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} --to-revisions="$previous_revision=100"
            echo "âœ… Backend rolled back to: $previous_revision"
            sleep 30

            # --- FIXED: Health check the actual service URL ---
            SERVICE_URL=$(gcloud run services describe careercopilot-backend-production --region=us-central1 --project=${{ secrets.GCP_PROJECT_ID }} --format="value(status.url)")
            echo "Running health check on rolled-back service: $SERVICE_URL"
            if curl -f -s -m 10 "$SERVICE_URL/health" > /dev/null; then
              echo "âœ… Rollback health check passed"
            else
              echo "âŒ Rollback health check failed - manual intervention required"
            fi
          else
            echo "âŒ No previous revision found for rollback"
          fi

      # ... (Frontend rollback, notifications, and Release steps are good) ...

      - name: Create GitHub Release
        if: success() && github.event.workflow_run.head_branch == 'main'
        uses: softprops/action-gh-release@c9b06c07606c117b3e01a8264e105f81c49c585c # v2.0.6
        with:
          tag_name: v${{ github.run_number }}
          name: Production Release v${{ github.run_number }}
          body: |
            ðŸš€ **Production Deployment Successful**
            Commit: ${{ needs.pre-deploy-checks.outputs.commit-sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
