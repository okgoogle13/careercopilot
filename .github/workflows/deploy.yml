# Deploy Workflow for Node.js Backend with Docker and Firebase
# This workflow runs on pushes to develop branch and covers build, test, lint, Docker push, and Firebase deploy.
# No "--channel" flags are used anywhere.

name: Deploy Backend (Docker + Firebase)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: us-central1-docker.pkg.dev/careercopilot-staging/careercopilot-repo/backend@sha256:b2154f5416a37f50e1fd3f79611faafd2dc3c0e6c53ea9acebb851e8300977bf
      FIREBASE_PROJECT: careercopilot-staging

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Restore npm cache (for faster installs)
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Step 4: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 5: Lint code
      - name: Lint code
        run: npm run lint

      # Step 6: Run tests
      - name: Run tests
        run: npm test

      # Step 7: Build project (if applicable)
      - name: Build project
        run: npm run build

      # Step 8: Collect build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            .next/
            build/

      # Step 9: Log in to Google Artifact Registry (Docker)
      - name: Authenticate Docker for Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_JSON_KEY }}

      # Step 10: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      # Step 11: Push Docker image
      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE

      # Step 12: Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # Step 13: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --project $FIREBASE_PROJECT --only hosting

      # Step 14: Summary output
      - name: Deployment Summary
        run: echo "Deployment completed for $DOCKER_IMAGE on project $FIREBASE_PROJECT from branch develop"

      # Step 15: Notify on failure (optional)
      - name: Notify failure
        if: failure()
        run: echo "Deployment failed on branch develop"

# End of workflow file
