# .github/workflows/deploy.yml

name: CD - Deploy to Staging and Production

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    outputs:
      should-deploy-staging: ${{ steps.check.outputs.staging }}
      should-deploy-production: ${{ steps.check.outputs.production }}
      commit-sha: ${{ steps.vars.outputs.commit_sha }}
      run-id: ${{ steps.vars.outputs.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${{ inputs.environment }}" =~ ^(staging|production)$ ]]; then
            echo "❌ Invalid environment: ${{ inputs.environment }}"
            exit 1
          fi

      - name: Check deployment conditions
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.environment }}" == "staging" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
            fi
            if [[ "${{ inputs.environment }}" == "production" ]]; then
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
              echo "staging=true" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=true" >> $GITHUB_OUTPUT
            else
              echo "staging=false" >> $GITHUB_OUTPUT
              echo "production=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "staging=false" >> $GITHUB_OUTPUT
            echo "production=false" >> $GITHUB_OUTPUT
          fi

      - name: Set commit SHA and run ID
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-staging == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: staging
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist
          run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: ./backend
          run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Downloaded Artifacts
        run: |
          echo "🔍 Validating downloaded artifacts..."
          if [ ! -d "./dist" ] || [ -z "$(ls -A ./dist)" ]; then
            echo "❌ Frontend artifact validation failed"
            exit 1
          fi
          if [ ! -d "./backend" ] || [ -z "$(ls -A ./backend)" ]; then
            echo "❌ Backend artifact validation failed"
            exit 1
          fi
          echo "✅ Artifact validation passed"

      - name: Deploy Frontend to Staging
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT_STAGING }}'
          channelId: live
          projectId: careercopilot-staging
          public: ./dist
        timeout-minutes: 10

      - name: Authenticate to Google Cloud (Staging)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run (Staging)
        id: deploy-backend
        run: |
          gcloud run deploy careercopilot-backend-staging \
            --source ./backend \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_STAGING_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 1 \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars="ENVIRONMENT=staging,LOG_LEVEL=INFO" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_STAGING:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_STAGING:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }},environment=staging,deployed-at=$(date +%s)" \
            --allow-unauthenticated \
            --format=json > deployment-output.json
          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 10

      - name: Wait for deployment propagation
        run: sleep 30

      - name: Health Check - Frontend
        id: frontend-health
        run: |
          echo "🏥 Checking frontend health..."
          max_attempts=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if curl -f -s -m 30 "https://careercopilot-staging.web.app" > /dev/null; then
              echo "✅ Frontend health check passed"
              echo "status=healthy" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ Frontend health check failed (attempt $attempt)"
              if [ $attempt -eq $max_attempts ]; then
                echo "status=unhealthy" >> $GITHUB_OUTPUT
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 10
            fi
          done
        timeout-minutes: 5

      - name: Health Check - Backend
        id: backend-health
        run: |
          echo "🏥 Checking backend health..."
          max_attempts=5
          attempt=1
          backend_url="${{ steps.deploy-backend.outputs.service_url }}"
          echo "Backend URL: $backend_url"
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if curl -f -s -m 30 "$backend_url/health" > /dev/null; then
              echo "✅ Backend health check passed"
              echo "status=healthy" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ Backend health check failed (attempt $attempt)"
              if [ $attempt -eq $max_attempts ]; then
                echo "status=unhealthy" >> $GITHUB_OUTPUT
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 15
            fi
          done
        timeout-minutes: 8

      - name: Post deployment notification
        if: always()
        run: |
          if [[ "${{ steps.frontend-health.outputs.status }}" == "healthy" && "${{ steps.backend-health.outputs.status }}" == "healthy" ]]; then
            echo "🚀 Staging deployment successful!"
            echo "Frontend: https://careercopilot-staging.web.app"
            echo "Backend: Deployed to Cloud Run"
          else
            echo "💥 Staging deployment failed health checks!"
            exit 1
          fi

  deploy-production:
    name: Deploy to Production
    if: ${{ needs.pre-deploy-checks.outputs.should-deploy-production == 'true' }}
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist
          run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-source
          path: ./backend
          run-id: ${{ needs.pre-deploy-checks.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Downloaded Artifacts
        run: |
          echo "🔍 Validating downloaded artifacts..."
          if [ ! -d "./dist" ] || [ -z "$(ls -A ./dist)" ]; then
            echo "❌ Frontend artifact validation failed"
            exit 1
          fi
          if [ ! -d "./backend" ] || [ -z "$(ls -A ./backend)" ]; then
            echo "❌ Backend artifact validation failed"
            exit 1
          fi
          echo "✅ Artifact validation passed"

      - name: Deploy Frontend to Production
        id: deploy-frontend
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT }}'
          channelId: live
          projectId: careercopilot-468811
          public: ./dist
        timeout-minutes: 12

      - name: Authenticate to Google Cloud (Production)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run (Production)
        id: deploy-backend
        run: |
          gcloud run deploy careercopilot-backend-production \
            --source ./backend \
            --platform managed \
            --region us-central1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --timeout 1200s \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 1 \
            --max-instances 100 \
            --set-env-vars="ENVIRONMENT=production,LOG_LEVEL=WARNING" \
            --set-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,GOOGLE_OAUTH_CLIENT_ID=GOOGLE_OAUTH_CLIENT_ID_PROD:latest,GOOGLE_OAUTH_CLIENT_SECRET=GOOGLE_OAUTH_CLIENT_SECRET_PROD:latest,REDIS_URL=REDIS_URL:latest" \
            --update-labels="managed-by=github-actions,commit-sha=${{ needs.pre-deploy-checks.outputs.commit-sha }},environment=production,deployed-at=$(date +%s)" \
            --allow-unauthenticated \
            --format=json > deployment-output.json
          echo "service_url=$(cat deployment-output.json | jq -r '.status.url')" >> $GITHUB_OUTPUT
        timeout-minutes: 12

      - name: Wait for deployment propagation
        run: sleep 45

      - name: Health Check - Frontend
        id: frontend-health
        run: |
          echo "🏥 Checking frontend health..."
          max_attempts=6
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if curl -f -s -m 30 "https://careercopilot-468811.web.app" > /dev/null; then
              echo "✅ Frontend health check passed"
              echo "status=healthy" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ Frontend health check failed (attempt $attempt)"
              if [ $attempt -eq $max_attempts ]; then
                echo "status=unhealthy" >> $GITHUB_OUTPUT
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 15
            fi
          done
        timeout-minutes: 8

      - name: Health Check - Backend
        id: backend-health
        run: |
          echo "🏥 Checking backend health..."
          max_attempts=6
          attempt=1
          backend_url="${{ steps.deploy-backend.outputs.service_url }}"
          echo "Backend URL: $backend_url"
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt/$max_attempts"
            if curl -f -s -m 30 "$backend_url/health" > /dev/null; then
              echo "✅ Backend health check passed"
              echo "status=healthy" >> $GITHUB_OUTPUT
              break
            else
              echo "❌ Backend health check failed (attempt $attempt)"
              if [ $attempt -eq $max_attempts ]; then
                echo "status=unhealthy" >> $GITHUB_OUTPUT
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 20
            fi
          done
        timeout-minutes: 10

      - name: Performance Check
        id: performance-check
        run: |
          echo "⚡ Running performance check..."
          response_time=$(curl -o /dev/null -s -w '%{time_total}' https://careercopilot-468811.web.app)
          if (( $(echo "$response_time < 3.0" | bc -l) )); then
            echo "✅ Performance check passed (${response_time}s)"
            echo "status=good" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Performance check warning (${response_time}s)"
            echo "status=slow" >> $GITHUB_OUTPUT
          fi
        timeout-minutes: 3
        continue-on-error: true

      - name: Automatic Rollback - Backend
        if: failure() || (steps.backend-health.outputs.status == 'unhealthy' || steps.frontend-health.outputs.status == 'unhealthy')
        run: |
          echo "🔄 Initiating automatic rollback due to failed health checks..."
          gcloud run services describe careercopilot-backend-production --region=us-central1 --project=careercopilot-468811 --format="value(status.traffic[0].revisionName)" > current_revision.txt
          gcloud run revisions list --service=careercopilot-backend-production --region=us-central1 --project=careercopilot-468811 --limit=5 --format="value(metadata.name)" > all_revisions.txt
          previous_revision=$(sed -n '2p' all_revisions.txt)
          if [ ! -z "$previous_revision" ]; then
            echo "Rolling back to previous revision: $previous_revision"
            gcloud run services update-traffic careercopilot-backend-production --region=us-central1 --project=careercopilot-468811 --to-revisions="$previous_revision=100"
            echo "✅ Backend rolled back to: $previous_revision"
            sleep 30
            backend_url="https://careercopilot-backend-[hash]-uc.a.run.app"
            if curl -f -s -m 10 "$backend_url/health" > /dev/null; then
              echo "✅ Rollback health check passed"
            else
              echo "❌ Rollback health check failed - manual intervention required"
            fi
          else
            echo "❌ No previous revision found for rollback"
          fi

      - name: Automatic Rollback - Frontend
        if: failure() || (steps.frontend-health.outputs.status == 'unhealthy')
        run: |
          echo "🔄 Rolling back frontend deployment..."
          firebase hosting:clone careercopilot-468811:production careercopilot-468811:production --except="current" || true
          echo "⚠️ Frontend rollback may require manual intervention via Firebase Console"

      - name: Rollback Notification
        if: failure() || (steps.backend-health.outputs.status == 'unhealthy' || steps.frontend-health.outputs.status == 'unhealthy')
        run: |
          echo "🚨 DEPLOYMENT ROLLBACK EXECUTED"
          echo "Reason: Health checks failed"
          exit 1

      - name: Post deployment notification
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo "Frontend: https://careercopilot-468811.web.app"
          echo "Backend: Deployed to Cloud Run"

      - name: Create GitHub Release
        if: success() && github.event.workflow_run.head_branch == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Production Release v${{ github.run_number }}
          body: |
            🚀 **Production Deployment Successful**
            Commit: ${{ needs.pre-deploy-checks.outputs.commit-sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post-deploy-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    timeout-minutes: 10
    steps:
      - name: Deployment summary
        run: |
          echo "📋 **Deployment Summary**"
          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "✅ Staging: Deployed successfully"
          fi
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Production: Deployed successfully"
          fi