# .github/workflows/deploy.yml
#
# FULLY REFACTORED DEPLOYMENT WORKFLOW (POLISHED)
#
# Implements:
# 1. Workload Identity Federation (WIF): Authenticates to GCP/Firebase using secure OIDC tokens.
# 2. Image-Based Deployment: Deploys the *exact* Docker image built in CI.
# 3. SHA-Pinning: All 'uses:' actions are pinned to full commit SHAs.
# 4. Robust Rollback: Corrects the rollback health check logic.
name: CD - Deploy to Staging and Production

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Default permissions for service account key authentication
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Docker image location, must match ci.yml
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot-repo # <-- CORRECTED VALUE
  GCP_IMAGE_NAME: backend

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    # Run only if the CI workflow was successful
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    outputs:
      should-deploy-staging: ${{ steps.check.outputs.staging }}
      should-deploy-production: ${{ steps.check.outputs.production }}
      commit-sha: ${{ steps.vars.outputs.commit_sha }}
      run_id: ${{ steps.vars.outputs.run_id }}
    steps:
      -
