name: Build and Deploy Backend to Staging

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

env:
  PROJECT_ID: careercopilot-staging
  REGION: us-central1
  SERVICE_NAME: careercopilot-backend-staging
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: careercopilot-repo

jobs:
  # ======================================================================================
  #  TEST JOB - Authenticates to GCP for tests that require live services
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud for Tests
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}' # <-- UPDATED SECRET NAME

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml

  # ======================================================================================
  #  BUILD AND DEPLOY JOB - The core deployment logic
  # ======================================================================================
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.test.result == 'success')
    
    permissions:
      contents: 'read'

    outputs:
      service-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name
        run: echo "IMAGE_NAME=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud for Deployment
        id: deploy-auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}' # <-- UPDATED SECRET NAME

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: >-
            --platform=managed
            --allow-unauthenticated
            --port=8000
            --execution-environment=gen2
            --cpu-boost
            --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest
            --set-env-vars="ENVIRONMENT=staging,LOG_LEVEL=INFO"

      - name: Wait for service to be ready and run Smoke Test
        run: |
          SERVICE_URL=${{ steps.deploy.outputs.url }}
          echo "Waiting for service to be ready at: $SERVICE_URL"
          
          for i in {1..30}; do
            STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" "$SERVICE_URL/health")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "✅ Service is ready and health check passed!"
              exit 0
            fi
            echo "Waiting... (attempt $i/30, status: $STATUS_CODE)"
            sleep 10
          done
          
          echo "❌ Service failed to become ready or pass health check within 5 minutes"
          exit 1
