# CD - Deploy to Staging and Production (v3)
# Corrected placement of YAML anchor

name: "CD - Deploy to Staging and Production v3"

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  # ======================================================================================
  #  ANCHOR TEMPLATE JOB
  # ======================================================================================
  # The YAML anchor must be defined within a job or a list of steps.
  # This is a template job just for demonstrating the correct placement.
  template-job:
    name: Anchor Template
    runs-on: ubuntu-latest
    steps:
      - name: Reusable steps
        # This is where the anchor is correctly defined.
        # It must be part of a list (e.g., steps, a list of environments, etc.).
        <<: &shared_build_steps
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Set up Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '20'
          # Add the rest of your shared steps here...

  # ======================================================================================
  #  LINT JOB
  # ======================================================================================
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies & Lint
        run: |
          cd frontend
          npm install
          npm run lint
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8 & Lint
        run: |
          pip install flake8
          flake8 backend/app

  # ======================================================================================
  #  TEST JOB - This job will run tests before deployment
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

  # ======================================================================================
  #  STAGING DEPLOYMENT JOB
  # ======================================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [test]
    if: github.ref == 'refs/heads/develop' && needs.test.result == 'success'
    steps:
      # Here's where you would use the anchor to reuse steps
      - <<: *shared_build_steps
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging..."
        env:
          ENVIRONMENT: staging

  # ======================================================================================
  #  PRODUCTION DEPLOYMENT JOB
  # ======================================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "Deploying to Production..."
        env:
          ENVIRONMENT: production
