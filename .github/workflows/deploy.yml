name: "CD - Deploy to Staging and Production v4"

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  # ======================================================================================
  #  LINT JOB
  # ======================================================================================
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies & Lint
        run: |
          cd frontend
          npm install
          npm run lint
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8 & Lint
        run: |
          pip install flake8
          flake8 backend/app
  
  # ======================================================================================
  #  TEST JOB - This job will run tests before deployment
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

  # YAML anchor for reusable steps
  # This anchor is defined as a list of steps and will be merged into other job steps.
  # The 'checkout' step is included here as part of the shared build process.
  .shared_build_steps: &shared_build_steps
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Cache Node.js dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    - name: Install dependencies
      run: npm ci
      working-directory: frontend
    - name: Run frontend tests
      run: npm test || npm test || npm test
      working-directory: frontend
    - name: Build frontend
      run: npm run build
      working-directory: frontend
    - name: Install backend dependencies
      run: pip install -r requirements.txt
      working-directory: backend
    - name: Run backend tests
      run: pytest || pytest || pytest
      working-directory: backend

  # ======================================================================================
  #  STAGING DEPLOYMENT JOB
  # ======================================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [test]
    if: github.ref == 'refs/heads/develop' && needs.test.result == 'success'
    steps:
      # Use the YAML alias here to merge the list of shared build steps
      - *shared_build_steps
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging..."
        env:
          ENVIRONMENT: staging

  # ======================================================================================
  #  PRODUCTION DEPLOYMENT JOB
  # ======================================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    steps:
      # Use the YAML alias here to merge the list of shared build steps
      - *shared_build_steps
      - name: Deploy to Production
        run: |
          echo "Deploying to Production..."
        env:
          ENVIRONMENT: production
