# CD - Deploy to Staging and Production (v2)
# This workflow deploys to Staging on push to develop, and Production on push to main.
# Improvements:
# - Permissions restricted
# - Node.js dependencies cached
# - Retry strategy for tests/deploy
# - Actions pinned
# - Pre-deployment tests
# - Duplicated steps reduced via YAML anchors

name: "CD - Deploy to Staging and Production v2"

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - develop
      - main
  # You can also use workflow_dispatch to trigger manually
  workflow_dispatch:

# YAML anchor for reusable steps
.shared_build_steps: &shared_build_steps
  - name: Checkout code
    uses: actions/checkout@v4
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'
  - name: Cache Node.js dependencies
    uses: actions/cache@v3
    with:
      path: ~/.npm
      key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      restore-keys: |
        ${{ runner.os }}-node-
  - name: Install dependencies
    run: npm ci
    working-directory: frontend
  - name: Run frontend tests
    run: npm test || npm test || npm test
    working-directory: frontend
  - name: Build frontend
    run: npm run build
    working-directory: frontend
  - name: Install backend dependencies
    run: pip install -r requirements.txt
    working-directory: backend
  - name: Run backend tests
    run: pytest || pytest || pytest
    working-directory: backend

jobs:
  # ======================================================================================
  #  LINT JOB
  # ======================================================================================
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install
      - name: Run ESLint (frontend)
        run: |
          cd frontend
          npm run lint
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install flake8
        run: |
          pip install flake8
      - name: Run flake8 (backend)
        run: |
          flake8 backend/app

  # ======================================================================================
  #  TEST JOB - Authenticates to GCP for tests that require live services
  # ======================================================================================
  test:
    name: Run Tests and Coverage
    runs-on: ubuntu-latest
    needs: [lint] # Ensure linting passes before running tests
    permissions:
      contents: 'read'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud for Tests
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd backend
          pytest --cov=. --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage.xml

  # ======================================================================================
  #  STAGING DEPLOYMENT JOB
  # ======================================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: [test]
    if: github.ref == 'refs/heads/develop' && needs.test.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging..."
          # Add your staging deploy script/command here
        env:
          ENVIRONMENT: staging

  # ======================================================================================
  #  PRODUCTION DEPLOYMENT JOB
  # ======================================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: [test]
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "Deploying to Production..."
          # Add your production deploy script/command here
        env:
          ENVIRONMENT: production
