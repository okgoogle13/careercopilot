# Deploy Workflow for Node.js Backend with Docker and Firebase
# This workflow runs on pushes to develop branch and covers build, test, lint, Docker push, and Firebase deploy.
# No "--channel" flags are used anywhere.

name: Deploy Backend (Docker + Firebase)

on:
  push:
    branches:
      - develop
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  deployments: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend deps
        # Use `npm install` in CI to tolerate a package.json / package-lock.json drift
        # (the repo's lockfile wasn't updated when vite was bumped). `npm ci` fails
        # when lockfile doesn't match package.json; `npm install` will install
        # compatible versions so the job can continue. Consider updating the
        # lockfile in the repo to restore `npm ci` later.
        run: npm install
        working-directory: ./frontend
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: ./frontend

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 30 # Set a reasonable timeout
    env:
      DOCKER_IMAGE: us-central1-docker.pkg.dev/careercopilot-staging/careercopilot-repo/backend:latest
      FIREBASE_PROJECT: careercopilot-staging

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Step 3: Restore npm cache (for faster installs)
      - name: Restore npm cache  
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
            functions/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Step 4: Check for package-lock.json consistency
      - name: Check for lock file consistency
        run: |
          if [ -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      # Step 5: Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Step 6: Install frontend dependencies  
      - name: Install frontend dependencies
        run: |
          # Clear any problematic cached modules first
          rm -rf node_modules package-lock.json
          npm install
        working-directory: ./frontend
        
      # Step 7: Set up Node.js 22 for functions
      - name: Set up Node.js 22 for functions  
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      # Step 7.1: Install functions dependencies
      - name: Install functions dependencies
        run: npm ci
        working-directory: ./functions

      # Step 8: Lint code (run in frontend directory so Vite/ESLint resolve frontend files)
      - name: Lint code
        run: npm run lint
        working-directory: ./frontend

      # Step 9: Run tests (run in frontend directory)
      - name: Run tests
        run: npm test
        working-directory: ./frontend

      # Step 10: Build project (frontend build — run in frontend directory so Vite finds index.html)
      - name: Build project
        run: npm run build
        working-directory: ./frontend

      # Step 11: Collect build artifacts (optional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            frontend/dist/
            frontend/.next/
            frontend/build/

      # Step 12: Authenticate with Google Cloud using Workload Identity
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/473068119033/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deploy@careercopilot-staging.iam.gserviceaccount.com'
          
      # Step 12.1: Configure Docker for Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      
      # Step 13: Set up Docker Buildx for better caching and multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      # Step 14: Build and push Docker image with layer caching
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 15: Install Firebase CLI
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      # Step 16: Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        working-directory: ./frontend
        run: |
          # Use channel deploy with explicit channelID to avoid "channelID is currently required" error.
          # Deploys to the staging channel named `careercopilot-staging`.
          firebase hosting:channel:deploy careercopilot-staging --project $FIREBASE_PROJECT --token "$FIREBASE_TOKEN"

      # Step 17: Summary output
      - name: Deployment Summary
        run: |
          echo "# Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image: \`$DOCKER_IMAGE\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Firebase project: \`$FIREBASE_PROJECT\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Branch: \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment timestamp: \`$(date)\`" >> $GITHUB_STEP_SUMMARY

      # Step 18: Create deployment status
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          description: 'Deployment from develop branch'
          
      # Step 19: Update deployment status
      - name: Update deployment status
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          state: success
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          environment-url: https://careercopilot-staging.web.app

      # Step 20: Notify on failure (optional)
      - name: Notify failure
        if: failure()
        run: |
          echo "# ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "* Branch: develop" >> $GITHUB_STEP_SUMMARY
          echo "* Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "* See logs above for details" >> $GITHUB_STEP_SUMMARY

# End of workflow file
