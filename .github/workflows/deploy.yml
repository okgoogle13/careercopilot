# .github/workflows/deploy.yml
name: CD - Deploy to Staging and Production

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  # Prevent concurrent deployments to avoid conflicts
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false  # Queue deployments instead of canceling

env:
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_IMAGE_NAME: backend

jobs:
  pre-deploy-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.check.outputs.environment }}
      commit-sha: ${{ steps.vars.outputs.commit_sha }}
      run_id: ${{ steps.vars.outputs.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.1.7

      - name: Determine Environment
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
              echo "environment=staging" >> $GITHUB_OUTPUT
            elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
              echo "environment=production" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set Commit SHA and Run ID
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "commit_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
            # For manual dispatch, use latest successful CI run or current commit
            CI_RUNS_JSON=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1")
            CI_RUN_ID=$(python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('workflow_runs') or [{}])[0].get('id',''))" <<<"$CI_RUNS_JSON")
            echo "run_id=${CI_RUN_ID:-${{ github.run_id }}}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ needs.pre-deploy-checks.outputs.environment }}
    needs: [pre-deploy-checks]
    uses: ./.github/workflows/_reusable_deploy.yml
    secrets: inherit
    with:
      environment: ${{ needs.pre-deploy-checks.outputs.environment }}
      commit-sha: ${{ needs.pre-deploy-checks.outputs.commit-sha }}
      ci-run-id: ${{ needs.pre-deploy-checks.outputs.run_id }}
