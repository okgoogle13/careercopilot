name: Auto Fix Linting Issues
on:
  push:
    branches: [develop, main]
    paths:
      - "frontend/src/**"
      - "backend/**"
      - "functions/src/**"
      - "!backend/migrations/**"
  pull_request:
    branches: [develop, main]
    paths:
      - "frontend/src/**"
      - "backend/**"
      - "functions/src/**"
      - "!backend/migrations/**"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-fix:
    name: Auto Fix Code Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !contains(github.event.head_commit.message, '[skip auto-fix]') && !contains(github.event.head_commit.message, 'ðŸ¤– Auto-fix') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@8812c3c1f0100d3387da74b41da4AAc4a16b9b32
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Set up Node.js
        uses: actions/setup-node@4a73359c983a54e9357d609c13b3e8e7f1012f20
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: "yarn.lock"
      - name: Enable Corepack for Yarn 4
        run: corepack enable
      - name: Cache functions node_modules
        uses: actions/cache@88522ab9f39a2ea568f7027eddc7d8d8bc9d59c8
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-npm-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-functions-
      - name: Install Python formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.3.0 isort==5.13.2 flake8==7.0.0 autoflake==2.3.1
      - name: Install Node dependencies
        run: |
          yarn install --immutable
          cd functions && npm ci
      - name: Check for changes needed
        id: changes
        run: |
          echo "Checking if auto-fixes are needed..."
          CHANGES_NEEDED=false
          if ! black --check backend/ --line-length=100 --quiet; then
            echo "Python formatting changes needed"
            CHANGES_NEEDED=true
          elif ! isort --check-only backend/ --profile=black --line-length=100 --quiet; then
            echo "Python import sorting changes needed"
            CHANGES_NEEDED=true
          fi
          if ! yarn workspace careercopilot-frontend lint --quiet; then
            echo "ESLint fixes needed"
            CHANGES_NEEDED=true
          elif ! yarn workspace careercopilot-frontend format:check --quiet; then
            echo "Prettier formatting needed"
            CHANGES_NEEDED=true
          fi
          if ! yarn workspace functions lint --silent; then
            echo "Functions linting fixes needed"
            CHANGES_NEEDED=true
          fi
          if [[ "$CHANGES_NEEDED" == "true" ]]; then
            echo "changes_needed=true" >> $GITHUB_OUTPUT
          else
            echo "changes_needed=false" >> $GITHUB_OUTPUT
          fi
      - name: Apply Python formatting fixes
        if: steps.changes.outputs.changes_needed == 'true'
        run: |
          echo "ðŸ Applying Python formatting fixes..."
          black backend/ --line-length=100
          isort backend/ --profile=black --line-length=100
          autoflake --remove-all-unused-imports --remove-unused-variables --in-place --recursive backend/
          echo "âœ… Python formatting complete"
      - name: Apply Frontend formatting fixes
        if: steps.changes.outputs.changes_needed == 'true'
        run: |
          echo "âš›ï¸ Applying Frontend formatting fixes..."
          yarn workspace careercopilot-frontend format || true
          yarn workspace careercopilot-frontend lint:fix || true
          echo "âœ… Frontend formatting complete"
      - name: Apply Functions linting fixes
        if: steps.changes.outputs.changes_needed == 'true'
        run: |
          echo "ðŸ”§ Applying Functions linting fixes..."
          yarn workspace functions lint:fix || true
          echo "âœ… Functions linting fixes complete"
      - name: Check if changes were made
        id: git-check
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Auto-Fix"
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes_made=true" >> $GITHUB_OUTPUT
          else
            echo "changes_made=false" >> $GITHUB_OUTPUT
            echo "âœ¨ No changes needed - code is already properly formatted!"
          fi
      - name: Commit and push changes
        if: steps.git-check.outputs.changes_made == 'true'
        run: |
          git add -A
          git commit -m "ðŸ¤– Auto-fix: Apply linting and formatting [skip ci]"
          git push
      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && steps.git-check.outputs.changes_made == 'true'
        uses: actions/github-script@a3f4296062b40a34b7f5a4de8392b45f18ddab21
        with:
          script: |
            let body = 'ðŸ¤– **Auto-fix applied!**

I automatically fixed linting and formatting issues. Your code is now up to standard.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });