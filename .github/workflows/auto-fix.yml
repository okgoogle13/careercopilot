# .github/workflows/auto-fix-enhanced.yml
name: Enhanced Auto Fix (TypeScript + Linting)

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/src/**'
      - 'backend/**'
      - 'functions/src/**'
      - '!backend/migrations/**'
  workflow_dispatch:
    inputs:
      fix_type:
        description: 'Type of fixes to apply'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - typescript
          - linting
          - formatting
          - storybook

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  # Prevent multiple auto-fix runs on the same PR/branch
  # Using github.sha ensures we queue runs instead of canceling
  group: auto-fix-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false  # Queue runs instead of canceling to avoid losing fixes

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"  # Standards established in CI.yml

jobs:
  auto-fix-enhanced:
    name: Enhanced Auto Fix
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip auto-fix]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Verify git repository state
        run: |
          echo "🔍 Checking git repository state..."
          
          # Remove any stale lock files from previous failed runs
          find .git -name "*.lock" -type f -delete 2>/dev/null || true
          
          # Verify repository is in good state
          git status
          
          # Display git configuration for debugging
          echo "📋 Git configuration:"
          git config --list --local
          
          echo "✅ Git repository state verified"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: "yarn.lock"

      # ============================================================
      # PYTHON AUTO-FIXES
      # ============================================================
      - name: Install Python formatting tools
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'formatting' || github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install black==24.3.0 isort==5.13.2 flake8==7.0.0 autoflake==2.3.1

      - name: Apply Python formatting fixes
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'formatting' || github.event_name == 'pull_request'
        run: |
          echo "🐍 Applying Python formatting fixes..."
          black backend/ --line-length=100
          isort backend/ --profile=black --line-length=100
          autoflake --remove-all-unused-imports --remove-unused-variables --in-place --recursive backend/
          echo "✅ Python formatting complete"

      # ============================================================
      # TYPESCRIPT AUTO-FIXES
      # ============================================================
      - name: Install Node dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Run TypeScript auto-fix (unused imports, organize imports)
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'typescript' || github.event_name == 'pull_request'
        run: |
          echo "🔷 Running TypeScript auto-fixes..."

          # Create a Node.js script to fix TypeScript issues using ts-morph
          cat > ts-autofix.mjs << 'EOFSCRIPT'
          import { Project } from 'ts-morph';
          import { existsSync } from 'fs';

          async function fixTypeScriptIssues() {
            if (!existsSync('./frontend/tsconfig.json')) {
              console.error('❌ tsconfig.json not found in frontend/');
              return;
            }

            const project = new Project({
              tsConfigFilePath: './frontend/tsconfig.json',
            });

            const sourceFiles = project.getSourceFiles();
            let fixedCount = 0;

            for (const sourceFile of sourceFiles) {
              const filePath = sourceFile.getFilePath();

              if (filePath.includes('node_modules') || 
                  filePath.includes('/dist/') || 
                  filePath.includes('.test.')) {
                continue;
              }

              sourceFile.fixUnusedIdentifiers();
              sourceFile.organizeImports({
                ensureNewLineAtEndOfFile: true,
              });

              await sourceFile.save();
              fixedCount++;
            }

            console.log(`\n✅ Fixed ${fixedCount} TypeScript files`);
          }

          fixTypeScriptIssues().catch(console.error);
          EOFSCRIPT

          node ts-autofix.mjs
          echo "✅ TypeScript auto-fix complete"

      # ============================================================
      # ESLINT AUTO-FIXES
      # ============================================================
      - name: Apply ESLint auto-fixes
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'linting' || github.event_name == 'pull_request'
        run: |
          echo "🔧 Applying ESLint fixes..."
          yarn workspace careercopilot-frontend lint:fix
          yarn workspace functions lint:fix
          echo "✅ ESLint fixes complete"

      # ============================================================
      # PRETTIER AUTO-FIXES
      # ============================================================
      - name: Apply Prettier formatting
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'formatting' || github.event_name == 'pull_request'
        run: |
          echo "💅 Applying Prettier formatting..."
          yarn workspace careercopilot-frontend format
          echo "✅ Prettier formatting complete"

      # ============================================================
      # STORYBOOK AUTOMATION
      # ============================================================
      - name: Check for missing stories
        id: storybook-check
        if: github.event.inputs.fix_type == 'all' || github.event.inputs.fix_type == 'storybook' || github.event_name == 'pull_request'
        run: |
          echo "📚 Scanning for components without stories..."
          MISSING_STORIES=0
          for component in frontend/src/components/ui/*.tsx; do
            if [[ "$component" == *"utils.ts"* ]] || [[ "$component" == *"index.ts"* ]]; then continue; fi
            filename=$(basename -- "$component")
            basename="${filename%.*}"
            if [ ! -f "frontend/src/components/ui/${basename}.stories.tsx" ]; then
              echo "⚠️  Missing story for: ${basename}"
              MISSING_STORIES=$((MISSING_STORIES + 1))
            fi
          done
          echo "missing_count=$MISSING_STORIES" >> $GITHUB_OUTPUT
          if [ $MISSING_STORIES -gt 0 ]; then
            echo "::warning::$MISSING_STORIES components are missing Storybook stories."
          fi

      # ============================================================
      # ELECTRIC ALCHEMIST / M3 TOKEN COMPLIANCE
      # ============================================================
      - name: Check Electric Alchemist Token Compliance
        id: design-check
        run: |
          echo "🎨 Checking Electric Alchemist token compliance..."

          # Improved check: look for hardcoded hex codes AND non-tokenized CSS vars
          # Exceptions: black/white and valid design tokens
          HARDCODED_COLORS=$(grep -rnE "color:\s*#[0-9a-fA-F]{3,6}" frontend/src/ --include="*.tsx" --include="*.css" | grep -v "000" | grep -v "fff" | wc -l)
          RAW_PIXELS=$(grep -rnE "(padding|margin|gap|border-radius):\s*[0-9]{2,}px" frontend/src/ --include="*.tsx" --include="*.css" | wc -l)

          echo "❌ Found $HARDCODED_COLORS hardcoded color values"
          echo "❌ Found $RAW_PIXELS large hardcoded pixel values (>10px)"

          if [ $HARDCODED_COLORS -gt 0 ] || [ $RAW_PIXELS -gt 0 ]; then
            echo "violations=true" >> $GITHUB_OUTPUT
          else
            echo "violations=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # COMMIT CHANGES
      # ============================================================
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes_made=true" >> $GITHUB_OUTPUT

      - name: Clean up stale git locks
        if: steps.git-check.outputs.changes_made == 'true'
        run: |
          echo "🧹 Cleaning up any stale git lock files..."
          # Remove stale lock files that might cause issues
          rm -f .git/index.lock .git/HEAD.lock .git/refs/heads/*.lock 2>/dev/null || true
          echo "✅ Lock file cleanup complete"

      - name: Commit and push changes with retry
        if: steps.git-check.outputs.changes_made == 'true'
        env:
          # Prevent system-level git config conflicts
          GIT_CONFIG_SYSTEM: ""
        run: |
          set +e  # Don't exit on error, we'll handle retries
          
          echo "🔧 Configuring git..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Auto-Fix Bot"
          
          echo "📦 Staging changes..."
          git add .
          
          echo "💾 Committing changes..."
          git commit -m "style(auto): Apply Electric Alchemist auto-fixes [skip ci]" \
            -m "Applied standard formatting and linting for TS, Python, and CSS."
          
          # Retry logic for git push with exponential backoff
          MAX_RETRIES=5
          RETRY_COUNT=0
          RETRY_DELAY=2
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "🚀 Attempting to push (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)..."
            
            # Clean up any stale locks before push
            rm -f .git/index.lock .git/HEAD.lock 2>/dev/null || true
            
            # Try to push
            if git push; then
              echo "✅ Push successful!"
              exit 0
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️  Push failed, waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
                # Exponential backoff
                RETRY_DELAY=$((RETRY_DELAY * 2))
                
                # Try to pull and rebase in case of conflicts
                echo "🔄 Pulling latest changes..."
                git pull --rebase origin ${{ github.head_ref || github.ref_name }} || true
              else
                echo "❌ Push failed after $MAX_RETRIES attempts"
                echo "This may be due to concurrent workflow runs. The changes are committed locally."
                exit 1
              fi
            fi
          done

      # ============================================================
      # PR NOTIFICATIONS
      # ============================================================
      - name: Comment on PR
        if: github.event_name == 'pull_request' && (steps.git-check.outputs.changes_made == 'true' || steps.design-check.outputs.violations == 'true' || steps.storybook-check.outputs.missing_count > 0)
        uses: actions/github-script@v7
        with:
          script: |
            const changes = '${{ steps.git-check.outputs.changes_made }}' === 'true';
            const designViolations = '${{ steps.design-check.outputs.violations }}' === 'true';
            const missingStories = parseInt('${{ steps.storybook-check.outputs.missing_count }}' || '0');

            let body = '🤖 **Auto-fix Workflow Summary**\n\n';
            
            if (changes) {
              body += '✅ **Applied Fixed:** Standardized code formatting and linting.\n';
            }

            if (designViolations) {
              body += '⚠️  **Design System Non-Compliance:** Found hardcoded colors or sizing. Please use **Electric Alchemist** tokens (e.g., `var(--sys-color-primary)`).\n';
            }

            if (missingStories > 0) {
              body += `📚 **Storybook Gap:** Found ${missingStories} components without stories. Automated documentation is recommended.\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
