# .github/workflows/_reusable_deploy.yml

name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      ci-run-id:
        required: true
        type: string

env:
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_IMAGE_NAME: backend

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.1.7

      - name: Set environment variables
        id: env-vars
        run: |
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            echo "GCP_PROJECT_ID=careercopilot-staging" >> $GITHUB_ENV
            echo "GCP_REPOSITORY=careercopilot-repo" >> $GITHUB_ENV
            # Using FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT_STAGING for staging
            echo "FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT_STAGING }}'" >> $GITHUB_ENV
            # Write the service account to a file for debugging
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT_STAGING }}" > /tmp/firebase-service-account.json
          elif [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "GCP_PROJECT_ID=careercopilot-468811" >> $GITHUB_ENV
            echo "GCP_REPOSITORY=careercopilot" >> $GITHUB_ENV
            # Using FIREBASE_SERVICE_ACCOUNT for production
            echo "FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'" >> $GITHUB_ENV
            # Write the service account to a file for debugging
            echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > /tmp/firebase-service-account.json
          fi
          
          # Set WIF provider and service account based on environment
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            echo "WIF_PROVIDER=${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT=${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          else
            echo "WIF_PROVIDER=${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT=${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
          fi

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-dist
          path: frontend/dist
          run-id: ${{ inputs.ci-run-id }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2 # v2.1.3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Debug - Print Firebase Service Account
        if: ${{ always() }}
        run: |
          echo "FIREBASE_SERVICE_ACCOUNT: $FIREBASE_SERVICE_ACCOUNT"
          if [ -f "/tmp/firebase-service-account.json" ]; then
            echo "Service account file exists, contents:"
            cat /tmp/firebase-service-account.json
          else
            echo "Service account file not found"
          fi

      - name: Deploy Frontend
        uses: FirebaseExtended/action-hosting-deploy@v0 # v0.10.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: /tmp/firebase-service-account.json
          channelId: live
          projectId: ${{ env.GCP_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2 # v2.1.0

      - name: Verify Backend Image Tag Exists
        id: verify-image
        run: |
          SHORT_SHA="${{ inputs.commit-sha }}"
          IMAGE_TAG_SHA="${SHORT_SHA:0:7}"
          IMAGE_PATH="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"
          echo "Checking for image tag: $IMAGE_TAG_SHA in $IMAGE_PATH"
          if gcloud artifacts docker tags list "$IMAGE_PATH" --format="value(tag)" | grep -q "^${IMAGE_TAG_SHA}$"; then
            echo "Image tag $IMAGE_TAG_SHA verified."
            echo "image_tag=${IMAGE_TAG_SHA}" >> $GITHUB_OUTPUT
          else
            echo "::error::Image tag $IMAGE_TAG_SHA not found."
            exit 1
          fi

      - name: Deploy Backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2 # v2.1.0
        with:
          service: backend
          image: ${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ steps.verify-image.outputs.image_tag }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Health check for backend
        id: health-check
        run: |
          SERVICE_URL="${{ steps.deploy-backend.outputs.url }}"
          echo "Checking health of backend at $SERVICE_URL/health"
          MAX_RETRIES=24
          RETRY_DELAY=5
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Backend is healthy"
              exit 0
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Backend not ready yet (attempt $i/$MAX_RETRIES), HTTP status: $HTTP_STATUS. Retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            fi
          done
          echo "Backend health check failed after $MAX_RETRIES attempts"
          exit 1
