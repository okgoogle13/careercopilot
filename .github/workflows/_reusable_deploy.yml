# .github/workflows/_reusable_deploy.yml

name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      ci-run-id:
        required: true
        type: string

env:
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_IMAGE_NAME: backend

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: env-vars
        run: |
          if [[ "${{ inputs.environment }}" == "staging" ]]; then
            echo "GCP_PROJECT_ID=careercopilot-staging" >> $GITHUB_ENV
            echo "GCP_REPOSITORY=careercopilot-repo" >> $GITHUB_ENV
            echo "WIF_PROVIDER=${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT=${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
            echo "VERCEL_ENV=preview" >> $GITHUB_ENV
          elif [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "GCP_PROJECT_ID=careercopilot-468811" >> $GITHUB_ENV
            echo "GCP_REPOSITORY=careercopilot" >> $GITHUB_ENV
            echo "WIF_PROVIDER=${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER }}" >> $GITHUB_ENV
            echo "SERVICE_ACCOUNT=${{ secrets.PROD_GCP_SERVICE_ACCOUNT }}" >> $GITHUB_ENV
            echo "VERCEL_ENV=production" >> $GITHUB_ENV
          fi

      # ── Frontend: Deploy to Vercel ───────────────────────────────────────────

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build frontend with Vercel
        run: vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel
        id: deploy-frontend
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "deploy_url=${DEPLOY_URL}" >> $GITHUB_OUTPUT
          echo "🚀 Frontend deployed to: ${DEPLOY_URL}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Backend: Build Docker image and deploy to Cloud Run ──────────────────

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build-image
        run: |
          SHORT_SHA="${{ inputs.commit-sha }}"
          IMAGE_TAG="${SHORT_SHA:0:7}"
          IMAGE_BASE="${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"
          CACHE_IMAGE="${IMAGE_BASE}:buildcache"

          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --cache-from type=registry,ref=${CACHE_IMAGE} \
            --cache-to type=registry,ref=${CACHE_IMAGE},mode=max \
            --tag "${IMAGE_BASE}:${IMAGE_TAG}" \
            --tag "${IMAGE_BASE}:latest" \
            --push \
            ./backend

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_BASE}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Deploy backend to Cloud Run
        id: deploy-backend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: backend
          image: ${{ steps.build-image.outputs.image_uri }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Health check for backend
        run: |
          SERVICE_URL="${{ steps.deploy-backend.outputs.url }}"
          echo "Checking health of backend at $SERVICE_URL/health"
          MAX_RETRIES=24
          RETRY_DELAY=5
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "Backend not ready (attempt $i/$MAX_RETRIES), status: $HTTP_STATUS. Retrying..."
            sleep $RETRY_DELAY
          done
          echo "::error::Backend health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment to ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (Vercel) | ✅ Deployed | ${{ steps.deploy-frontend.outputs.deploy_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend (Cloud Run) | ✅ Deployed | ${{ steps.deploy-backend.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
