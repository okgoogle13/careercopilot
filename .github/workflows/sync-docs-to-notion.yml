name: Sync Docs to Notion

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docs/**/*.md'
      - '.github/workflows/sync-docs-to-notion.yml'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v41
        with:
          files: docs/**/*.md

      - name: Sync changed docs to Notion
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 scripts/docs-to-notion.py
          echo "✓ Docs synced to Notion"

      - name: Log sync status
        run: |
          echo "Sync workflow completed"
          echo "For setup instructions, see docs/automation/NOTION_SYNC_CONFIG.md"
