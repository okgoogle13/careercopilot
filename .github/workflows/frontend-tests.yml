name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Start frontend (background)
        run: npm run dev &
        working-directory: ./frontend
      - name: Wait for frontend
        run: npx wait-on http://localhost:5173
        working-directory: ./frontend
      - name: Run E2E tests (Cypress)
        run: npx cypress run --spec "e2e/sample.cy.ts"
        working-directory: ./frontend
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ./frontend/cypress/results

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Start Storybook (background)
        run: npm run storybook &
        working-directory: ./frontend
      - name: Wait for Storybook
        run: npx wait-on http://localhost:6006
        working-directory: ./frontend
      - name: Run Percy visual regression
        run: npx percy exec -- npx playwright test .storybook/visual.test.js
        working-directory: ./frontend
      - name: Upload Percy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percy-results
          path: ./frontend/.percy
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Check lock file consistency
        run: |
          git diff --exit-code package-lock.json || (echo "package-lock.json is out of sync. Please run 'npm install' and commit the changes." && exit 1)

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Check Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage and enforce thresholds
        run: npm run test:ci -- --coverage.threshold=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./frontend/coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./frontend/coverage
