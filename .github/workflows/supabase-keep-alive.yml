name: Supabase Keep-Alive

on:
  schedule:
    # Run at 00:00 UTC every Monday and Thursday (twice a week is enough)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ping Supabase Database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set."
            echo "Please add DATABASE_URL to your GitHub Repository Secrets."
            exit 1
          fi
          
          # Use pg_isready to check connection
          # We check the default 'postgres' database
          psql "$DATABASE_URL" -c 'SELECT 1;'
        continue-on-error: false
