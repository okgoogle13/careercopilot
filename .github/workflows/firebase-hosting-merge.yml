# This file was auto-generated by the Firebase CLI and updated for MUI project structure
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - develop

env:
  NODE_VERSION: '20'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: 'false'
          upload-artifacts: 'false'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT_STAGING }}
          channelId: live
          projectId: careercopilot-staging
        timeout-minutes: 10

      - name: Health check
        run: |
          echo "🏥 Checking deployment health..."
          sleep 15  # Allow time for propagation
          if curl -f -s -m 30 "https://careercopilot-staging.web.app" > /dev/null; then
            echo "✅ Firebase hosting deployment successful"
          else
            echo "❌ Firebase hosting deployment failed health check"
            exit 1
          fi
