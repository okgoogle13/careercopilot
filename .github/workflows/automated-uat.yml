name: Automated UAT - Career Ingestion

on:
  pull_request:
    paths:
      - "frontend/src/pages/IngestionPage.tsx"
      - "frontend/src/features/onboarding/**"
      - "frontend/src/hooks/useCareerIngestion.ts"
      - "backend/app/api/routes/ingestion.py"
      - "backend/app/flows/ingestion_flow.py"
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"

jobs:
  automated-uat:
    name: E2E UAT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        run: yarn workspace careercopilot-frontend playwright install --with-deps chromium

      - name: Start backend dev server
        run: |
          cd backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/backend.pid
          echo "Checking backend health..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done
        env:
          ENVIRONMENT: test

      - name: Build and serve frontend
        run: |
          yarn workspace careercopilot-frontend build
          npx serve -s frontend/dist -l 5173 &
          echo $! > /tmp/frontend.pid
          echo "Checking frontend health..."
          for i in {1..30}; do
            if curl -f http://localhost:5173 2>/dev/null; then
              echo "✅ Frontend is healthy"
              break
            fi
            echo "Attempt $i/30: Frontend not ready yet..."
            sleep 2
          done

      - name: Run E2E UAT Tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: yarn workspace careercopilot-frontend playwright test tests/e2e/ingestion-flow.spec.ts --reporter=html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/backend.pid) 2>/dev/null || true
          kill $(cat /tmp/frontend.pid) 2>/dev/null || true

  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: automated-uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Visual Tests
        run: yarn workspace careercopilot-frontend playwright test tests/visual/ --update-snapshots

      - name: Upload Visual Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: frontend/test-results/
          retention-days: 7

  performance-testing:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    needs: automated-uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5173/career/ingest
          uploadArtifacts: true
          temporaryPublicStorage: true

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Frontend Security Audit
        run: yarn npm audit

      - name: Run Backend Security Scan
        working-directory: ./backend
        run: |
          python -m pip install safety
          safety check --file requirements.txt

  uat-summary:
    name: Generate UAT Summary
    runs-on: ubuntu-latest
    needs:
      [automated-uat, visual-regression, performance-testing, security-scan]
    if: always()
    steps:
      - name: Generate Summary Report
        run: |
          echo "# 🧪 Automated UAT Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status Matrix" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| E2E UAT | ${{ needs.automated-uat.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual | ${{ needs.visual-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
