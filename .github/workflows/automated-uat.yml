name: Automated UAT - Career Ingestion

on:
  pull_request:
    paths:
      - 'frontend/src/pages/IngestionPage.tsx'
      - 'frontend/src/features/onboarding/**'
      - 'frontend/src/hooks/useCareerIngestion.ts'
      - 'backend/app/api/routes/ingestion.py'
      - 'backend/app/flows/ingestion_flow.py'
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  automated-uat:
    name: E2E UAT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Mock Firestore emulator
      firestore:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Start Firestore Emulator
        run: |
          gcloud emulators firestore start --host-port=localhost:8080 &
          sleep 5

      - name: Start Backend Server
        working-directory: ./backend
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          ENABLE_GENKIT_FLOWS: "true"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ENV: test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health || exit 1

      - name: Start Frontend Dev Server
        working-directory: ./frontend
        env:
          VITE_API_URL: http://localhost:8000
          VITE_USE_MOCK_AUTH: "true"
        run: |
          npm run dev &
          sleep 15
          curl -f http://localhost:5173 || exit 1

      - name: Run E2E UAT Tests
        working-directory: ./frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test tests/e2e/ingestion-flow.spec.ts --reporter=html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload Test Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-videos
          path: frontend/test-results/
          retention-days: 7

      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: daun/playwright-report-comment@v3
        with:
          report-path: frontend/playwright-report/
          github-token: ${{ secrets.GITHUB_TOKEN }}

  visual-regression:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    needs: automated-uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need history for comparison

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Visual Tests
        working-directory: ./frontend
        run: npx playwright test tests/visual/ --update-snapshots

      - name: Upload Visual Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: frontend/test-results/
          retention-days: 7

  performance-testing:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    needs: automated-uat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:5173/career/ingest
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Load Test
        run: |
          npm install -g artillery
          artillery quick --count 10 --num 50 http://localhost:8000/api/v1/ingest

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Frontend Security Scan
        working-directory: ./frontend
        run: |
          npm audit --production
          npx snyk test || true

      - name: Run Backend Security Scan
        working-directory: ./backend
        run: |
          pip install safety
          safety check --file requirements.txt

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'CareerCopilot'
          path: '.'
          format: 'HTML'

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: reports/

  uat-summary:
    name: Generate UAT Summary
    runs-on: ubuntu-latest
    needs: [automated-uat, visual-regression, performance-testing, security-scan]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Summary Report
        run: |
          echo "# 🧪 Automated UAT Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.automated-uat.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Visual Regression: ${{ needs.visual-regression.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance-testing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- [Playwright Report](playwright-report/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Scan](security-scan-report/)" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ UAT Failed for Career Ingestion",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*UAT Failure Alert*\n\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\n\nView results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
