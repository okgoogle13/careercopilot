name: Build & Test Parallel CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: true
        type: boolean

jobs:
  build-and-test-parallel:
    name: Build & Test Parallel
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run build and all tests in parallel
        run: npm run build-and-test:parallel
        env:
          CI: true

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1
