name: Automated Deployment

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  deployments: write
  checks: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  check-deployment-eligibility:
    name: Check Deployment Eligibility
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy-staging: ${{ steps.check.outputs.staging }}
      should-deploy-production: ${{ steps.check.outputs.production }}
      environment: ${{ steps.check.outputs.environment }}

    steps:
      - name: Check deployment conditions
        id: check
        run: |
          echo "🔍 Checking deployment eligibility"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow: ${{ github.event.workflow_run.name }}"

          # Determine deployment targets based on branch
          if [[ "${{ github.event.workflow_run.head_branch }}" == "develop" ]]; then
            echo "staging=true" >> $GITHUB_OUTPUT
            echo "production=false" >> $GITHUB_OUTPUT
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "✅ Eligible for staging deployment"
          elif [[ "${{ github.event.workflow_run.head_branch }}" == "main" ]]; then
            echo "staging=false" >> $GITHUB_OUTPUT
            echo "production=true" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "✅ Eligible for production deployment"
          else
            echo "staging=false" >> $GITHUB_OUTPUT
            echo "production=false" >> $GITHUB_OUTPUT
            echo "environment=none" >> $GITHUB_OUTPUT
            echo "❌ Branch not eligible for automatic deployment"
          fi

  # Automated Staging Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: check-deployment-eligibility
    if: needs.check-deployment-eligibility.outputs.should-deploy-staging == 'true'
    environment:
      name: staging
      url: https://careercopilot-staging.web.app

    steps:
      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.workflow_run.head_sha }}',
              environment: 'staging',
              description: 'Automated staging deployment after successful CI',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deployment started'
            });

            return deployment.data.id;

      - name: Trigger staging deployment
        run: |
          echo "🚀 Triggering automated staging deployment"

          gh workflow run deploy.yml \
            --ref ${{ github.event.workflow_run.head_branch }} \
            -f environment=staging \
            -f skip_artifact_download=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for deployment completion
        run: |
          echo "⏳ Waiting for deployment to complete..."
          sleep 60  # Give deployment time to start

          # Monitor deployment status (simplified)
          for i in {1..20}; do
            echo "🔍 Checking deployment status (attempt $i/20)"

            # Check if staging site is responding
            if curl -f -s -m 30 "https://careercopilot-staging.web.app" > /dev/null; then
              echo "✅ Staging deployment appears successful"
              break
            fi

            if [ $i -eq 20 ]; then
              echo "❌ Deployment verification timeout"
              exit 1
            fi

            sleep 30
          done

  # Automated Production Deployment (with additional safety checks)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: check-deployment-eligibility
    if: needs.check-deployment-eligibility.outputs.should-deploy-production == 'true'
    environment:
      name: production
      url: https://careercopilot-468811.web.app

    steps:
      - name: Checkout for safety checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Production deployment safety checks
        run: |
          echo "🛡️ Running production deployment safety checks"

          # Check if this is a fast-forward merge
          recent_commits=$(git log --oneline -5)
          echo "Recent commits:"
          echo "$recent_commits"

          # Check for any "revert" commits in recent history
          if echo "$recent_commits" | grep -i "revert"; then
            echo "⚠️ Recent revert commit detected - deployment may be risky"
          fi

          # Check commit message for deployment flags
          commit_msg=$(git log -1 --pretty=%B)
          if echo "$commit_msg" | grep -i "\[skip deploy\]"; then
            echo "❌ Deployment skipped due to [skip deploy] flag"
            exit 1
          fi

          echo "✅ Safety checks passed"

      - name: Create production deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ github.event.workflow_run.head_sha }}',
              environment: 'production',
              description: 'Automated production deployment after successful CI on main',
              auto_merge: false,
              required_contexts: []
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Production deployment started'
            });

            core.setOutput('deployment-id', deployment.data.id);
            return deployment.data.id;

      - name: Trigger production deployment
        run: |
          echo "🚀 Triggering automated production deployment"

          gh workflow run deploy.yml \
            --ref ${{ github.event.workflow_run.head_branch }} \
            -f environment=production \
            -f skip_artifact_download=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Monitor production deployment
        run: |
          echo "🔍 Monitoring production deployment health"

          # Wait for deployment to propagate
          sleep 120

          # Health check with retry
          for i in {1..15}; do
            echo "🏥 Health check attempt $i/15"

            # Check frontend health
            if curl -f -s -m 30 "https://careercopilot-468811.web.app" > /dev/null; then
              echo "✅ Frontend is healthy"
              frontend_healthy=true
            else
              echo "❌ Frontend health check failed"
              frontend_healthy=false
            fi

            # Check backend health (if available)
            if curl -f -s -m 30 "https://careercopilot-backend-production-355154528491.us-central1.run.app/health" > /dev/null; then
              echo "✅ Backend is healthy"
              backend_healthy=true
            else
              echo "❌ Backend health check failed"
              backend_healthy=false
            fi

            if [[ "$frontend_healthy" == "true" && "$backend_healthy" == "true" ]]; then
              echo "✅ Production deployment health checks passed"
              break
            fi

            if [ $i -eq 15 ]; then
              echo "❌ Production health checks failed after 15 attempts"
              exit 1
            fi

            sleep 30
          done

      - name: Update deployment status on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment-id }}',
              state: 'success',
              description: 'Production deployment completed successfully',
              environment_url: 'https://careercopilot-468811.web.app'
            });

      - name: Update deployment status on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: '${{ steps.deployment.outputs.deployment-id }}',
              state: 'failure',
              description: 'Production deployment failed'
            });

      - name: Create GitHub Release
        if: success() && needs.check-deployment-eligibility.outputs.environment == 'production'
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = `v${context.runNumber}-${context.sha.substring(0, 7)}`;

            try {
              const release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                name: `Production Release ${tagName}`,
                body: `🚀 **Automated Production Deployment**

                **Commit**: ${context.sha}
                **Branch**: ${{ github.event.workflow_run.head_branch }}
                **Deployed**: ${new Date().toISOString()}

                **Deployment URLs:**
                - Frontend: https://careercopilot-468811.web.app
                - Backend: https://careercopilot-backend-production-355154528491.us-central1.run.app

                **Features:**
                - ✅ AI Cost Optimization System Active
                - ✅ Redis Caching Enabled
                - ✅ Comprehensive Monitoring
                - ✅ Automated Health Checks

                **Quality Metrics:**
                - All tests passed ✅
                - Security scans clean ✅
                - Performance within baseline ✅
                `,
                draft: false,
                prerelease: false
              });

              console.log(`Created release: ${release.data.html_url}`);
            } catch (error) {
              console.log(`Release creation failed: ${error.message}`);
            }

  # Deployment Notification
  notify-deployment:
    name: Notify Deployment Results
    runs-on: ubuntu-latest
    needs: [check-deployment-eligibility, deploy-staging, deploy-production]
    if: always() && needs.check-deployment-eligibility.outputs.environment != 'none'

    steps:
      - name: Deployment summary
        run: |
          echo "📋 Deployment Summary"
          echo "===================="
          echo "Environment: ${{ needs.check-deployment-eligibility.outputs.environment }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"

          if [[ "${{ needs.deploy-staging.result }}" == "success" ]]; then
            echo "✅ Staging deployment: SUCCESS"
          elif [[ "${{ needs.deploy-staging.result }}" == "failure" ]]; then
            echo "❌ Staging deployment: FAILED"
          fi

          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "✅ Production deployment: SUCCESS"
          elif [[ "${{ needs.deploy-production.result }}" == "failure" ]]; then
            echo "❌ Production deployment: FAILED"
          fi