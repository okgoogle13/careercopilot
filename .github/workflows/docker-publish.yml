name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
      - chromebook
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      registry:
        description: 'Registry to push to (gcr.io or dockerhub)'
        required: true
        default: 'gcr.io'
        type: choice
        options:
          - gcr.io
          - dockerhub

env:
  # GCP Configuration
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCR_REGISTRY: gcr.io/${{ secrets.GCP_PROJECT_ID }}/careercopilot
  
  # Docker Hub Configuration
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_REPO: careercopilot-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Use production environment to access environment secrets
    environment: production
    
    permissions:
      contents: read
      packages: write
      id-token: write  # For GCP Workload Identity
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
      
      # ============================================
      # Google Cloud Registry (GCR) Flow
      # ============================================
      - name: Authenticate to Google Cloud
        if: github.event.inputs.registry == 'gcr.io' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chromebook' || github.ref == 'refs/heads/develop'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Configure Docker for GCR
        if: github.event.inputs.registry == 'gcr.io' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chromebook' || github.ref == 'refs/heads/develop'
        run: |
          gcloud auth configure-docker gcr.io
      
      - name: Build and Push to GCR
        if: github.event.inputs.registry == 'gcr.io' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chromebook' || github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GCR_REGISTRY }}:latest
            ${{ env.GCR_REGISTRY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # ============================================
      # Docker Hub Flow
      # ============================================
      - name: Log in to Docker Hub
        if: github.event.inputs.registry == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and Push to Docker Hub
        if: github.event.inputs.registry == 'dockerhub'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # ============================================
      # Summary
      # ============================================
      - name: Build Summary
        run: |
          echo "## Docker Build Complete! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.registry }}" == "gcr.io" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "**Registry:** GCR (gcr.io)" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ env.GCR_REGISTRY }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pull with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.GCR_REGISTRY }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ github.event.inputs.registry }}" == "dockerhub" ]]; then
            echo "**Registry:** Docker Hub" >> $GITHUB_STEP_SUMMARY
            echo "**Image:** \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}:latest\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pull with:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
