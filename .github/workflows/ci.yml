name: CI - Build and Test
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: "true"
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: "false"
        type: boolean
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend
jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
      firestore_rules: ${{ steps.filter.outputs.firestore_rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      codeql_py: ${{ steps.filter.outputs.codeql_py }}
      codeql_js: ${{ steps.filter.outputs.codeql_js }}
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
        with:
          fetch-depth: 2
      - name: Calculate paths
        id: filter
        uses: dorny/paths-filter@f2b044c1363e17812586b86e8c2b7858f7002016
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/setup-frontend/**'
              - 'yarn.lock'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/actions/setup-backend/**'
              - '.github/workflows/ci.yml'
            functions:
              - 'functions/**'
              - '.github/workflows/ci.yml'
            firestore_rules:
              - 'firestore.rules'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'
            codeql_py:
              - 'backend/**'
            codeql_js:
              - 'frontend/**'
              - 'functions/**'
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.codeql_py == 'true' && matrix.language == 'python') ||
      (needs.changes.outputs.codeql_js == 'true' && matrix.language == 'javascript')
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1dda1c6b38c415510de16b5a371c68f18ddab21
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@b1dda1c6b38c415510de16b5a371c68f18ddab21
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b1dda1c6b38c415510de16b5a371c68f18ddab21
        with:
          category: "/language:${{matrix.language}}"
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.frontend == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup and Build Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: "true"
          upload-artifacts: "true"
  backend-static-checks:
    name: Backend Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        test-group: [lint, format, security]
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: ${{ matrix.test-group }}
      - name: Lint with flake8
        if: matrix.test-group == 'lint'
        run: |
          echo " Running flake8 linting..."
          flake8 backend/app/ --show-source --statistics --format=github
          echo " Linting completed"
      - name: Format check with black
        if: matrix.test-group == 'format'
        run: |
          echo " Checking code formatting with black..."
          black --check backend/ --line-length=100 --diff
          echo " Format check completed"
      - name: Security scan with bandit
        if: matrix.test-group == 'security'
        run: |
          echo " Running security scan..."
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt || true
      - name: Upload bandit report
        if: matrix.test-group == 'security'
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: "tests"
      - name: Type check with mypy
        continue-on-error: true
        run: |
          echo " Running type checks..."
          mypy backend/ --ignore-missing-imports --show-error-codes
      - name: Setup Testcontainers Cloud Client
        uses: atomicjar/testcontainers-cloud-setup-action@a63b3671f60f63b4f51e00b213c4c9d56012e106
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@9159aff4ebb3f6a6b5d93e9b1dae298b9e6e8c7c
      - name: Build test image with cache
        uses: docker/build-push-action@8d3c8f8263e00a359c5c24e52f0ff1805b630012
        with:
          context: ./backend
          load: true
          tags: backend-test:latest
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run all backend tests in container
        run: |
          echo " Running all backend tests inside the container..."
          docker run --network="host" \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test_db" \
            -e ENVIRONMENT="test" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY_STAGING }}" \
            -e TESTCONTAINERS_HOST_OVERRIDE="host.testcontainers.internal" \
            -e TESTCONTAINERS_RYUK_DISABLED="true" \
            backend-test:latest
      - name: Copy coverage report from container
        continue-on-error: true
        run: |
          CONTAINER_ID=$(docker create backend-test:latest)
          docker cp $CONTAINER_ID:/app/htmlcov ./backend/htmlcov || echo " No htmlcov directory"
          docker cp $CONTAINER_ID:/app/coverage.xml ./backend/coverage.xml || echo " No coverage.xml file"
          docker rm $CONTAINER_ID
      - name: Upload test coverage
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: backend-test-coverage
          path: backend/htmlcov/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b0606b97418a03f19e487ba476fdd0f1a07d3714
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  test-firestore-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.firestore_rules == 'true')
    needs: [changes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Java
        uses: actions/setup-java@c3b372f80164c6b8d9ba8a6b16709f6b6477d9c6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Node.js
        uses: actions/setup-node@4a73359c983a54e9357d609c13b3e8e7f1012f20
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: tests/package-lock.json
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
      - name: Install test dependencies
        run: |
          cd tests
          npm ci
      - name: Start Firebase Emulators
        run: |
          cd tests
          firebase emulators:start --only firestore --project=careercopilot-test &
          echo "Waiting for Firestore emulator to start..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null 2>&1; do echo "Waiting..."; sleep 2; done'
          echo "Emulator started"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
      - name: Run Firestore Rules Tests
        run: |
          cd tests
          npm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_PROJECT: careercopilot-test
      - name: Upload Firestore test results
        if: always()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: firestore-test-results
          path: |
            tests/coverage/
            tests/test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop Firebase Emulators
        if: always()
        run: |
          pkill -f "firebase.*emulators" || true
          pkill -f "java.*firestore" || true
  functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.functions == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Java
        uses: actions/setup-java@c3b372f80164c6b8d9ba8a6b16709f6b6477d9c6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@4a73359c983a54e9357d609c13b3e8e7f1012f20
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Cache functions node_modules
        uses: actions/cache@88522ab9f39a2ea568f7027eddc7d8d8bc9d59c8
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-npm-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-functions-
      - name: Install dependencies
        run: |
          yarn install --immutable
          cd functions && npm ci
      - name: Lint functions
        run: |
          yarn workspace functions lint
      - name: Build functions
        run: |
          yarn workspace functions build
      - name: Verify build output
        run: |
          if [ ! -d "functions/lib" ] || [ ! "$(ls -A functions/lib)" ]; then
            echo " Functions build failed - no lib directory found"
            exit 1
          fi
          echo " Functions build completed successfully"
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, frontend, backend-tests]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true') ||
      (needs.changes.outputs.e2e == 'true')
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Node.js
        uses: actions/setup-node@4a73359c983a54e9357d609c13b3e8e7f1012f20
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Cache Playwright browsers
        uses: actions/cache@88522ab9f39a2ea568f7027eddc7d8d8bc9d59c8
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: |
          yarn workspace careercopilot-frontend playwright install --with-deps chromium firefox webkit
      - name: Build frontend for E2E
        run: |
          echo " Building frontend for E2E tests..."
          yarn workspace careercopilot-frontend build
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      - name: Start services with Docker Compose
        run: |
          echo " Starting backend and frontend services for E2E tests..."
          docker-compose -f docker-compose.e2e.yml up -d --wait
          echo " Services are up and healthy."
          docker-compose -f docker-compose.e2e.yml ps
      - name: Run Playwright E2E tests
        run: |
          echo " Running Playwright E2E tests..."
          yarn workspace careercopilot-frontend playwright test tests/ --reporter=html,json
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          API_BASE_URL: "http://127.0.0.1:8080"
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/results.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: e2e-screenshots
          path: frontend/test-results/**/screenshots/**
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup servers
        if: always()
        run: |
          echo " Stopping services..."
          docker-compose -f docker-compose.e2e.yml down
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_tests == 'true')
    needs: [backend-tests]
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
      - name: Run performance tests
        run: |
          cd backend
          echo " Running performance test suite..."
          python -m pytest app/tests/performance/ -v --tb=short --disable-warnings --benchmark-only
        env:
          ENVIRONMENT: test
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b319e1de689136302c
        with:
          name: performance-test-results
          path: backend/.benchmarks/
          retention-days: 30
          if-no-files-found: warn
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [
        changes,
        codeql,
        frontend,
        backend-static-checks,
        backend-tests,
        functions,
        e2e-tests,
        test-firestore-rules,
      ]
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check results
        run: |
          echo " Checking all test results..."
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-static-checks.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.functions.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.test-firestore-rules.result }}" == "failure" ]]; then exit 1; fi
          echo " All required quality checks passed (or were skipped)!"
      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@a3f4296062b40a34b7f5a4de8392b45f18ddab21
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('CodeQL Security Analysis');
            if ('${{ needs.frontend.result }}' === 'failure') failedJobs.push('Frontend Tests');
            if ('${{ needs.backend-static-checks.result }}' === 'failure') failedJobs.push('Backend Static Checks');
            if ('${{ needs.backend-tests.result }}' === 'failure') failedJobs.push('Backend Tests');
            if ('${{ needs.functions.result }}' === 'failure') failedJobs.push('Functions Tests');
            if ('${{ needs.e2e-tests.result }}' === 'failure') failedJobs.push('E2E Tests');
            if ('${{ needs.test-firestore-rules.result }}' === 'failure') failedJobs.push('Firestore Rules Tests');
            const failedList = failedJobs.map(job => `-  ${job}`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **Quality Gate Failed**\n\nFailed test suites:\n${failedList}\n\n Check the [CI Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix issues before merging.`
            });
      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@a3f4296062b40a34b7f5a4de8392b45f18ddab21
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **All Quality Checks Passed!**\n\n All required test suites passed successfully (or were correctly skipped by path filters).\n\n Ready for review and merge!`
            });
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [quality-gate, changes]
    if: |
      success() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      id-token: write
    env:
      PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
      REGION: ${{ env.GCP_REGION }}
      REGISTRY: ${{ env.GCP_REGISTRY }}
      REPOSITORY: ${{ env.GCP_REPOSITORY }}
      IMAGE_NAME: ${{ env.GCP_IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@061d3e8e1610e7b7e3e3c0b17bef6c04f05b14e8
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@9159aff4ebb3f6a6b5d93e9b1dae298b9e6e8c7c
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@6051f8071e62602c1b2691341c304d9a6e6963f2
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@8d3c8f8263e00a359c5c24e52f0ff1805b630012
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: final
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Add build summary
        run: |
          echo "###  Backend Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "Image successfully pushed to Google Artifact Registry." >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY