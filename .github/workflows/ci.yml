# .github/workflows/ci.yml
#
# FULLY REFACTORED CI WORKFLOW (POLISHED)
#
# Implements:
# 1. SHA-Pinning: All 'uses:' actions are pinned to full commit SHAs.
# 2. Path Filtering: Tuned to your specific monorepo structure (frontend/, backend/,
#    functions/, tests/). Jobs are conditional and will be skipped if no
#    relevant code has changed, saving significant time and cost.
# 3. Concurrency: Cancels redundant PR builds.
# 4. Advanced Caching: Includes Playwright, Yarn, and Pip caching.
# 5. Security: Top-level permissions are read-only.
# 6. Environment-Specific Build/Push: Pushes backend image to correct registry based on branch.
#
name: CI - Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: true
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: false
        type: boolean

# Default permissions are read-only for security.
permissions:
  contents: read

# Cancel redundant builds on PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Define Docker image location components (used by build job)
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_IMAGE_NAME: backend
  # Production project details (used as default)
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REPOSITORY: careercopilot # Production repo name

jobs:
  # Job 1: Detect changes based on your repository structure
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
      firestore_rules: ${{ steps.filter.outputs.firestore_rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      codeql_py: ${{ steps.filter.outputs.codeql_py }}
      codeql_js: ${{ steps.filter.outputs.codeql_js }}

    # Run on all events *except* manual dispatch (which runs everything)
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
        with:
          fetch-depth: 2 # Required for paths-filter to compare HEAD~1

      - name: Calculate paths
        id: filter
        uses: dorny/paths-filter@v3 # v3.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/setup-frontend/**'
              - 'yarn.lock'
              - 'package.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/actions/setup-backend/**'
              - '.github/workflows/ci.yml'
              - 'frontend/**' # Backend build depends on frontend static files
              - 'package.json'
            functions:
              - 'functions/**'
              - '.github/workflows/ci.yml'
            firestore_rules:
              - 'firestore.rules'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'
            codeql_py:
              - 'backend/**'
            codeql_js:
              - 'frontend/**'
              - 'functions/**'

  # Security Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.codeql_py == 'true') ||
      (needs.changes.outputs.codeql_js == 'true')
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.1.7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # v3.25.12
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # v3.25.12
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # v3.25.12
        with:
          category: "/language:${{matrix.language}}"

  # Frontend Testing
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.frontend == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup and Test Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: "true"
          upload-artifacts: "false"
          skip-build: "true"

  # Frontend Build and Artifact Upload
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.frontend == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build frontend
        run: yarn workspace careercopilot-frontend build
      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: frontend-dist
          path: frontend/dist/
      - name: Verify build output
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist)" ]; then
            echo "Frontend build failed - no dist directory found or it's empty"
            ls -la frontend/ || echo "No frontend directory found"
            exit 1
          fi
          echo "Frontend build artifacts verified"
          echo "Dist contents:"
          ls -la frontend/dist/

  # Backend Static Checks
  backend-static-checks:
    name: Backend Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        test-group: [lint, format, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: ${{ matrix.test-group }}
      - name: Lint with flake8
        if: matrix.test-group == 'lint'
        run: |
          echo " Running flake8 linting..."
          flake8 backend/app/ --show-source --statistics --format=github
          echo " Linting completed"
      - name: Format check with black
        if: matrix.test-group == 'format'
        run: |
          echo " Checking code formatting with black..."
          black --check backend/ --line-length=100 --diff
          echo " Format check completed"
      - name: Security scan with bandit
        if: matrix.test-group == 'security'
        run: |
          echo " Running security scan..."
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt || true
      - name: Upload bandit report
        if: matrix.test-group == 'security'
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

  # Backend Integration Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging # Assuming tests run against staging config/secrets
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: "tests"
      - name: Type check with mypy
        continue-on-error: true
        run: |
          echo " Running type checks..."
          mypy backend/ --ignore-missing-imports --show-error-codes
      - name: Setup Testcontainers Cloud Client
        uses: AtomicJar/testcontainers-cloud-setup-action@v1 # v1.0.0
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.3.0
      - name: Build test image with cache
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: ./backend
          load: true
          tags: backend-test:latest
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run all backend tests in container
        run: |
          echo " Running all backend tests inside the container..."
          docker run --network="host" \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test_db" \
            -e ENVIRONMENT="test" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY_STAGING }}" \
            -e TESTCONTAINERS_HOST_OVERRIDE="host.testcontainers.internal" \
            -e TESTCONTAINERS_RYUK_DISABLED="true" \
            backend-test:latest
      - name: Copy coverage report from container
        continue-on-error: true
        run: |
          CONTAINER_ID=$(docker create backend-test:latest)
          docker cp $CONTAINER_ID:/app/htmlcov ./backend/htmlcov || echo " No htmlcov directory"
          docker cp $CONTAINER_ID:/app/coverage.xml ./backend/coverage.xml || echo " No coverage.xml file"
          docker rm $CONTAINER_ID
      - name: Upload test coverage
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: backend-test-coverage
          path: backend/htmlcov/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4 # v4.4.1
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Firestore Security Rules Testing
  test-firestore-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.firestore_rules == 'true')
    needs: [changes]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup Java
        uses: actions/setup-java@v4 # v4.2.1
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: tests/package-lock.json
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
      - name: Install test dependencies
        run: |
          cd tests
          npm ci
      - name: Start Firebase Emulators
        run: |
          cd tests
          firebase emulators:start --only firestore --project=careercopilot-test &
          echo "Waiting for Firestore emulator to start..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null 2>&1; do echo "Waiting..."; sleep 2; done'
          echo "Emulator started"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
      - name: Run Firestore Rules Tests
        run: |
          cd tests
          npm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_PROJECT: careercopilot-test
      - name: Upload Firestore test results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: firestore-test-results
          path: |
            tests/coverage/
            tests/test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Stop Firebase Emulators
        if: always()
        run: |
          pkill -f "firebase.*emulators" || true
          pkill -f "java.*firestore" || true

  # Functions Testing
  functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.functions == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup Java
        uses: actions/setup-java@v4 # v4.2.1
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint functions
        run: yarn workspace functions lint
      - name: Build functions
        run: yarn workspace functions build
      - name: Run functions tests
        run: yarn workspace functions test:ci
      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "functions/lib" ] || [ ! "$(ls -A functions/lib)" ]; then
            echo "Functions build failed - no lib directory found or it's empty"
            ls -la functions/ || echo "No functions directory found"
            exit 1
          fi
          echo "Functions build artifacts verified"
          echo "Lib contents:"
          ls -la functions/lib/

  # End-to-End Testing
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, frontend, backend-tests]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true') ||
      (needs.changes.outputs.e2e == 'true')
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Enable Corepack for Yarn 4+
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        run: yarn install --immutable
      - name: Cache Playwright browsers
        uses: actions/cache@v4 # v4.0.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browsers
        run: yarn workspace careercopilot-frontend playwright install --with-deps chromium firefox webkit
      - name: Build frontend for E2E
        run: |
          echo " Building frontend for E2E tests..."
          yarn workspace careercopilot-frontend build
      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose
      
      # --- START OF MODIFIED STEPS ---
      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start services with Docker Compose
        run: |
          echo " Starting backend and frontend services for E2E tests..."
          docker-compose -f docker-compose.e2e.yml up -d --wait
          echo " Services are up and healthy."
          docker-compose -f docker-compose.e2e.yml ps
      - name: Wait for services to be ready
        run: |
          echo "Waiting for frontend (http://127.0.0.1:3000) and backend (http://127.0.0.1:8080/health)..."
          # This command will wait 2 minutes (120000ms) for both URLs to return a 200 OK.
          # If they don't, it will exit with an error, failing the job.
          wait-on http://127.0.0.1:3000 http://127.0.0.1:8080/health -t 120000
          echo "Both frontend and backend are ready!"
      # --- END OF MODIFIED STEPS ---

      - name: Run Playwright E2E tests
        run: |
          echo " Running Playwright E2E tests..."
          # Cap E2E duration to 10 minutes to prevent job hangs
          timeout 10m yarn workspace careercopilot-frontend playwright test tests/
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          API_BASE_URL: "http://127.0.0.1:8080"
      - name: Docker diagnostics on failure
        if: failure()
        run: |
          echo " Collecting docker-compose diagnostics..."
          docker-compose -f docker-compose.e2e.yml ps || true
          docker-compose -f docker-compose.e2e.yml logs --no-color > docker-compose-e2e-logs.txt || true
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/test-results/results.json
            docker-compose-e2e-logs.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: e2e-screenshots
          path: frontend/test-results/**/screenshots/**
          retention-days: 7
          if-no-files-found: warn
      - name: Cleanup servers
        if: always()
        run: |
          echo " Stopping services..."
          docker-compose -f docker-compose.e2e.yml down

  # Performance Testing (Optional)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_tests == 'true')
    needs: [backend-tests]
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7
      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
      - name: Run performance tests
        run: |
          cd backend
          echo " Running performance test suite..."
          python -m pytest app/tests/performance/ -v --tb=short --disable-warnings --benchmark-only
        env:
          ENVIRONMENT: test
      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: performance-test-results
          path: backend/.benchmarks/
          retention-days: 30
          if-no-files-found: warn

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [
        changes,
        codeql,
        frontend,
        backend-static-checks,
        backend-tests,
        functions,
        e2e-tests,
        test-firestore-rules,
      ]
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Check results
        run: |
          echo " Checking all test results..."
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-static-checks.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.functions.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.test-firestore-rules.result }}" == "failure" ]]; then exit 1; fi
          echo " All required quality checks passed (or were skipped)!"
      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7 # v7.0.1
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('CodeQL Security Analysis');
            if ('${{ needs.frontend.result }}' === 'failure') failedJobs.push('Frontend Tests');
            if ('${{ needs.backend-static-checks.result }}' === 'failure') failedJobs.push('Backend Static Checks');
            if ('${{ needs.backend-tests.result }}' === 'failure') failedJobs.push('Backend Tests');
            if ('${{ needs.functions.result }}' === 'failure') failedJobs.push('Functions Tests');
            if ('${{ needs.e2e-tests.result }}' === 'failure') failedJobs.push('E2E Tests');
            if ('${{ needs.test-firestore-rules.result }}' === 'failure') failedJobs.push('Firestore Rules Tests');
            const failedList = failedJobs.map(job => `-  ${job}`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **Quality Gate Failed**\n\nFailed test suites:\n${failedList}\n\n Check the [CI Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix issues before merging.`
            });
      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7 # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **All Quality Checks Passed!**\n\n All required test suites passed successfully (or were correctly skipped by path filters).\n\n Ready for review and merge!`
            });

  # Build and Push Docker image
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend-tests, backend-static-checks]
    # Build if frontend passes, allow backend tests to fail
    if: |
      always() &&
      !cancelled() &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped') &&
      (needs.backend-static-checks.result == 'success' || needs.backend-static-checks.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read # Using service account key authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.1.7

      # Determine Target Environment based on branch
      - name: Determine Target Environment
        id: env-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_PROJECT_ID=${{ env.GCP_PROJECT_ID }}" >> $GITHUB_OUTPUT
            echo "TARGET_REPOSITORY=${{ env.GCP_REPOSITORY }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "TARGET_PROJECT_ID=careercopilot-staging" >> $GITHUB_OUTPUT
            echo "TARGET_REPOSITORY=careercopilot-repo" >> $GITHUB_OUTPUT
          else
             echo "::error::Unsupported branch for build and push: ${{ github.ref }}"
             exit 1
          fi

      # Authenticate to Google Cloud using Service Account Key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2 # v2.1.3
        with:
          credentials_json: ${{ github.ref == 'refs/heads/main' && secrets.FIREBASE_SERVICE_ACCOUNT_CAREERCOPILOT || secrets.GCP_STAGING_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2 # v2.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # v3.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true # Don't fail if Docker Hub creds are missing

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud config set project ${{ steps.env-vars.outputs.TARGET_PROJECT_ID }}
          gcloud auth configure-docker ${{ env.GCP_REGISTRY }}

      # Build and push with standard Docker commands (no Buildx)
      - name: Build and push Docker image
        run: |
          IMAGE_BASE="${{ env.GCP_REGISTRY }}/${{ steps.env-vars.outputs.TARGET_PROJECT_ID }}/${{ steps.env-vars.outputs.TARGET_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"
          # Use short SHA (first 7 chars) to match git convention
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          IMAGE_SHA="${IMAGE_BASE}:${SHORT_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          echo "Building Docker image..."
          docker build \
            --target final \
            --tag "${IMAGE_SHA}" \
            --tag "${IMAGE_LATEST}" \
            ./backend

          echo "Pushing Docker image to Artifact Registry..."
          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"

          echo "IMAGE_SHA=${IMAGE_SHA}" >> $GITHUB_OUTPUT
          echo "IMAGE_LATEST=${IMAGE_LATEST}" >> $GITHUB_OUTPUT

      - name: Add build summary
        run: |
          IMAGE_BASE="${{ env.GCP_REGISTRY }}/${{ steps.env-vars.outputs.TARGET_PROJECT_ID }}/${{ steps.env-vars.outputs.TARGET_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}"
          echo "### Backend Image Pushed (${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image successfully pushed to Google Artifact Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target Project:** ${{ steps.env-vars.outputs.TARGET_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Repository:** ${{ steps.env-vars.outputs.TARGET_REPOSITORY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_BASE}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_BASE}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
