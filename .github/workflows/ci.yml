name: CI - Build and Test

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          timeout: '10m'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-
            ${{ runner.os }}-node-

      - name: Install Frontend Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --prefix frontend
        timeout-minutes: 5

      - name: Type Check
        run: npm run type-check --prefix frontend
        timeout-minutes: 3

      - name: Lint Frontend
        run: npm run lint --prefix frontend
        timeout-minutes: 3

      - name: Format Check
        run: npm run format:check --prefix frontend
        timeout-minutes: 2

      - name: Build Frontend
        run: npm run build --prefix frontend
        timeout-minutes: 5

      - name: Bundle Size Check
        run: npm run bundle-analysis --prefix frontend
        timeout-minutes: 3

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: frontend/dist/bundle-analysis.json
          retention-days: 30

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-build-${{ github.sha }}

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-pip-

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
        timeout-minutes: 10

      - name: Lint Backend (flake8)
        run: flake8 backend/ --max-line-length=100 --exclude=backend/migrations,backend/__pycache__
        timeout-minutes: 3

      - name: Format Check (black)
        run: black --check backend/ --line-length=100
        timeout-minutes: 3

      - name: Type Check (mypy)
        run: mypy backend/ --ignore-missing-imports
        timeout-minutes: 5
        continue-on-error: true

      - name: Security Check (bandit)
        run: bandit -r backend/ -f json -o bandit-report.json
        timeout-minutes: 3
        continue-on-error: true

      - name: Upload bandit security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Run Backend Tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --maxfail=1
        timeout-minutes: 10
        env:
          ENVIRONMENT: test

  code-quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    needs: [security-scan, test-frontend, test-backend]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          if [[ "${{ needs.test-frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.test-backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All quality checks passed!"

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Code Quality Gate Failed**\n\nPlease check the CI results and fix any issues before merging.'
            })

      - name: Post PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **All Quality Checks Passed!**\n\nThis PR is ready for review and merge.'
            })