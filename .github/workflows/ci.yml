name: CI - Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  # CodeQL Security Analysis - Native GitHub solution
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Frontend Testing
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix frontend
        timeout-minutes: 5

      - name: Type check
        run: npm run type-check --prefix frontend
        timeout-minutes: 3

      - name: Lint
        run: npm run lint --prefix frontend
        timeout-minutes: 3

      - name: Format check
        run: npm run format:check --prefix frontend
        timeout-minutes: 2

      - name: Build
        run: npm run build --prefix frontend
        timeout-minutes: 5

      - name: Bundle analysis
        run: npm run bundle-analysis --prefix frontend
        timeout-minutes: 3

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: frontend/dist/bundle-analysis.json
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # Backend Testing
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
        timeout-minutes: 10

      - name: Lint (flake8)
        run: cd backend && flake8 app/
        timeout-minutes: 3

      - name: Format check (black)
        run: black --check backend/ --line-length=100
        timeout-minutes: 3

      - name: Type check (mypy)
        run: mypy backend/ --ignore-missing-imports
        timeout-minutes: 5
        continue-on-error: true

      - name: Security scan (bandit)
        run: bandit -r backend/ -f json -o bandit-report.json
        timeout-minutes: 3
        continue-on-error: true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Add bandit results to summary
        if: always()
        run: |
          echo "### 🔍 Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            echo "**Found $ISSUES security issues**" >> $GITHUB_STEP_SUMMARY
            echo "📁 [Download detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No security issues found**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --maxfail=1
        timeout-minutes: 10
        env:
          ENVIRONMENT: test

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [codeql, frontend, backend]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then
            echo "❌ CodeQL security analysis failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All quality checks passed!"

      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Quality Gate Failed**\n\nCheck CI results and fix issues before merging.'
            })

      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **All Quality Checks Passed!**\n\nReady for review and merge.'
            })