# .github/workflows/ci.yml

name: CI - Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  build-and-test:
    name: Build, Lint, & Test Full Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Python for Backend
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      ## ----------------- FRONTEND VALIDATION -----------------
      - name: 🧪 Install Frontend Dependencies
        run: yarn install --frozen-lockfile

      - name: 🧹 Lint Frontend Code
        run: yarn lint

      - name: 🛡️ Scan Frontend for Vulnerabilities
        run: yarn audit

      - name: 🔬 Run Frontend Tests
        run: yarn test

      - name: 🏗️ Build Frontend Application
        run: yarn build:frontend

      - name: ✅ Verify Frontend Build
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Frontend build failed - dist directory not found"
            exit 1
          fi
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "❌ Frontend build failed - index.html not found"
            exit 1
          fi
          echo "✅ Frontend build verification passed"

      ## ----------------- BACKEND VALIDATION ------------------
      - name: 🐍 Install Backend Dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      - name: 🧹 Lint Backend Code
        run: |
          pip install pylint
          pylint $(git ls-files '*.py') || exit 0
        working-directory: ./backend

      - name: 🔬 Run Backend Tests
        run: |
          pip install pytest
          pytest -v
        working-directory: ./backend

      - name: ✅ Verify Backend Structure
        run: |
          if [ ! -f "backend/main.py" ] && [ ! -f "backend/app/main.py" ]; then
            echo "❌ Backend entry point not found"
            exit 1
          fi
          echo "✅ Backend structure verification passed"

      ## ----------------- ARTIFACT PACKAGING ------------------
      - name: 📦 Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

      - name: 📦 Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-source
          path: backend/
          retention-days: 7
          if-no-files-found: error

      - name: 📊 Artifact Summary
        run: |
          echo "## 📦 Build Artifacts Created" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Frontend: Built and uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Backend: Source packaged and uploaded" >> $GITHUB_STEP_SUMMARY
          echo "- 🕒 Retention: 7 days" >> $GITHUB_STEP_SUMMARY