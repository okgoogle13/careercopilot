name: CI - Build and Test
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: "true"
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: "false"
        type: boolean
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend
jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1dda1c6b38c415510de16b5a371c68f18ddab21 # v3.25.12
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@b1dda1c6b38c415510de16b5a371c68f18ddab21 # v3.25.12
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b1dda1c6b38c415510de16b5a371c68f18ddab21 # v3.25.12
        with:
          category: "/language:${{matrix.language}}"