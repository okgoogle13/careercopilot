name: CI - Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'
  # Performance optimizations
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # CodeQL Security Analysis - Native GitHub solution
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python', 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Frontend Testing
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: 'true'
          upload-artifacts: 'true'

  # Backend Testing
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-group: [lint, format, security, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: 'full'
          cache-prefix: ${{ matrix.test-group }}

      - name: Lint with flake8
        if: matrix.test-group == 'lint'
        run: |
          cd backend
          echo "🔍 Running flake8 linting..."
          flake8 app/ --show-source --statistics --format=github
          echo "✅ Linting completed"
        timeout-minutes: 3

      - name: Format check with black
        if: matrix.test-group == 'format'
        run: |
          echo "✨ Checking code formatting with black..."
          black --check backend/ --line-length=100 --diff
          echo "✅ Format check completed"
        timeout-minutes: 3

      - name: Security scan with bandit
        if: matrix.test-group == 'security'
        run: |
          echo "🔒 Running security scan..."
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt || true
        timeout-minutes: 4

      - name: Upload bandit report
        if: matrix.test-group == 'security'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Type check with mypy
        if: matrix.test-group == 'tests'
        continue-on-error: true
        run: |
          echo "🔧 Running type checks..."
          mypy backend/ --ignore-missing-imports --show-error-codes
        timeout-minutes: 4

      - name: Run tests
        if: matrix.test-group == 'tests'
        run: |
          cd backend
          echo "🧪 Running test suite..."
          python -m pytest tests/ -v --tb=short --maxfail=3 --disable-warnings
        timeout-minutes: 8
        env:
          ENVIRONMENT: test
          # Disable external service calls during tests
          ENABLE_RAG: false
          ENABLE_GENKIT: false

      - name: Add test results to summary
        if: always() && matrix.test-group == 'security'
        run: |
          echo "### 🔍 Backend Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            if [ "$ISSUES" = "0" ]; then
              echo "✅ **No security issues found**" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ **Found $ISSUES security issues**" >> $GITHUB_STEP_SUMMARY
              echo "📁 [Download detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❓ **Could not generate security report**" >> $GITHUB_STEP_SUMMARY
          fi

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [codeql, frontend, backend]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then
            echo "❌ CodeQL security analysis failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All quality checks passed!"

      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Quality Gate Failed**\n\nCheck CI results and fix issues before merging.'
            })

      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **All Quality Checks Passed!**\n\nReady for review and merge.'
            })
