# This is the name of the GitHub Actions workflow.
# It will appear in the "Actions" tab of your GitHub repository.
name: CI - Build and Test

# This workflow is triggered automatically on every pull request
# that targets either the 'develop' or 'main' branches.
on:
  pull_request:
    branches:
      - develop
      - main

# Defines the jobs that will be run.
jobs:
  # ===================================================================
  #  FRONTEND VALIDATION JOB
  #  This job checks the frontend code for errors.
  # ===================================================================
  test-frontend:
    name: Test Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x] # Test multiple Node.js versions
      fail-fast: false # Continue with other versions if one fails
    
    steps:
      # Step 1: Check out the repository code so the runner has access to it.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment. Version 20 is a stable LTS release.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm' # Cache npm dependencies to speed up subsequent runs.
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Install all frontend dependencies.
      # 'ci' is used for continuous integration as it provides faster, more reliable builds.
      # 'working-directory' is critical here to run the command in the right place.
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      # Step 4: Run the linter to check for code style issues.
      - name: Run Linter
        run: npm run lint
        working-directory: ./frontend

      # Step 5: Run the production build command. This is the most important test.
      # It checks for TypeScript errors and ensures the application is buildable.
      - name: Run Build
        run: npm run build
        working-directory: ./frontend

  # ===================================================================
  #  BACKEND VALIDATION JOB
  #  This job checks the backend code for errors. It runs in parallel with the frontend job.
  # ===================================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment, specifying the correct version.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies to speed up subsequent runs.
          cache-dependency-path: backend/requirements-dev.txt

      # Step 3: Install all backend dependencies, INCLUDING development tools.
      #
      # THIS IS THE CRITICAL FIX: It uses requirements-dev.txt to ensure
      # tools like 'black' and 'pytest' are available for the CI runner.
      #
      - name: Install Backend Dependencies
        run: pip install -r backend/requirements-dev.txt

      # Step 4: Run the Black code formatter to check for style issues.
      # '--check' ensures it will fail if the code is not formatted, without changing files.
      - name: Run Linter (Black)
        run: black --check backend
        
  # ===================================================================
  #  FIREBASE FUNCTIONS VALIDATION JOB
  #  This job checks the Firebase functions code for errors. Runs in parallel with the other jobs.
  # ===================================================================
  test-functions:
    name: Test Firebase Functions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x] # Test with the version specified in engines and others
      fail-fast: false

    steps:
      # Step 1: Check out the repository code.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Node.js environment.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # Step 3: Install all functions dependencies.
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions
        continue-on-error: ${{ matrix.node-version == '22.x' }} # Allow Node 22 to fail
        
      # Step 4: Check for lock file consistency
      - name: Check for lock file consistency
        run: npm install --package-lock-only
        working-directory: ./functions
        
  # ===================================================================
  #  SECURITY SCANNING JOB
  #  This job checks dependencies for known vulnerabilities
  # ===================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-functions]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Run npm audit on all package.json files
      - name: Root NPM audit
        run: npm audit --json || echo "Vulnerabilities found, but continuing"
        continue-on-error: true
        
      - name: Frontend NPM audit
        working-directory: ./frontend
        run: npm audit --json || echo "Vulnerabilities found, but continuing"
        continue-on-error: true
        
      - name: Functions NPM audit
        working-directory: ./functions
        run: npm audit --json || echo "Vulnerabilities found, but continuing"
        continue-on-error: true
        
      # Optional: Add CodeQL Analysis for more comprehensive security scanning
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2