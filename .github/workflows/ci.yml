name: CI - Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: "true"
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: "false"
        type: boolean
      test_environment:
        description: "Environment to run tests against"
        required: false
        default: "staging"
        type: choice
        options:
          - staging
          - development

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  # Performance optimizations
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Environment-specific secrets will be set in each job

jobs:
  # CodeQL Security Analysis - Native GitHub solution
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Frontend Testing
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup and Build Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: "true"
          upload-artifacts: "true"

  # Backend Testing
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    services:
      # Add PostgreSQL for integration tests
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        test-group: [lint, format, security, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: ${{ matrix.test-group }}

      - name: Lint with flake8
        if: matrix.test-group == 'lint'
        run: |
          cd backend
          echo "🔍 Running flake8 linting..."
          flake8 app/ --show-source --statistics --format=github
          echo "✅ Linting completed"
        timeout-minutes: 3

      - name: Format check with black
        if: matrix.test-group == 'format'
        run: |
          echo "✨ Checking code formatting with black..."
          black --check backend/ --line-length=100 --diff
          echo "✅ Format check completed"
        timeout-minutes: 3

      - name: Security scan with bandit
        if: matrix.test-group == 'security'
        run: |
          echo "🔒 Running security scan..."
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt || true
        timeout-minutes: 4

      - name: Upload bandit report
        if: matrix.test-group == 'security'
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Type check with mypy
        if: matrix.test-group == 'tests'
        continue-on-error: true
        run: |
          echo "🔧 Running type checks..."
          mypy backend/ --ignore-missing-imports --show-error-codes
        timeout-minutes: 4

      - name: Setup Testcontainers Cloud Client
        if: matrix.test-group == 'tests'
        uses: atomicjar/testcontainers-cloud-setup-action@v1
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.test-group == 'tests'
        uses: docker/setup-buildx-action@v3

      - name: Build test image with cache
        if: matrix.test-group == 'tests'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true # Load the image into the local Docker daemon
          tags: backend-test:latest
          target: test # Build the 'test' stage from the Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run all backend tests in container
        if: matrix.test-group == 'tests'
        run: |
          echo "🧪 Running all backend tests inside the container..."
          docker run --network="host" \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test_db" \
            -e ENVIRONMENT="test" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY_STAGING }}" \
            -e TESTCONTAINERS_HOST_OVERRIDE="host.testcontainers.internal" \
            -e TESTCONTAINERS_RYUK_DISABLED="true" \
            backend-test:latest

      - name: Copy coverage report from container
        if: matrix.test-group == 'tests'
        run: |
          # Create a dummy container to copy artifacts from the test image
          CONTAINER_ID=$(docker create backend-test:latest)
          docker cp $CONTAINER_ID:/app/htmlcov ./backend/htmlcov
          docker cp $CONTAINER_ID:/app/coverage.xml ./backend/coverage.xml
          docker rm $CONTAINER_ID

      - name: Upload test coverage
        if: matrix.test-group == 'tests'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: backend/htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.test-group == 'tests'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Add test results to summary
        if: always() && matrix.test-group == 'security'
        run: |
          echo "### 🔍 Backend Security Scan Results" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            if [ "$ISSUES" = "0" ]; then
              echo "✅ **No security issues found**" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ **Found $ISSUES security issues**" >> $GITHUB_STEP_SUMMARY
              echo "📁 [Download detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❓ **Could not generate security report**" >> $GITHUB_STEP_SUMMARY
          fi

  # Firestore Security Rules Testing
  test-firestore-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: tests/package.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: |
          cd tests
          npm ci

      - name: Start Firebase Emulators
        run: |
          cd tests
          firebase emulators:start --only firestore --project=careercopilot-test &
          EMULATOR_PID=$!
          echo "Waiting for Firestore emulator to start..."
          # Wait for emulator UI (default port 4000) or Firestore port (default 8080)
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null 2>&1; do echo "Waiting..."; sleep 2; done' || true
          echo "Emulator started"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Run Firestore Rules Tests
        run: |
          cd tests
          npm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_PROJECT: careercopilot-test

      - name: Upload Firestore test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-test-results
          path: |
            tests/coverage/
            tests/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop Firebase Emulators
        if: always()
        run: |
          # Kill any running emulator processes
          pkill -f "firebase.*emulators" || true
          pkill -f "java.*firestore" || true

  # Functions Testing
  functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack for Yarn 4+
        run: |
          corepack enable
          corepack prepare yarn@4.10.2 --activate

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Setup Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: |
          yarn install
          cd functions && npm install

      - name: Lint functions
        run: |
          cd functions && npm run lint

      - name: Build functions
        run: |
          cd functions && npm run build

      - name: Verify build output
        run: |
          if [ ! -d "functions/lib" ] || [ ! "$(ls -A functions/lib)" ]; then
            echo "❌ Functions build failed - no lib directory found"
            exit 1
          fi
          echo "✅ Functions build completed successfully"

  # End-to-End Testing
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [frontend, backend]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true')
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack for Yarn 4+
        run: |
          corepack enable
          corepack prepare yarn@4.10.2 --activate

      - name: Get Yarn cache directory
        id: yarn-cache-dir
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - name: Setup Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium firefox webkit

      - name: Build frontend for E2E
        run: |
          echo "🏗️ Building frontend for E2E tests..."
          cd frontend
          yarn build

      - name: Start services with Docker Compose
        run: |
          echo "🚀 Starting backend and frontend services for E2E tests..."
          docker-compose -f docker-compose.e2e.yml up -d --wait
          echo "✅ Services are up and healthy."
          docker-compose -f docker-compose.e2e.yml ps

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          echo "🎭 Running Playwright E2E tests..."
          npx playwright test tests/ --reporter=html,json
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          API_BASE_URL: "http://127.0.0.1:8080"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/test-results/**/screenshots/**
          retention-days: 7
          if-no-files-found: warn

      - name: Generate E2E test summary
        if: always()
        run: |
          echo "### 🎭 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/results.json ]; then
            TOTAL_TESTS=$(jq '.suites[].specs | length' frontend/results.json | awk '{sum += $1} END {print sum}' 2>/dev/null || echo "0")
            PASSED_TESTS=$(jq '[.suites[].specs[].tests[] | select(.results[].status == "passed")] | length' frontend/results.json 2>/dev/null || echo "0")
            echo "📊 **Total Tests**: $TOTAL_TESTS" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Passed**: $PASSED_TESTS" >> $GITHUB_STEP_SUMMARY
            echo "📁 [View detailed E2E report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❓ **Test results not available**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup servers
        if: always()
        run: |
          echo "🛑 Stopping services..."
          docker-compose -f docker-compose.e2e.yml down

  # Performance Testing (Optional, runs on schedule)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_tests == 'true')
    needs: [backend]
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"

      - name: Run performance tests
        run: |
          cd backend
          echo "⚡ Running performance test suite..."
          python -m pytest app/tests/performance/ -v --tb=short --disable-warnings --benchmark-only
        timeout-minutes: 10
        env:
          ENVIRONMENT: test

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: backend/.benchmarks/
          retention-days: 30
          if-no-files-found: warn

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      [codeql, frontend, backend, functions, e2e-tests, test-firestore-rules]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check results
        run: |
          echo "🔍 Checking all test results..."

          # Check each test suite result
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then
            echo "❌ CodeQL security analysis failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.functions.result }}" == "failure" ]]; then
            echo "❌ Functions tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.test-firestore-rules.result }}" == "failure" ]]; then
            echo "❌ Firestore security rules tests failed"
            exit 1
          fi

          echo "✅ All quality checks passed!"

      - name: Generate comprehensive test summary
        if: always()
        run: |
          echo "## 📊 Comprehensive Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 CodeQL Security Analysis | ${{ needs.codeql.result == 'success' && '✅ Passed' || needs.codeql.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Static security analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎨 Frontend Unit Tests | ${{ needs.frontend.result == 'success' && '✅ Passed' || needs.frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | React component tests, Jest |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Backend Unit Tests | ${{ needs.backend.result == 'success' && '✅ Passed' || needs.backend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Python API tests, pytest |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Firebase Functions Tests | ${{ needs.functions.result == 'success' && '✅ Passed' || needs.functions.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Cloud Functions linting & build |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎭 End-to-End Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Playwright browser tests |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Firestore Security Rules | ${{ needs.test-firestore-rules.result == 'success' && '✅ Passed' || needs.test-firestore-rules.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | Database security validation |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test Coverage Summary
          echo "### 📋 Test Coverage Overview" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: Component rendering, user interactions, API integration" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: API endpoints, AI service flows, database operations" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E**: Complete user workflows, KSC generation journey" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: Firestore rules validation, static analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add artifact links
          echo "### 📁 Test Artifacts & Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [📊 Frontend Test Coverage](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [📈 Backend Test Coverage](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [🎭 E2E Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [🔐 Firestore Rules Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- [🔒 Security Scan Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('CodeQL Security Analysis');
            if ('${{ needs.frontend.result }}' === 'failure') failedJobs.push('Frontend Tests');
            if ('${{ needs.backend.result }}' === 'failure') failedJobs.push('Backend Tests');
            if ('${{ needs.functions.result }}' === 'failure') failedJobs.push('Functions Tests');
            if ('${{ needs.e2e-tests.result }}' === 'failure') failedJobs.push('E2E Tests');
            if ('${{ needs.test-firestore-rules.result }}' === 'failure') failedJobs.push('Firestore Rules Tests');

            const failedList = failedJobs.map(job => `- ❌ ${job}`).join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: \`❌ **Quality Gate Failed**

            Failed test suites:
            \${failedList}

            📋 Check the [CI Results](https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}) and fix issues before merging.

            🔍 **What to check:**
            - Review failed test logs in the Actions tab
            - Run tests locally to reproduce issues
            - Check test coverage reports for completeness\`
            });

      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: \`✅ **All Quality Checks Passed!**

            🎉 **Test Results:**
            - ✅ Frontend Unit Tests (Jest + React Testing Library)
            - ✅ Backend Unit Tests (pytest + FastAPI)
            - ✅ End-to-End Tests (Playwright)
            - ✅ Firestore Security Rules Tests
            - ✅ Security Analysis (CodeQL + Bandit)
            - ✅ Functions Build & Lint

            🚀 Ready for review and merge!

            📊 [View detailed test results](https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }})\`
            });

      - name: Quality gate result summary
        if: always()
        run: |
          echo "=== QUALITY GATE SUMMARY ==="
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Frontend: ${{ needs.frontend.result }}"
          echo "Backend: ${{ needs.backend.result }}"
          echo "Functions: ${{ needs.functions.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "Firestore Rules: ${{ needs.test-firestore-rules.result }}"
          echo "==========================="

  # Build and Push Docker image to Google Artifact Registry
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      id-token: write # Required for authenticating to GCP
    env:
      PROJECT_ID: careercopilot-468811
      REGION: us-central1
      REGISTRY: us-central1-docker.pkg.dev
      REPOSITORY: careercopilot
      IMAGE_NAME: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: final # Build the 'final' stage for production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add build summary
        run: |
          echo "### 🚀 Backend Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "Successfully built and pushed the backend Docker image to Google Artifact Registry." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
