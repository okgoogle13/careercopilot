name: CI - Build and Test
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: "true"
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: "false"
        type: boolean
env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend
jobs:
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
      firestore_rules: ${{ steps.filter.outputs.firestore_rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      codeql_py: ${{ steps.filter.outputs.codeql_py }}
      codeql_js: ${{ steps.filter.outputs.codeql_js }}
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@a5ac7e51b4109f51b424b11c0c203a9c94ee8384 # v4.1.7
        with:
          fetch-depth: 2
      - name: Calculate paths
        id: filter
        uses: dorny/paths-filter@f2b044c1363e17812586b86e8c2b7858f7002016 # v3.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/setup-frontend/**'
              - 'yarn.lock'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/actions/setup-backend/**'
              - '.github/workflows/ci.yml'
            functions:
              - 'functions/**'
              - '.github/workflows/ci.yml'
            firestore_rules:
              - 'firestore.rules'
              - 'tests/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'
            codeql_py:
              - 'backend/**'
            codeql_js:
              - 'frontend/**'
              - 'functions/**'
