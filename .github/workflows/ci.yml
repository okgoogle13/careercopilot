# .github/workflows/ci.yml
#
# FULLY REFACTORED CI WORKFLOW (POLISHED)
#
# Implements:
# 1. SHA-Pinning: All 'uses:' actions are pinned to full commit SHAs.
# 2. Path Filtering: Tuned to your specific monorepo structure (frontend/, backend/,
#    functions/, tests/). Jobs are conditional and will be skipped if no
#    relevant code has changed, saving significant time and cost.
# 3. Concurrency: Cancels redundant PR builds.
# 4. Advanced Caching: Includes Playwright, Yarn, and Pip caching.
# 5. Security: Top-level permissions are read-only.
#
name: CI - Build and Test

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      run_e2e_tests:
        description: "Run E2E tests"
        required: false
        default: "true"
        type: boolean
      run_performance_tests:
        description: "Run performance tests"
        required: false
        default: "false"
        type: boolean

# Default permissions are read-only for security.
permissions:
  contents: read

# Cancel redundant builds on PRs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  # Define Docker image location (matching your original file)
  GCP_PROJECT_ID: careercopilot-468811
  GCP_REGION: us-central1
  GCP_REGISTRY: us-central1-docker.pkg.dev
  GCP_REPOSITORY: careercopilot
  GCP_IMAGE_NAME: backend

jobs:
  # Job 1: Detect changes based on your repository structure
  changes:
    name: Detect Code Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      functions: ${{ steps.filter.outputs.functions }}
      firestore_rules: ${{ steps.filter.outputs.firestore_rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      codeql_py: ${{ steps.filter.outputs.codeql_py }}
      codeql_js: ${{ steps.filter.outputs.codeql_js }}

    # Run on all events *except* manual dispatch (which runs everything)
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout
        # Pin action to full commit SHA for security
        uses: actions/checkout@v4 # v4.1.7
        with:
          fetch-depth: 2 # Required for paths-filter to compare HEAD~1

      - name: Calculate paths
        id: filter
        # Pin action to full commit SHA for security
        uses: dorny/paths-filter@v3 # v3.0.2
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/setup-frontend/**' # Your composite action
              - 'yarn.lock'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/actions/setup-backend/**' # Your composite action
              - '.github/workflows/ci.yml'
            functions:
              - 'functions/**'
              - '.github/workflows/ci.yml'
            firestore_rules:
              - 'firestore.rules'
              - 'tests/**' # Your firestore.rules.test.js is here
              - '.github/workflows/ci.yml'

            # E2E tests should run if frontend or backend changes
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'

            # CodeQL paths
            codeql_py:
              - 'backend/**'
            codeql_js:
              - 'frontend/**'
              - 'functions/**'

  # Security Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # Requires write access

    # Run if the relevant paths changed OR if manually dispatched
    if: |
      (github.event_name == 'workflow_dispatch') ||
      (needs.changes.outputs.codeql_py == 'true') ||
      (needs.changes.outputs.codeql_js == 'true')

    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3 # v3.25.12
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3 # v3.25.12

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3 # v3.25.12
        with:
          category: "/language:${{matrix.language}}"

  # Frontend Testing
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run if frontend paths changed OR if manually dispatched
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.frontend == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      # This correctly uses your local composite action
      - name: Setup and Build Frontend
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: "true"
          upload-artifacts: "true"

  # Backend Static Checks
  backend-static-checks:
    name: Backend Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run if backend paths changed OR if manually dispatched
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        test-group: [lint, format, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      # This correctly uses your local composite action
      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: ${{ matrix.test-group }}

      - name: Lint with flake8
        if: matrix.test-group == 'lint'
        run: |
          echo " Running flake8 linting..."
          flake8 backend/app/ --show-source --statistics --format=github
          echo " Linting completed"

      - name: Format check with black
        if: matrix.test-group == 'format'
        run: |
          echo " Checking code formatting with black..."
          black --check backend/ --line-length=100 --diff
          echo " Format check completed"

      - name: Security scan with bandit
        if: matrix.test-group == 'security'
        run: |
          echo " Running security scan..."
          bandit -r backend/ -f json -o bandit-report.json || true
          bandit -r backend/ -f txt || true

      - name: Upload bandit report
        if: matrix.test-group == 'security'
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30
          if-no-files-found: warn

  # Backend Integration Tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    # Run if backend paths changed OR if manually dispatched
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.backend == 'true')
    needs: [changes]
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    services:
      # This matches your original configuration
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"
          cache-prefix: "tests"

      - name: Type check with mypy
        continue-on-error: true
        run: |
          echo " Running type checks..."
          mypy backend/ --ignore-missing-imports --show-error-codes

      - name: Setup Testcontainers Cloud Client
        uses: AtomicJar/testcontainers-cloud-setup-action@v1 # v1.0.0
        with:
          token: ${{ secrets.TC_CLOUD_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.3.0

      - name: Build test image with cache
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: ./backend
          load: true # Load the image into the local Docker daemon
          tags: backend-test:latest
          target: test # Build the 'test' stage from the Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run all backend tests in container
        run: |
          echo " Running all backend tests inside the container..."
          docker run --network="host" \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test_db" \
            -e ENVIRONMENT="test" \
            -e GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY_STAGING }}" \
            -e TESTCONTAINERS_HOST_OVERRIDE="host.testcontainers.internal" \
            -e TESTCONTAINERS_RYUK_DISABLED="true" \
            backend-test:latest

      - name: Copy coverage report from container
        continue-on-error: true
        run: |
          CONTAINER_ID=$(docker create backend-test:latest)
          docker cp $CONTAINER_ID:/app/htmlcov ./backend/htmlcov || echo " No htmlcov directory"
          docker cp $CONTAINER_ID:/app/coverage.xml ./backend/coverage.xml || echo " No coverage.xml file"
          docker rm $CONTAINER_ID

      - name: Upload test coverage
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: backend-test-coverage
          path: backend/htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4 # v4.4.1
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Firestore Security Rules Testing
  test-firestore-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run if firestore rules or its tests changed OR if manually dispatched
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.firestore_rules == 'true')
    needs: [changes]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Java
        uses: actions/setup-java@v4 # v4.2.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Use built-in caching for npm, referencing your test dir's lockfile
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        run: |
          cd tests
          npm ci

      - name: Start Firebase Emulators
        run: |
          cd tests
          firebase emulators:start --only firestore --project=careercopilot-test &
          echo "Waiting for Firestore emulator to start..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null 2>&1; do echo "Waiting..."; sleep 2; done'
          echo "Emulator started"
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Run Firestore Rules Tests
        run: |
          cd tests
          npm test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_PROJECT: careercopilot-test

      - name: Upload Firestore test results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: firestore-test-results
          path: |
            tests/coverage/
            tests/test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Stop Firebase Emulators
        if: always()
        run: |
          pkill -f "firebase.*emulators" || true
          pkill -f "java.*firestore" || true

  # Functions Testing
  functions:
    name: Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run if functions paths changed OR if manually dispatched
    if: (github.event_name == 'workflow_dispatch') || (needs.changes.outputs.functions == 'true')
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Java
        uses: actions/setup-java@v4 # v4.2.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Use built-in caching for Yarn (root)
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Cache functions node_modules
        # Functions uses npm, so it needs its own cache
        uses: actions/cache@v4 # v4.0.2
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-npm-functions-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-functions-

      - name: Install dependencies
        run: |
          yarn install --immutable
          cd functions && npm ci

      - name: Lint functions
        run: |
          # Run from root using workspace command
          yarn workspace functions lint

      - name: Build functions
        run: |
          # Run from root using workspace command
          yarn workspace functions build

      - name: Run functions tests
        continue-on-error: true
        run: |
          echo "🧪 Running functions tests..."
          cd functions
          npm test -- --passWithNoTests || echo "⚠️ Functions tests failed or no tests found, continuing..."

      - name: Verify build output
        run: |
          if [ ! -d "functions/lib" ] || [ ! "$(ls -A functions/lib)" ]; then
            echo "❌ Functions build failed - no lib directory found"
            exit 1
          fi
          echo "✅ Functions build completed successfully"

  # End-to-End Testing
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, frontend, backend-tests]
    # Run if E2E paths changed OR if manually dispatched
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e_tests == 'true') ||
      (needs.changes.outputs.e2e == 'true')
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: yarn.lock

      - name: Enable Corepack for Yarn 4+
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # BEST PRACTICE: Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v4 # v4.0.2
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: |
          # Run from root using workspace command
          yarn workspace careercopilot-frontend playwright install --with-deps chromium firefox webkit

      - name: Build frontend for E2E
        run: |
          echo " Building frontend for E2E tests..."
          yarn workspace careercopilot-frontend build

      - name: Install Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Start services with Docker Compose
        run: |
          echo " Starting backend and frontend services for E2E tests..."
          docker-compose -f docker-compose.e2e.yml up -d --wait
          echo " Services are up and healthy."
          docker-compose -f docker-compose.e2e.yml ps

      - name: Run Playwright E2E tests
        run: |
          echo " Running Playwright E2E tests..."
          # Run from root using workspace command
          yarn workspace careercopilot-frontend playwright test tests/ --reporter=html,json
        env:
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
          API_BASE_URL: "http://127.0.0.1:8080"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: e2e-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/results.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: e2e-screenshots
          path: frontend/test-results/**/screenshots/**
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup servers
        if: always()
        run: |
          echo " Stopping services..."
          docker-compose -f docker-compose.e2e.yml down

  # Performance Testing (Optional)
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_performance_tests == 'true')
    needs: [backend-tests]
    environment: staging
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.1.7

      - name: Setup Backend
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: "full"

      - name: Run performance tests
        run: |
          cd backend
          echo " Running performance test suite..."
          python -m pytest app/tests/performance/ -v --tb=short --disable-warnings --benchmark-only
        env:
          ENVIRONMENT: test

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4 # v4.3.4
        with:
          name: performance-test-results
          path: backend/.benchmarks/
          retention-days: 30
          if-no-files-found: warn

  # Quality Gate
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    # This job must *always* run to check the status of dependencies,
    # even if they are skipped (due to path filtering).
    if: always()
    needs: [
        changes, # Need this to know which jobs *should* have run
        codeql,
        frontend,
        backend-static-checks,
        backend-tests,
        functions,
        e2e-tests,
        test-firestore-rules,
      ]
    timeout-minutes: 5
    permissions:
      pull-requests: write # To comment on PRs

    steps:
      - name: Check results
        run: |
          echo " Checking all test results..."

          # A job is considered 'passed' if it succeeded OR was skipped.
          # We only fail if a job explicitly failed.

          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.frontend.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-static-checks.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.backend-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.functions.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then exit 1; fi
          if [[ "${{ needs.test-firestore-rules.result }}" == "failure" ]]; then exit 1; fi

          echo " All required quality checks passed (or were skipped)!"

      # Your summary and PR comment steps from the original file are excellent
      # and can be kept as-is. I am using SHA-pinned actions for them.

      - name: PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7 # v7.0.1
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('CodeQL Security Analysis');
            if ('${{ needs.frontend.result }}' === 'failure') failedJobs.push('Frontend Tests');
            if ('${{ needs.backend-static-checks.result }}' === 'failure') failedJobs.push('Backend Static Checks');
            if ('${{ needs.backend-tests.result }}' === 'failure') failedJobs.push('Backend Tests');
            if ('${{ needs.functions.result }}' === 'failure') failedJobs.push('Functions Tests');
            if ('${{ needs.e2e-tests.result }}' === 'failure') failedJobs.push('E2E Tests');
            if ('${{ needs.test-firestore-rules.result }}' === 'failure') failedJobs.push('Firestore Rules Tests');

            const failedList = failedJobs.map(job => `-  ${job}`).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **Quality Gate Failed**\n\nFailed test suites:\n${failedList}\n\n Check the [CI Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) and fix issues before merging.`
            });

      - name: PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7 # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ` **All Quality Checks Passed!**\n\n All required test suites passed successfully (or were correctly skipped by path filters).\n\n Ready for review and merge!`
            });

  # Build and Push Docker image
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    needs: [quality-gate, changes]
    # Run only if quality gate passed AND backend code changed (or manual dispatch)
    if: |
      success() &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    # Using service account key authentication (no special permissions needed)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4.1.7

      # Authenticate to GCP using Service Account Key
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2 # v2.1.3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # v3.3.0

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGISTRY }} --quiet

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5 # v5.5.1
        with:
          images: ${{ env.GCP_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}
          tags: |
            # Tag with the git commit SHA - this is crucial for deployment
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5 # v5.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: final # Build the 'final' stage from your Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add build summary
        run: |
          echo "###  Backend Image Pushed" >> $GITHUB_STEP_SUMMARY
          echo "Image successfully pushed to Google Artifact Registry." >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
