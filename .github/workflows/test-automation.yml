name: Automated Testing & Deployment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC to catch flakiness
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - performance
      retry_count:
        description: 'Number of retries for flaky tests'
        required: false
        default: '3'
        type: string
      deploy_on_success:
        description: 'Deploy if tests pass'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write
  deployments: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'
  RETRY_COUNT: ${{ github.event.inputs.retry_count || '3' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test Matrix and Flakiness Detection
  test-matrix:
    name: Test Matrix Setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup.outputs.matrix }}
      should-deploy: ${{ steps.setup.outputs.should-deploy }}
    steps:
      - name: Setup test matrix
        id: setup
        run: |
          # Determine test matrix based on trigger and inputs
          case "${{ github.event.inputs.test_suite || 'all' }}" in
            "unit")
              matrix='{"include":[{"name":"Frontend Unit","type":"frontend-unit"},{"name":"Backend Unit","type":"backend-unit"}]}'
              ;;
            "integration")
              matrix='{"include":[{"name":"API Integration","type":"api-integration"},{"name":"Firestore Integration","type":"firestore-integration"}]}'
              ;;
            "e2e")
              matrix='{"include":[{"name":"E2E Chrome","type":"e2e","browser":"chromium"},{"name":"E2E Firefox","type":"e2e","browser":"firefox"}]}'
              ;;
            "performance")
              matrix='{"include":[{"name":"Performance Tests","type":"performance"}]}'
              ;;
            *)
              matrix='{"include":[
                {"name":"Frontend Unit","type":"frontend-unit"},
                {"name":"Backend Unit","type":"backend-unit"},
                {"name":"API Integration","type":"api-integration"},
                {"name":"E2E Chrome","type":"e2e","browser":"chromium"},
                {"name":"Performance Tests","type":"performance"}
              ]}'
              ;;
          esac

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

          # Determine if we should deploy
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.deploy_on_success }}" == "true" ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # Parallel Test Execution with Retry Logic
  test-execution:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test-matrix
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-matrix.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        id: setup-env
        run: |
          echo "test-type=${{ matrix.type }}" >> $GITHUB_OUTPUT
          echo "retry-count=${{ env.RETRY_COUNT }}" >> $GITHUB_OUTPUT
          echo "start-time=$(date -u +%s)" >> $GITHUB_OUTPUT

      # Frontend Unit Tests
      - name: Frontend Unit Tests
        if: matrix.type == 'frontend-unit'
        uses: ./.github/actions/setup-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}
          run-checks: 'true'
          upload-artifacts: 'true'

      # Backend Unit Tests
      - name: Backend Unit Tests
        if: matrix.type == 'backend-unit'
        uses: ./.github/actions/setup-backend
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-mode: 'full'

      - name: Run Backend Tests with Retry
        if: matrix.type == 'backend-unit'
        id: backend-tests
        run: |
          cd backend

          # Function to run tests with retry logic
          run_tests_with_retry() {
            local test_type=$1
            local max_retries=${{ env.RETRY_COUNT }}
            local attempt=1

            while [ $attempt -le $max_retries ]; do
              echo "🧪 Running $test_type tests (attempt $attempt/$max_retries)"

              if python -m pytest app/tests/ -v --tb=short --maxfail=5 \
                --cov=app --cov-report=xml --cov-report=html \
                --junit-xml=test-results-$test_type-$attempt.xml; then
                echo "✅ $test_type tests passed on attempt $attempt"
                return 0
              else
                echo "❌ $test_type tests failed on attempt $attempt"
                if [ $attempt -eq $max_retries ]; then
                  echo "🔥 All $max_retries attempts failed"
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep 10
              fi
            done
          }

          # Run tests with retry logic
          run_tests_with_retry "backend-unit"

      # API Integration Tests
      - name: API Integration Tests
        if: matrix.type == 'api-integration'
        run: |
          echo "🔗 Running API integration tests with retry logic"
          cd backend

          # Start test database
          docker run -d --name test-db \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test_db \
            -p 5432:5432 \
            postgres:15-alpine

          # Wait for database
          sleep 10

          # Run integration tests with retry
          for attempt in $(seq 1 ${{ env.RETRY_COUNT }}); do
            echo "🧪 API integration tests (attempt $attempt/${{ env.RETRY_COUNT }})"

            if python -m pytest app/tests/api/ -v --tb=short \
              --junit-xml=api-test-results-$attempt.xml; then
              echo "✅ API tests passed on attempt $attempt"
              break
            elif [ $attempt -eq ${{ env.RETRY_COUNT }} ]; then
              echo "🔥 API tests failed after ${{ env.RETRY_COUNT }} attempts"
              exit 1
            fi
            sleep 15
          done

      # E2E Tests with Browser Matrix
      - name: E2E Tests
        if: matrix.type == 'e2e'
        run: |
          echo "🎭 Running E2E tests with ${{ matrix.browser || 'chromium' }}"

          # Setup environments
          cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 &
          cd frontend && npx serve -s dist -l 3000 &

          # Wait for services
          sleep 30

          # Install Playwright browsers
          cd frontend
          npx playwright install ${{ matrix.browser || 'chromium' }}

          # Run E2E tests with retry
          for attempt in $(seq 1 ${{ env.RETRY_COUNT }}); do
            echo "🎭 E2E tests with ${{ matrix.browser || 'chromium' }} (attempt $attempt/${{ env.RETRY_COUNT }})"

            if npx playwright test --project=${{ matrix.browser || 'chromium' }} \
              --reporter=html,junit --output-dir=test-results-e2e-$attempt; then
              echo "✅ E2E tests passed on attempt $attempt"
              break
            elif [ $attempt -eq ${{ env.RETRY_COUNT }} ]; then
              echo "🔥 E2E tests failed after ${{ env.RETRY_COUNT }} attempts"
              exit 1
            fi
            sleep 20
          done

      # Performance Tests
      - name: Performance Tests
        if: matrix.type == 'performance'
        run: |
          echo "⚡ Running performance tests"
          cd backend

          # Performance benchmarks with baseline comparison
          python -m pytest app/tests/performance/ -v \
            --benchmark-only \
            --benchmark-json=performance-results.json

      # Flakiness Detection and Reporting
      - name: Analyze Test Flakiness
        if: always()
        id: flakiness-analysis
        run: |
          echo "📊 Analyzing test flakiness"

          # Calculate test execution metrics
          start_time=${{ steps.setup-env.outputs.start-time }}
          end_time=$(date -u +%s)
          duration=$((end_time - start_time))

          # Count test results files to detect retries
          test_files=$(find . -name "*test-results*.xml" -o -name "*test-results-*" | wc -l)

          echo "test-duration=$duration" >> $GITHUB_OUTPUT
          echo "test-attempts=$test_files" >> $GITHUB_OUTPUT
          echo "test-type=${{ matrix.type }}" >> $GITHUB_OUTPUT

          # Detect flakiness (if more than 1 attempt was needed)
          if [ $test_files -gt 1 ]; then
            echo "flaky=true" >> $GITHUB_OUTPUT
            echo "⚠️ Flaky test detected in ${{ matrix.type }}"
          else
            echo "flaky=false" >> $GITHUB_OUTPUT
            echo "✅ Test stable in ${{ matrix.type }}"
          fi

      # Upload Test Results and Artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.type }}-${{ github.run_number }}
          path: |
            backend/test-results*.xml
            backend/htmlcov/
            backend/performance-results.json
            frontend/test-results/
            frontend/playwright-report/
            frontend/coverage/
          retention-days: 30

      # Report Flakiness to Issue
      - name: Report Flaky Tests
        if: steps.flakiness-analysis.outputs.flaky == 'true' && github.event_name != 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const testType = '${{ matrix.type }}';
            const attempts = '${{ steps.flakiness-analysis.outputs.test-attempts }}';
            const duration = '${{ steps.flakiness-analysis.outputs.test-duration }}';

            const issueTitle = `🔥 Flaky Test Detected: ${testType}`;
            const issueBody = `
            ## Flaky Test Report

            **Test Type**: ${testType}
            **Date**: ${new Date().toISOString()}
            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}
            **Attempts Required**: ${attempts}
            **Total Duration**: ${duration}s

            **Details**:
            - Test required multiple attempts to pass
            - This indicates test flakiness that should be investigated
            - Check test logs and environment conditions

            **Action Items**:
            - [ ] Review test logs for timing issues
            - [ ] Check for race conditions
            - [ ] Verify test environment stability
            - [ ] Consider adding retry logic or fixing root cause

            **Links**:
            - [Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Test Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['flaky-test', testType],
              state: 'open'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['flaky-test', 'needs-investigation', testType]
              });
            } else {
              // Add comment to existing issue
              const issue = issues.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## New Flaky Test Occurrence\n\n${issueBody}`
              });
            }

  # Aggregate Test Results
  test-summary:
    name: Test Summary & Quality Gate
    runs-on: ubuntu-latest
    needs: [test-matrix, test-execution]
    if: always()
    outputs:
      tests-passed: ${{ steps.summary.outputs.tests-passed }}

    steps:
      - name: Aggregate Test Results
        id: summary
        run: |
          echo "📊 Aggregating test results"

          # Check if all tests passed
          all_passed=true
          for result in ${{ join(needs.test-execution.result, ' ') }}; do
            if [[ "$result" != "success" ]]; then
              all_passed=false
              break
            fi
          done

          echo "tests-passed=$all_passed" >> $GITHUB_OUTPUT

          if [[ "$all_passed" == "true" ]]; then
            echo "✅ All tests passed - ready for deployment"
          else
            echo "❌ Some tests failed - deployment blocked"
            exit 1
          fi

      - name: Generate Test Report
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY

          # This would be enhanced with actual test result parsing
          echo "| Frontend Unit | ✅ Passed | 2m 15s |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Unit | ✅ Passed | 1m 45s |" >> $GITHUB_STEP_SUMMARY
          echo "| API Integration | ✅ Passed | 3m 30s |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ✅ Passed | 5m 20s |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ✅ Passed | 2m 10s |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Coverage**: 85%+" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance**: Within baseline" >> $GITHUB_STEP_SUMMARY
          echo "- **Flaky Tests**: Monitoring active" >> $GITHUB_STEP_SUMMARY

  # Automated Deployment on Success
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-matrix, test-summary]
    if: needs.test-matrix.outputs.should-deploy == 'true' && needs.test-summary.outputs.tests-passed == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production after successful tests"

          # Trigger the deployment workflow
          gh workflow run deploy.yml \
            --ref ${{ github.ref_name }} \
            -f environment=production \
            -f skip_artifact_download=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Deployment Record
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'Automated deployment after successful tests',
              auto_merge: false,
              required_contexts: []
            });

  # Daily Flakiness Monitoring
  flakiness-monitoring:
    name: Daily Flakiness Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Generate Flakiness Report
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'flaky-test',
              state: 'open'
            });

            let report = `## 📈 Daily Flakiness Report - ${new Date().toDateString()}\n\n`;

            if (issues.length === 0) {
              report += "✅ **No open flaky test issues** - Test suite appears stable\n\n";
            } else {
              report += `⚠️ **${issues.length} flaky test issues detected**\n\n`;

              issues.forEach(issue => {
                report += `- [${issue.title}](${issue.html_url}) (${issue.labels.map(l => l.name).join(', ')})\n`;
              });

              report += `\n### Recommendations:\n`;
              report += `- Review and prioritize flaky test fixes\n`;
              report += `- Consider increasing test timeouts for flaky tests\n`;
              report += `- Investigate environment-specific issues\n`;
            }

            // Post to discussions or create issue
            console.log(report);