# Test Results Caching Configuration
# This file defines caching strategies for test execution optimization

cache_strategies:
  dependencies:
    # Node.js dependencies
    node_modules:
      key: "node-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}"
      paths:
        - "~/.npm"
        - "~/.yarn"
        - "node_modules"
        - "frontend/node_modules"
        - "functions/node_modules"
      ttl: "30d"

    # Python dependencies
    python_deps:
      key: "python-${{ runner.os }}-${{ hashFiles('**/requirements.txt', '**/requirements.in') }}"
      paths:
        - "~/.cache/pip"
        - "backend/venv"
      ttl: "30d"

    # Playwright browsers
    playwright:
      key: "playwright-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}"
      paths:
        - "~/.cache/ms-playwright"
      ttl: "30d"

  test_artifacts:
    # Test results for incremental testing
    test_cache:
      key: "tests-${{ runner.os }}-${{ hashFiles('**/*.py', '**/*.js', '**/*.ts', '**/*.tsx') }}"
      paths:
        - "backend/.pytest_cache"
        - "frontend/.jest_cache"
        - "backend/htmlcov"
        - "frontend/coverage"
      ttl: "7d"

    # Build artifacts
    build_cache:
      key: "build-${{ runner.os }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js') }}"
      paths:
        - "frontend/dist"
        - "frontend/.vite"
        - "backend/__pycache__"
        - "functions/lib"
      ttl: "24h"

  performance:
    # Performance test baselines
    benchmarks:
      key: "benchmarks-${{ runner.os }}-${{ github.ref_name }}"
      paths:
        - ".github/baselines"
        - "backend/.benchmarks"
        - "performance-history.json"
      ttl: "90d"

optimization_settings:
  # Skip tests if no relevant files changed
  incremental_testing: true

  # Test file patterns for change detection
  test_patterns:
    frontend:
      - "frontend/src/**/*"
      - "frontend/public/**/*"
      - "frontend/package.json"
      - "frontend/tsconfig.json"
      - "frontend/vite.config.ts"

    backend:
      - "backend/app/**/*"
      - "backend/requirements.txt"
      - "backend/pyproject.toml"
      - "backend/pytest.ini"

    e2e:
      - "frontend/tests/**/*"
      - "frontend/playwright.config.ts"

    functions:
      - "functions/src/**/*"
      - "functions/package.json"
      - "functions/tsconfig.json"

  # Parallel execution settings
  parallel_jobs:
    frontend_tests: 2
    backend_tests: 4
    e2e_tests: 2

  # Timeout configurations
  timeouts:
    unit_tests: "10m"
    integration_tests: "15m"
    e2e_tests: "20m"
    performance_tests: "25m"