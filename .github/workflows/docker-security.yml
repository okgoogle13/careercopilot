name: Docker Security Scanning

on:
  pull_request:
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'Dockerfile'
  push:
    branches: [main, develop]
  schedule:
    # Run weekly on Monday at 2am UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: backend:test
          target: production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities, just report

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'docker-backend'

      - name: Run Trivy for detailed report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: 'table'
          output: 'trivy-backend-report.txt'

      - name: Generate SBOM (Software Bill of Materials)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend:test
          format: 'cyclonedx'
          output: 'backend-sbom.json'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json
          retention-days: 90

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-reports
          path: |
            trivy-backend-results.sarif
            trivy-backend-report.txt
          retention-days: 30

      - name: Parse vulnerabilities and create summary
        run: |
          echo "## 🔒 Backend Image Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f trivy-backend-report.txt ]]; then
            # Count vulnerabilities by severity
            critical=$(grep -c "CRITICAL" trivy-backend-report.txt || echo "0")
            high=$(grep -c "HIGH" trivy-backend-report.txt || echo "0")
            medium=$(grep -c "MEDIUM" trivy-backend-report.txt || echo "0")
            
            echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
            echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [[ $critical -gt 0 ]]; then
              echo "⚠️  **Action Required:** Critical vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            elif [[ $high -gt 0 ]]; then
              echo "⚠️  High severity vulnerabilities found. Please review." >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No critical or high severity vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 SBOM (Software Bill of Materials) generated and uploaded as artifact" >> $GITHUB_STEP_SUMMARY
          fi

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if frontend Dockerfile exists
        id: check-dockerfile
        run: |
          if [[ -f frontend/Dockerfile ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend Dockerfile found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Frontend Dockerfile not found at frontend/Dockerfile"
          fi

      - name: Build frontend image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'docker-frontend'

      - name: Run Trivy for detailed report
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: 'table'
          output: 'trivy-frontend-report.txt'

      - name: Generate SBOM
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend:test
          format: 'cyclonedx'
          output: 'frontend-sbom.json'

      - name: Upload SBOM artifact
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.json
          retention-days: 90

      - name: Upload security reports
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-reports
          path: |
            trivy-frontend-results.sarif
            trivy-frontend-report.txt
          retention-days: 30

      - name: Create summary
        run: |
          echo "## 🔒 Frontend Image Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.check-dockerfile.outputs.exists }}" == "true" ]]; then
            if [[ -f trivy-frontend-report.txt ]]; then
              critical=$(grep -c "CRITICAL" trivy-frontend-report.txt || echo "0")
              high=$(grep -c "HIGH" trivy-frontend-report.txt || echo "0")
              medium=$(grep -c "MEDIUM" trivy-frontend-report.txt || echo "0")
              
              echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| 🔴 Critical | $critical |" >> $GITHUB_STEP_SUMMARY
              echo "| 🟠 High | $high |" >> $GITHUB_STEP_SUMMARY
              echo "| 🟡 Medium | $medium |" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              if [[ $critical -gt 0 ]]; then
                echo "⚠️  **Action Required:** Critical vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
              elif [[ $high -gt 0 ]]; then
                echo "⚠️  High severity vulnerabilities found. Please review." >> $GITHUB_STEP_SUMMARY
              else
                echo "✅ No critical or high severity vulnerabilities found" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          else
            echo "⚠️  Frontend Dockerfile not found - scan skipped" >> $GITHUB_STEP_SUMMARY
          fi

  scan-root:
    name: Scan Root Dockerfile
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'Dockerfile')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check if root Dockerfile exists
        id: check-dockerfile
        run: |
          if [[ -f Dockerfile ]]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Root Dockerfile found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build root image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: root:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scanner on root image
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: root:test
          format: 'sarif'
          output: 'trivy-root-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        if: steps.check-dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-root-results.sarif'
          category: 'docker-root'

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [scan-backend, scan-frontend, scan-root]
    if: always()
    steps:
      - name: Generate overall summary
        run: |
          echo "## 🛡️  Docker Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.scan-backend.result == 'success' && '✅ Scanned' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.scan-frontend.result == 'success' && '✅ Scanned' || needs.scan-frontend.result == 'skipped' && '⏭️  Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Root | ${{ needs.scan-root.result == 'success' && '✅ Scanned' || needs.scan-root.result == 'skipped' && '⏭️  Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Artifacts Generated:**" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM (Software Bill of Materials) for compliance" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy SARIF reports uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- Detailed vulnerability reports in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 View detailed results in the **Security** tab or download artifacts." >> $GITHUB_STEP_SUMMARY
