name: 'Setup and Build Frontend'
description: 'Sets up Node.js, installs dependencies, and builds the frontend application'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  skip-build:
    description: 'Skip the build step (for setup-only scenarios)'
    required: false
    default: 'false'
  run-checks:
    description: 'Run linting, type checking, and formatting checks'
    required: false
    default: 'false'
  upload-artifacts:
    description: 'Upload build artifacts and bundle analysis'
    required: false
    default: 'false'
outputs:
  build-success:
    description: 'Whether the build was successful'
    value: ${{ steps.build.outputs.success }}
  dist-path:
    description: 'Path to the built frontend distribution'
    value: 'frontend/dist'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      shell: bash
      run: npm ci --prefix frontend

    - name: Type check
      if: inputs.run-checks == 'true'
      shell: bash
      run: npm run type-check --prefix frontend

    - name: Lint
      if: inputs.run-checks == 'true'
      shell: bash
      run: npm run lint:ci --prefix frontend

    - name: Format check
      if: inputs.run-checks == 'true'
      shell: bash
      run: npm run format:check --prefix frontend

    - name: Build
      id: build
      if: inputs.skip-build != 'true'
      shell: bash
      run: |
        npm run build --prefix frontend
        echo "success=true" >> $GITHUB_OUTPUT

    - name: Bundle analysis
      if: inputs.run-checks == 'true' && inputs.skip-build != 'true'
      shell: bash
      run: npm run bundle-analysis --prefix frontend

    - name: Upload bundle analysis
      if: inputs.upload-artifacts == 'true' && inputs.run-checks == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis
        path: frontend/dist/bundle-analysis.json
        retention-days: 30

    - name: Upload build artifact
      if: inputs.upload-artifacts == 'true' && inputs.skip-build != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/