name: 'Smart Test Caching'
description: 'Intelligent caching for test execution optimization'
inputs:
  cache-type:
    description: 'Type of cache to manage (dependencies, test-results, build-artifacts)'
    required: true
  cache-key-suffix:
    description: 'Additional suffix for cache key'
    required: false
    default: ''
  restore-only:
    description: 'Only restore cache, do not save'
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: 'Whether cache was hit'
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: 'The cache key used'
    value: ${{ steps.generate-key.outputs.cache-key }}

runs:
  using: 'composite'
  steps:
    - name: Generate cache key
      id: generate-key
      shell: bash
      run: |
        case "${{ inputs.cache-type }}" in
          "dependencies-node")
            hash=$(find . -name "package.json" -o -name "package-lock.json" -o -name "yarn.lock" | xargs sha256sum | sha256sum | cut -d' ' -f1)
            key="node-deps-${{ runner.os }}-${hash}${{ inputs.cache-key-suffix }}"
            paths="~/.npm
        ~/.yarn
        node_modules
        frontend/node_modules
        functions/node_modules"
            ;;
          "dependencies-python")
            hash=$(find . -name "requirements.txt" -o -name "requirements.in" -o -name "pyproject.toml" | xargs sha256sum | sha256sum | cut -d' ' -f1)
            key="python-deps-${{ runner.os }}-${hash}${{ inputs.cache-key-suffix }}"
            paths="~/.cache/pip
        backend/venv
        backend/.venv"
            ;;
          "test-results")
            # Use git tree hash for test files
            test_hash=$(git ls-tree -r HEAD --name-only | grep -E '\.(py|js|ts|tsx)$' | xargs sha256sum | sha256sum | cut -d' ' -f1)
            key="test-results-${{ runner.os }}-${test_hash}${{ inputs.cache-key-suffix }}"
            paths="backend/.pytest_cache
        frontend/.jest_cache
        backend/htmlcov
        frontend/coverage
        .nyc_output"
            ;;
          "build-artifacts")
            # Use source file hash for builds
            build_hash=$(find frontend/src backend/app -type f -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.py" | xargs sha256sum | sha256sum | cut -d' ' -f1)
            key="build-artifacts-${{ runner.os }}-${build_hash}${{ inputs.cache-key-suffix }}"
            paths="frontend/dist
        frontend/.vite
        backend/__pycache__
        functions/lib"
            ;;
          "playwright-browsers")
            # Browser cache - less frequent changes
            pkg_hash=$(sha256sum frontend/package.json | cut -d' ' -f1)
            key="playwright-browsers-${{ runner.os }}-${pkg_hash}${{ inputs.cache-key-suffix }}"
            paths="~/.cache/ms-playwright"
            ;;
          "performance-baselines")
            # Performance baselines - branch-specific
            key="performance-baselines-${{ runner.os }}-${{ github.ref_name }}${{ inputs.cache-key-suffix }}"
            paths=".github/baselines
        backend/.benchmarks
        performance-history.json"
            ;;
          *)
            echo "❌ Unknown cache type: ${{ inputs.cache-type }}"
            exit 1
            ;;
        esac

        echo "cache-key=$key" >> $GITHUB_OUTPUT
        echo "cache-paths<<EOF" >> $GITHUB_OUTPUT
        echo "$paths" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

        echo "🔑 Generated cache key: $key"

    - name: Restore cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.generate-key.outputs.cache-paths }}
        key: ${{ steps.generate-key.outputs.cache-key }}
        restore-keys: |
          ${{ inputs.cache-type }}-${{ runner.os }}-
        save-always: ${{ inputs.restore-only != 'true' }}

    - name: Cache statistics
      shell: bash
      run: |
        if [[ "${{ steps.cache.outputs.cache-hit }}" == "true" ]]; then
          echo "✅ Cache HIT for ${{ inputs.cache-type }}"
        else
          echo "❌ Cache MISS for ${{ inputs.cache-type }}"
        fi

        # Calculate cache size for monitoring
        total_size=0
        while IFS= read -r path; do
          if [[ -n "$path" && "$path" != " " ]]; then
            # Expand tilde
            expanded_path="${path/#\~/$HOME}"
            if [[ -d "$expanded_path" ]]; then
              size=$(du -sb "$expanded_path" 2>/dev/null | cut -f1 || echo "0")
              total_size=$((total_size + size))
            fi
          fi
        done <<< "${{ steps.generate-key.outputs.cache-paths }}"

        # Convert to human readable
        if (( total_size > 1073741824 )); then
          size_display="$(( total_size / 1073741824 ))GB"
        elif (( total_size > 1048576 )); then
          size_display="$(( total_size / 1048576 ))MB"
        elif (( total_size > 1024 )); then
          size_display="$(( total_size / 1024 ))KB"
        else
          size_display="${total_size}B"
        fi

        echo "📊 Cache size: $size_display"
