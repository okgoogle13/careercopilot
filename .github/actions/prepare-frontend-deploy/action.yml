name: 'Prepare Frontend for Deployment'
description: 'Downloads frontend artifacts or builds them as fallback'
inputs:
  node-version:
    description: 'Node.js version to use'
    required: true
    default: '22'
  artifact-name:
    description: 'Name of the frontend artifact'
    required: true
    default: 'frontend-dist'
  fallback-build:
    description: 'Whether to build if artifact not found'
    required: true
    default: 'true'
  ci-run-id:
    description: 'CI workflow run ID for artifact download'
    required: false
outputs:
  found:
    description: 'Whether artifact was found'
    value: ${{ steps.check.outputs.found }}
  built:
    description: 'Whether fallback build was executed'
    value: ${{ steps.build.outputs.built }}

runs:
  using: 'composite'
  steps:
    - name: Try to download artifact from CI workflow
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        path: frontend/dist
        repository: ${{ github.repository }}
        run-id: ${{ inputs.ci-run-id || github.event.workflow_run.id }}

    - name: Check if artifact was downloaded
      id: check
      shell: bash
      run: |
        if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
          echo "found=true" >> $GITHUB_OUTPUT
          echo "✅ Frontend artifacts downloaded successfully"
        else
          echo "found=false" >> $GITHUB_OUTPUT
          echo "❌ Frontend artifacts not found or empty"
        fi

    - name: Fallback frontend build
      id: build
      if: inputs.fallback-build == 'true' && steps.check.outputs.found == 'false'
      shell: bash
      run: |
        echo "🔨 Performing fallback frontend build..."
        echo "built=true" >> $GITHUB_OUTPUT

    - name: Enable Corepack
      if: steps.build.outputs.built == 'true'
      shell: bash
      run: |
        corepack enable
        corepack prepare yarn@4.10.2 --activate

    - name: Setup Node.js for fallback build
      if: steps.build.outputs.built == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies with lockfile fix
      if: steps.build.outputs.built == 'true'
      shell: bash
      run: |
        echo "📦 Installing dependencies..."

        # Clean up any existing installation artifacts
        rm -rf node_modules .yarn/cache .yarn/install-state.gz .yarn/build-state.yml 2>/dev/null || true

        # Ensure we're using the correct Node.js version
        echo "Using Node.js $(node -v)"
        echo "Using Yarn $(yarn --version)"

        # Try to install with frozen lockfile first
        echo "Attempting to install with frozen lockfile..."
        if yarn install --immutable; then
          echo "✅ Successfully installed with frozen lockfile"
          exit 0
        fi

        echo "⚠️  Frozen install failed, trying with --check-cache..."
        if yarn install --check-cache; then
          echo "✅ Successfully installed with --check-cache"
          exit 0
        fi

        # If we get here, the lockfile is probably out of sync
        echo "⚠️  Install with lockfile failed, updating lockfile..."

        # Backup the lockfile for reference
        cp yarn.lock yarn.lock.backup 2>/dev/null || true

        # Update the lockfile
        if yarn install --mode=update-lockfile; then
          echo "✅ Successfully updated lockfile and installed dependencies"
          # Optionally, you could commit the updated lockfile here if needed
          # git config --global user.name 'GitHub Actions'
          # git config --global user.email 'github-actions@github.com'
          # git add yarn.lock
          # git commit -m 'Update yarn.lock' || true
          exit 0
        fi

        # Last resort: clean install with fresh node_modules
        echo "⚠️  Install with updated lockfile failed, performing clean install..."
        rm -rf node_modules .yarn/cache yarn.lock
        if yarn install; then
          echo "✅ Successfully performed clean install"
          exit 0
        fi

        echo "❌ All installation attempts failed"
        exit 1

    - name: Build frontend
      if: steps.build.outputs.built == 'true'
      shell: bash
      run: |
        echo "🏗️ Building frontend application..."
        yarn build:frontend || {
          echo "⚠️  Build failed, creating minimal fallback..."
          mkdir -p frontend/dist
          cat > frontend/dist/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>CareerCopilot</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
        </head>
        <body>
            <h1>CareerCopilot</h1>
            <p>Application is being deployed. Please check back shortly.</p>
        </body>
        </html>
        EOF
        }

    - name: Copy dist to deployment location
      if: steps.build.outputs.built == 'true'
      shell: bash
      run: |
        if [ -d "frontend/dist" ] && [ "$(ls -A frontend/dist)" ]; then
          echo "✅ Frontend build completed successfully"
          # Copy to root dist for Firebase deployment
          mkdir -p dist
          cp -r frontend/dist/* dist/
        else
          echo "❌ Frontend build failed - creating minimal fallback"
          mkdir -p dist
          echo '<html><head><title>CareerCopilot</title></head><body><h1>Deployment in Progress</h1><p>The application is being deployed. Please check back shortly.</p></body></html>' > dist/index.html
        fi
