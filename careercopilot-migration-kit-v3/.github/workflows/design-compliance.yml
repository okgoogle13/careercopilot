name: Design Compliance

on:
  pull_request:
    paths:
      - 'careercopilot-migration-kit-v3/**'
  workflow_dispatch:

jobs:
  compliance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: careercopilot-migration-kit-v3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install root workspace dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn type-check

      - name: Unit tests
        run: yarn test

      - name: Design audit
        run: yarn design-audit --json
