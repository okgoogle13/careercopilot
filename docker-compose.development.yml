version: '3.8'

networks:
  careercopilot-dev-network:
    driver: bridge

services:
  # Development PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: careercopilot-dev-postgres
    environment:
      POSTGRES_DB: careercopilot_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d careercopilot_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - careercopilot-dev-network
    restart: unless-stopped

  # Development Backend with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: careercopilot-dev-backend
    environment:
      - DATABASE_URL=postgresql://dev_user:dev_password@postgres:5432/careercopilot_dev
      - PORT=8080
      - ENV=development
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - careercopilot-dev-network
    restart: unless-stopped

  # Development Frontend with hot reload
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: careercopilot-dev-frontend
    environment:
      - VITE_API_URL=http://localhost:8080
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - careercopilot-dev-network
    restart: unless-stopped

  # Storybook Component Library
  storybook:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: careercopilot-storybook
    command: npm run storybook -- --host
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "6006:6006"
    networks:
      - careercopilot-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:

