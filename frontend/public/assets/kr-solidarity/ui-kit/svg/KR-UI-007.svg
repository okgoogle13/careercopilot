<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Stone — Heavy Container</title>
  <desc>Chunky slab container with subtle crack accent wedge for kr-solidarity UI kit. Heavy visual weight primitive.</desc>
  <g id="base">
    <rect x="36" y="72" width="440" height="368" rx="16" ry="4" fill="var(--kr-surface)" stroke="var(--kr-text)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36" y="72" width="440" height="368" rx="16" ry="4" fill="var(--kr-tertiary)" opacity="0.06"/>
  </g>
  <g id="content">
    <rect x="68" y="108" width="240" height="16" rx="8" ry="4" fill="var(--kr-text)" opacity="0.6"/>
    <rect x="68" y="140" width="160" height="10" rx="5" ry="3" fill="var(--kr-tertiary)" opacity="0.35"/>
    <line x1="68" y1="176" x2="444" y2="176" stroke="var(--kr-tertiary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>
    <rect x="68" y="204" width="376" height="180" rx="12" ry="6" fill="var(--kr-tertiary)" opacity="0.07"/>
    <rect x="88" y="224" width="336" height="8" rx="4" ry="2" fill="var(--kr-text)" opacity="0.15"/>
    <rect x="88" y="248" width="300" height="8" rx="3" ry="2" fill="var(--kr-text)" opacity="0.12"/>
    <rect x="88" y="272" width="320" height="8" rx="4" ry="3" fill="var(--kr-text)" opacity="0.12"/>
  </g>
  <g id="accent">
