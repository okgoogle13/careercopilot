<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Kerala Rage Poster Logo</title>
  <desc>Poster variant with palm tree and moon on solidarity red background for print and hero sections</desc>

  <g id="base">
    <!-- Solidarity red background -->
    <rect width="512" height="512" fill="var(--sys-color-solidarityRed-base)"/>
  </g>

  <g id="content">
    <!-- Crescent moon (positioned left-upper, high contrast on red) -->
    <path d="M 180 140 Q 165 180 165 220 Q 165 260 180 300 Q 155 285 145 260 Q 135 235 135 210 Q 135 185 145 160 Q 155 135 180 140 Z" fill="var(--sys-color-stencilYellow-base)" opacity="0.95"/>

    <!-- Palm tree trunk (dark silhouette) -->
    <path d="M 285 420 Q 280 380 278 340 Q 276 300 274 260 Q 272 220 270 180 Q 268 140 265 100" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 265 100 Q 263 95 260 90" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Palm fronds (dark silhouettes) -->
    <!-- Top frond (left) -->
    <path d="M 265 105 Q 235 95 205 90 Q 190 88 175 87" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 205 90 Q 200 100 195 110 Q 190 118 185 125" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Top frond (right) -->
    <path d="M 268 102 Q 295 92 322 87 Q 337 85 352 84" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 322 87 Q 327 97 332 107 Q 337 115 342 122" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Mid-left frond -->
    <path d="M 270 150 Q 245 155 220 158 Q 200 160 180 160" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 220 158 Q 215 170 210 182" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Mid-right frond -->
    <path d="M 273 155 Q 300 160 327 163 Q 347 165 367 165" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 327 163 Q 332 175 337 187" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Lower fronds -->
    <path d="M 274 210 Q 250 225 226 238" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 276 215 Q 298 230 320 243" stroke="var(--sys-color-charcoalBackground-base)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>

  <g id="accent">
    <!-- Flying birds (dark silhouettes on red) -->
    <path d="M 140 190 Q 135 185 130 190 Q 135 195 140 190 Z" fill="var(--sys-color-charcoalBackground-base)"/>
    <path d="M 160 175 Q 155 170 150 175 Q 155 180 160 175 Z" fill="var(--sys-color-charcoalBackground-base)" opacity="0.95"/>
    <path d="M 120 210 Q 115 205 110 210 Q 115 215 120 210 Z" fill="var(--sys-color-charcoalBackground-base)" opacity="0.9"/>

    <!-- Moon glow (yellow on red) -->
    <ellipse cx="165" cy="220" rx="45" ry="60" fill="var(--sys-color-stencilYellow-base)" opacity="0.2"/>

    <!-- Coconut accents (light for contrast) -->
    <ellipse cx="280" cy="170" rx="8" ry="10" fill="var(--sys-color-worker-ash-base)" opacity="0.6"/>
    <ellipse cx="282" cy="195" rx="7" ry="9" fill="var(--sys-color-worker-ash-base)" opacity="0.5"/>
  </g>
</svg>