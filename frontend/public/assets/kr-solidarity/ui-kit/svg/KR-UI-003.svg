<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Job Tile — Listing Card with Seed Slot</title>
  <desc>Job listing card primitive with obvious seed badge slot at top-right for kr-solidarity UI kit.</desc>
  <g id="base">
    <rect x="40" y="44" width="432" height="424" rx="20" ry="6" fill="none" stroke="var(--kr-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="content">
    <rect x="72" y="88" width="200" height="14" rx="7" ry="4" fill="var(--kr-text)" opacity="0.7"/>
    <rect x="72" y="118" width="140" height="10" rx="5" ry="3" fill="var(--kr-tertiary)" opacity="0.5"/>
    <line x1="72" y1="156" x2="400" y2="156" stroke="var(--kr-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <rect x="72" y="180" width="340" height="8" rx="4" ry="2" fill="var(--kr-text)" opacity="0.2"/>
    <rect x="72" y="200" width="290" height="8" rx="4" ry="3" fill="var(--kr-text)" opacity="0.2"/>
    <rect x="72" y="280" width="100" height="36" rx="14" ry="6" fill="var(--kr-primary)" opacity="0.15"/>
    <rect x="190" y="280" width="80" height="36" rx="10" ry="8" fill="var(--kr-tertiary)" opacity="0.12"/>
    <rect x="72" y="370" width="180" height="42" rx="18" ry="6" fill="var(--kr-primary)" opacity="0.2"/>
  </g>
  <g id="accent">
    <rect x="378" y="52" width="82" height="54" rx="8" ry="4" fill="var(--kr-secondary)" opacity="0.8" transform="rotate(2 419 79)"/>
    <rect x="390" y="64" width="50" height="6" rx="3" ry="2" fill="var(--kr-surface)" opacity="0.9"/>
  </g>
</svg>