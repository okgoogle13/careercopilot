<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Wheat Sheaf</title>
  <desc>Agricultural labor and worker solidarity symbol representing collective strength</desc>

  <g id="base">
    <!-- Ground shadow -->
    <ellipse cx="256" cy="395" rx="75" ry="20" fill="var(--sys-color-charcoalBackground-base)" opacity="0.5"/>
  </g>

  <g id="content">
    <!-- Central stalk -->
    <path d="M 256 380 Q 254 320 252 260 Q 250 200 248 140" stroke="var(--sys-color-inkGold-base)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left stalk -->
    <path d="M 230 385 Q 228 330 226 275 Q 224 220 222 165" stroke="var(--sys-color-stencilYellow-base)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Right stalk -->
    <path d="M 282 385 Q 284 330 286 275 Q 288 220 290 165" stroke="var(--sys-color-inkGold-base)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Far left stalk (asymmetric) -->
    <path d="M 210 390 Q 208 340 206 290 Q 204 240 202 190" stroke="var(--sys-color-solidaritySmokeOrange-base)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Far right stalk (asymmetric) -->
    <path d="M 300 388 Q 302 338 304 288 Q 306 238 308 188" stroke="var(--sys-color-stencilYellow-base)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Grain heads (central) -->
    <ellipse cx="248" cy="130" rx="12" ry="22" fill="var(--sys-color-inkGold-base)"/>
    <ellipse cx="246" cy="145" rx="10" ry="18" fill="var(--sys-color-stencilYellow-base)" opacity="0.9"/>
    <ellipse cx="250" cy="160" rx="9" ry="16" fill="var(--sys-color-solidaritySmokeOrange-base)" opacity="0.8"/>

    <!-- Grain heads (left) -->
    <ellipse cx="222" cy="155" rx="11" ry="20" fill="var(--sys-color-stencilYellow-base)"/>
    <ellipse cx="220" cy="170" rx="9" ry="17" fill="var(--sys-color-inkGold-base)" opacity="0.9"/>

    <!-- Grain heads (right) -->
    <ellipse cx="290" cy="155" rx="11" ry="20" fill="var(--sys-color-inkGold-base)"/>
    <ellipse cx="292" cy="170" rx="9" ry="17" fill="var(--sys-color-stencilYellow-base)" opacity="0.9"/>

    <!-- Grain heads (far sides) -->
    <ellipse cx="202" cy="180" rx="9" ry="18" fill="var(--sys-color-solidaritySmokeOrange-base)" opacity="0.8"/>
    <ellipse cx="308" cy="178" rx="9" ry="18" fill="var(--sys-color-stencilYellow-base)" opacity="0.8"/>

    <!-- Binding ribbon (solidarity red) -->
    <path d="M 200 340 Q 256 335 312 340" stroke="var(--sys-color-solidarityRed-base)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 205 355 Q 256 350 307 355" stroke="var(--sys-color-solidarityRed-base)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <g id="accent">
    <!-- Individual grain details -->
    <circle cx="248" cy="122" r="3" fill="var(--sys-color-stencilYellow-base)" opacity="0.9"/>
    <circle cx="244" cy="135" r="3" fill="var(--sys-color-solidaritySmokeOrange-base)" opacity="0.8"/>
    <circle cx="252" cy="135" r="3" fill="var(--sys-color-inkGold-base)" opacity="0.9"/>

    <circle cx="222" cy="150" r="3" fill="var(--sys-color-inkGold-base)" opacity="0.8"/>
    <circle cx="290" cy="150" r="3" fill="var(--sys-color-stencilYellow-base)" opacity="0.8"/>

    <!-- Ribbon knot detail -->
    <circle cx="256" cy="345" r="8" fill="var(--sys-color-solidarityRed-base)"/>
    <circle cx="256" cy="345" r="5" fill="var(--sys-color-charcoalBackground-base)" opacity="0.3"/>
  </g>
</svg>