<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="KR-UI-037 Hero Anchor Halo — Kerala Rage kr-solidarity">
  <title>KR-UI-037 Hero Anchor Halo — Solidarity Fist with Radiant Halo</title>
  <defs>
    <style>
      :root {
        --sys-color-asphaltBlack: #1A1714;
        --sys-color-kr-ink-gold: #D4A84B;
        --sys-color-waratahRed: #C45C4B;
        --sys-color-paperWhite: #F5F0E8;
        --sys-color-gumLeafGreen: #6B7F6E;
      }
    </style>
    <!-- Radiant halo gradient — temple gold emanation -->
    <radialGradient id="halo-radiance" cx="50%" cy="42%" r="52%">
      <stop offset="0%"  stop-color="var(--sys-color-kr-ink-gold, #D4A84B)" stop-opacity="0.88"/>
      <stop offset="30%" stop-color="var(--sys-color-kr-ink-gold, #D4A84B)" stop-opacity="0.44"/>
      <stop offset="60%" stop-color="var(--sys-color-waratahRed, #C45C4B)"  stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--sys-color-asphaltBlack, #1A1714)" stop-opacity="0"/>
    </radialGradient>
    <!-- Fist silhouette fill -->
    <linearGradient id="fist-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="var(--sys-color-paperWhite, #F5F0E8)" stop-opacity="1"/>
      <stop offset="100%" stop-color="var(--sys-color-kr-ink-gold, #D4A84B)" stop-opacity="0.72"/>
    </linearGradient>
    <!-- Outer ring filter -->
    <filter id="halo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Layer group: resistance foreground (Z-3+) -->
  <g id="hero-anchor-halo">
    <!-- Outer halo burst — radiant solidarity -->
    <circle cx="200" cy="168" r="148" fill="url(#halo-radiance)" filter="url(#halo-glow)"/>

    <!-- Ray lines — 12-point emanation from fist apex -->
    <g stroke="var(--sys-color-kr-ink-gold, #D4A84B)" stroke-width="1.5" opacity="0.36">
      <line x1="200" y1="168" x2="200" y2="26"/>
      <line x1="200" y1="168" x2="270" y2="38"/>
      <line x1="200" y1="168" x2="323" y2="91"/>
      <line x1="200" y1="168" x2="348" y2="168"/>
      <line x1="200" y1="168" x2="323" y2="245"/>
      <line x1="200" y1="168" x2="270" y2="298"/>
      <line x1="200" y1="168" x2="200" y2="310"/>
      <line x1="200" y1="168" x2="130" y2="298"/>
      <line x1="200" y1="168" x2="77"  y2="245"/>
      <line x1="200" y1="168" x2="52"  y2="168"/>
      <line x1="200" y1="168" x2="77"  y2="91"/>
      <line x1="200" y1="168" x2="130" y2="38"/>
    </g>

    <!-- Solidarity fist silhouette — organic, raised, defiant -->
    <g id="fist-silhouette" fill="url(#fist-fill)">
      <!-- Thumb -->
      <path d="M 163,178 Q 157,162 160,150 Q 163,141 170,143 Q 176,145 177,155 L 178,178 Z" opacity="0.9"/>
      <!-- Index finger -->
      <path d="M 178,179 L 178,128 Q 179,118 187,118 Q 195,118 196,128 L 196,179 Z"/>
      <!-- Middle finger -->
      <path d="M 196,179 L 196,122 Q 197,112 205,112 Q 213,112 214,122 L 214,179 Z"/>
      <!-- Ring finger -->
      <path d="M 214,179 L 214,126 Q 215,116 223,116 Q 231,116 232,126 L 232,179 Z"/>
      <!-- Pinky -->
      <path d="M 232,179 L 232,132 Q 233,124 239,124 Q 245,124 246,132 L 246,179 Z"/>
      <!-- Knuckle bridge -->
      <path d="M 163,179 Q 163,190 170,196 L 246,196 Q 252,191 252,181 L 252,178 L 163,178 Z"/>
      <!-- Palm body -->
      <path d="M 167,196 Q 160,200 158,212 L 156,252 Q 157,264 168,268 L 242,268 Q 253,265 254,252 L 252,212 Q 250,200 244,196 Z"/>
      <!-- Wrist -->
      <path d="M 163,268 Q 158,274 158,286 L 160,310 Q 162,318 172,320 L 236,320 Q 244,318 244,308 L 244,268 Z" opacity="0.88"/>
    </g>

    <!-- Gold accent ring around fist apex -->
    <circle cx="200" cy="150" r="28" fill="none" stroke="var(--sys-color-kr-ink-gold, #D4A84B)" stroke-width="1" opacity="0.44"/>

    <!-- Bottom solidarity text baseline -->
    <text x="200" y="378" text-anchor="middle"
          font-family="'Work Sans', sans-serif"
          font-weight="600"
          font-size="13"
          letter-spacing="4"
          fill="var(--sys-color-kr-ink-gold, #D4A84B)"
          opacity="0.72">
      SOLIDARITY
    </text>

    <!-- Gum leaf green base accent -->
    <path d="M 100,388 Q 160,380 200,382 Q 240,380 300,388 L 300,396 Q 240,392 200,394 Q 160,392 100,396 Z"
          fill="var(--sys-color-gumLeafGreen, #6B7F6E)" opacity="0.5"/>
  </g>

  <text x="-9999" y="-9999" font-size="1">Hero anchor halo — KR-UI-037 — Kerala Rage kr-solidarity</text>
</svg>
