<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="KR-UI-036 Substrate Grain Overlay — Kerala Rage kr-solidarity">
  <title>KR-UI-036 Substrate Grain Overlay</title>
  <defs>
    <style>
      :root {
        --sys-color-asphaltBlack: #1A1714;
        --sys-color-kr-ink-gold: #D4A84B;
        --sys-color-concreteGrey: #A39B8F;
        --sys-color-kr-activistSmokeGreen-base: #48da8b;
      }
    </style>
    <filter id="grain-noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72 0.68" numOctaves="4" seed="7" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey-noise"/>
      <feBlend in="SourceGraphic" in2="grey-noise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="substrate-vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="var(--sys-color-concreteGrey, #A39B8F)" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="var(--sys-color-asphaltBlack, #1A1714)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--sys-color-asphaltBlack, #1A1714)" stop-opacity="0.42"/>
    </radialGradient>
    <!-- Organic asymmetric clip path — substrate layer never uniform -->
    <clipPath id="grain-clip">
      <path d="M 0,8 Q 40,0 80,5 Q 140,12 200,3 Q 260,-4 320,6 Q 370,14 400,8 L 400,392 Q 362,398 310,394 Q 240,388 180,397 Q 120,404 60,396 Q 24,390 0,400 Z"/>
    </clipPath>
  </defs>
  <!-- Layer group: substrate (Z-0) -->
  <g id="substrate-grain-overlay" clip-path="url(#grain-clip)">
    <!-- Base asphalt floor -->
    <rect width="400" height="400" fill="var(--sys-color-asphaltBlack, #1A1714)" opacity="1"/>
    <!-- Gold micro-filament grid — material memory of labor -->
    <g opacity="0.06" stroke="var(--sys-color-kr-ink-gold, #D4A84B)" stroke-width="0.5">
      <line x1="0" y1="53" x2="400" y2="47"/>
      <line x1="0" y1="107" x2="400" y2="99"/>
      <line x1="0" y1="163" x2="400" y2="157"/>
      <line x1="0" y1="221" x2="400" y2="215"/>
      <line x1="0" y1="279" x2="400" y2="273"/>
      <line x1="0" y1="337" x2="400" y2="331"/>
      <line x1="39" y1="0" x2="43" y2="400"/>
      <line x1="119" y1="0" x2="123" y2="400"/>
      <line x1="199" y1="0" x2="197" y2="400"/>
      <line x1="279" y1="0" x2="283" y2="400"/>
      <line x1="359" y1="0" x2="357" y2="400"/>
    </g>
    <!-- Concrete micro-texture dots — tactile grain -->
    <g fill="var(--sys-color-concreteGrey, #A39B8F)" opacity="0.09">
      <circle cx="31" cy="41" r="0.8"/>  <circle cx="67" cy="19" r="0.6"/>  <circle cx="113" cy="88" r="1.0"/>
      <circle cx="157" cy="33" r="0.7"/> <circle cx="203" cy="71" r="0.9"/> <circle cx="251" cy="22" r="0.6"/>
      <circle cx="297" cy="59" r="1.1"/> <circle cx="341" cy="38" r="0.7"/> <circle cx="383" cy="77" r="0.8"/>
      <circle cx="17" cy="131" r="0.9"/><circle cx="77" cy="149" r="0.6"/><circle cx="129" cy="117" r="1.0"/>
      <circle cx="179" cy="162" r="0.8"/><circle cx="229" cy="138" r="0.7"/><circle cx="277" cy="155" r="1.1"/>
      <circle cx="323" cy="122" r="0.6"/><circle cx="371" cy="143" r="0.9"/><circle cx="43" cy="197" r="0.7"/>
      <circle cx="97" cy="211" r="1.0"/><circle cx="151" cy="189" r="0.6"/><circle cx="199" cy="223" r="0.8"/>
      <circle cx="247" cy="201" r="0.9"/><circle cx="299" cy="218" r="0.7"/><circle cx="349" cy="196" r="1.1"/>
      <circle cx="23" cy="263" r="0.8"/><circle cx="71" cy="281" r="0.6"/><circle cx="127" cy="257" r="1.0"/>
      <circle cx="173" cy="289" r="0.7"/><circle cx="221" cy="271" r="0.9"/><circle cx="271" cy="288" r="0.6"/>
      <circle cx="319" cy="261" r="1.1"/><circle cx="367" cy="278" r="0.8"/><circle cx="53" cy="331" r="0.7"/>
      <circle cx="107" cy="349" r="1.0"/><circle cx="163" cy="323" r="0.6"/><circle cx="211" cy="357" r="0.8"/>
      <circle cx="259" cy="337" r="0.9"/><circle cx="307" cy="351" r="0.7"/><circle cx="359" cy="328" r="1.1"/>
      <circle cx="389" cy="361" r="0.6"/>
    </g>
    <!-- Vignette for depth -->
    <rect width="400" height="400" fill="url(#substrate-vignette)" filter="url(#grain-noise)"/>
    <!-- Activist smoke green accent seam — solidarity undercurrent -->
    <path d="M 0,400 Q 80,388 160,394 Q 240,400 320,391 Q 370,385 400,392 L 400,400 Z" fill="var(--sys-color-kr-activistSmokeGreen-base, #48da8b)" opacity="0.22"/>
  </g>
  <!-- Semantic label (hidden, screen reader) -->
  <text x="-9999" y="-9999" font-size="1">Substrate grain overlay — KR-UI-036 — Kerala Rage kr-solidarity</text>
</svg>
