<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundle Analysis Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 2rem; }
        .header { border-bottom: 2px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem; }
        .section { margin: 2rem 0; }
        .file-list { background: #f8f9fa; padding: 1rem; border-radius: 8px; }
        .large { color: #d73a49; }
        .medium { color: #f66a0a; }
        .small { color: #28a745; }
        .stat { display: inline-block; background: #e3f2fd; padding: 0.5rem 1rem; margin: 0.25rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bundle Analysis Report</h1>
        <p>Generated on: $(date)</p>
    </div>
    <div class="section">
        <h2>Bundle Statistics</h2>
        <div class="stat">Total Size:   0B</div>
        <div class="stat">JavaScript Files:        1</div>
        <div class="stat">CSS Files:        1</div>
        <div class="stat">Assets:        1</div>
    </div>
</body></html>
