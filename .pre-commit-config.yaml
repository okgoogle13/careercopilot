# Pre-commit hooks for automatic code formatting and linting
# Install with: pip install pre-commit && pre-commit install

repos:
  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=100]
        language_version: python3
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # Python import sorting with isort (compatible with Black)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503,E501]
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # General: Remove trailing whitespace and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/(node_modules|dist|build)/|backend/__pycache__|\.git/)
      - id: end-of-file-fixer
        exclude: ^(frontend/(node_modules|dist|build)/|backend/__pycache__|\.git/)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

# Configuration
default_language_version:
  python: python3

# Performance optimization
default_stages: [pre-commit]
fail_fast: false
