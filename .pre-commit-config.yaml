# Pre-commit hooks for automatic code formatting and linting
# Install with: pip install pre-commit && pre-commit install

repos:
  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=100]
        language_version: python3
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # Python import sorting with isort (compatible with Black)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # Python linting with flake8
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --extend-ignore=E203,W503,E501]
        files: ^backend/
        exclude: ^backend/(migrations|__pycache__|\.venv)/

  # Frontend: ESLint for TypeScript/JavaScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        exclude: ^frontend/(node_modules|dist|build)/
        additional_dependencies:
          - eslint@^9.0.0
          - @typescript-eslint/parser@^7.0.0
          - @typescript-eslint/eslint-plugin@^7.0.0
          - eslint-config-prettier@^9.0.0
        args:
          - --fix
          - --max-warnings=0

  # Frontend: Prettier for code formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|css|scss|json|md|mdx|html|yml|yaml)$
        exclude: ^frontend/(node_modules|dist|build)/
        args: [--write, --ignore-unknown]

  # General: Remove trailing whitespace and basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(frontend/(node_modules|dist|build)/|backend/__pycache__|\.git/)
      - id: end-of-file-fixer
        exclude: ^(frontend/(node_modules|dist|build)/|backend/__pycache__|\.git/)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - id: check-toml
      - id: check-xml

  # Commit message validation
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v4.0.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - @commitlint/config-conventional@^19.0.0

# Configuration
default_language_version:
  python: python3
  node: 18

# Performance optimization
default_stages: [commit-msg, pre-commit, pre-push]
fail_fast: false
