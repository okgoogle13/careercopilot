[flake8]
max-line-length = 1000
exclude = venv,__pycache__,node_modules
ignore =
    B008,
    B007,
    B009,
    B023,
    B028,
    B037,
    E203,
    E221,
    E301,
    E302,
    E402,
    E501,
    F401,
    F403,
    F841,
    W293,
    W391,
    W503,
    W504
per-file-ignores =
    # Ignore unused imports in test files
    */tests/*.py: F401
    # Ignore line length in test files
    */tests/*.py: E501
    # Ignore unused imports in __init__.py files
    */__init__.py: F401
    # Ignore line length in __init__.py files
    */__init__.py: E501
