# Codex CLI MCP Server Configuration
# This file configures MCP servers for use with Codex CLI
# Documentation: https://github.com/okgoogle13/careercopilot/docs/guides/CODEX_CLI_SETUP.md

# GitHub MCP Server Configuration
# The GitHub MCP server provides access to GitHub repositories, issues, PRs, and more
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
bearer_token_env_var = "CODEX_GITHUB_PERSONAL_ACCESS_TOKEN"

# Flash Sidekick MCP Server
[mcp_servers.flash-sidekick]
command = "python3"
args = ["servers/flash_sidekick.py"]
env = { GEMINI_API_KEY = "GEMINI_API_KEY" }

# Design System Sidekick
[mcp_servers.design-system-sidekick]
command = "python3"
args = ["servers/design_system_sidekick.py"]
env = { GEMINI_API_KEY = "GEMINI_API_KEY" }

# Vision Scorer MCP (v3.1)
[mcp_servers.vision-scorer-mcp]
command = "python3"
args = ["servers/vision_scorer_mcp.py"]
env = { GEMINI_API_KEY = "GEMINI_API_KEY" }

# Test Coverage Sprint (Saturation Gate)
[mcp_servers.test-coverage-sprint]
command = "python3"
args = ["servers/test_coverage_sprint.py"]

# Playwright (Efficiency Audit Only)
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
disabled_tools = ["resize", "drag", "hover", "press_key", "console_messages", "network_requests", "file_upload"]

