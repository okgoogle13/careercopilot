name: CI - Build and Test

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend
        timeout-minutes: 5

      - name: Type Check
        run: npm run type-check --prefix frontend
        timeout-minutes: 3

      - name: Lint Frontend
        run: npm run lint --prefix frontend
        timeout-minutes: 3

      - name: Format Check
        run: npm run format:check --prefix frontend
        timeout-minutes: 2

      - name: Build Frontend
        run: npm run build --prefix frontend
        timeout-minutes: 5

      - name: Bundle Size Check
        run: npm run bundle-analysis --prefix frontend
        timeout-minutes: 3

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: frontend/dist/bundle-analysis.json
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
        timeout-minutes: 10

      - name: Lint Backend (flake8)
        run: cd backend && flake8 app/
        timeout-minutes: 3

      - name: Format Check (black)
        run: black --check backend/ --line-length=100
        timeout-minutes: 3

      - name: Type Check (mypy)
        run: mypy backend/ --ignore-missing-imports
        timeout-minutes: 5
        continue-on-error: true

      - name: Security Check (bandit)
        run: bandit -r backend/ -f json -o bandit-report.json
        timeout-minutes: 3
        continue-on-error: true

      - name: Upload bandit security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Add bandit results to summary
        if: always()
        run: |
          echo "### 🔍 Bandit Security Scan" >> $GITHUB_STEP_SUMMARY
          if [ -f bandit-report.json ]; then
            ISSUES=$(jq '.results | length' bandit-report.json 2>/dev/null || echo "0")
            echo "**Found $ISSUES security issues**" >> $GITHUB_STEP_SUMMARY
            echo "📁 [Download detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No security issues found**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run Backend Tests
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --maxfail=1
        timeout-minutes: 10
        env:
          ENVIRONMENT: test

  code-quality-gate:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.test-frontend.result }}" == "failure" ]]; then
            echo "❌ Frontend tests failed"
            exit 1
          fi
          if [[ "${{ needs.test-backend.result }}" == "failure" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          echo "✅ All quality checks passed!"

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Code Quality Gate Failed**\n\nPlease check the CI results and fix any issues before merging.'
            })

      - name: Post PR comment on success
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **All Quality Checks Passed!**\n\nThis PR is ready for review and merge.'
            })