[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = app/tests tests
norecursedirs = tests/performance app/agents
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, require external services)
    e2e: End-to-end tests (slowest, full system test)
    asyncio: Async test support
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
