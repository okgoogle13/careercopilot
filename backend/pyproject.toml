[project.optional-dependencies]
dev = [
    # Core testing and linting tools
    "black[jupyter]>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.20.0",
]

[project.scripts]
careercopilot = "app.main:app"

[tool.setuptools.packages.find]
where = ["app"]
include = ["app/*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["py.typed", "*.json", "*.yaml", "*.yml"]

[project.urls]
Homepage = "https://github.com/your-org/careercopilot"
Documentation = "https://docs.careercopilot.ai"
Repository = "https://github.com/your-org/careercopilot"
Changelog = "https://github.com/your-org/careercopilot/blob/main/CHANGELOG.md"

# ===== Tool Configurations =====

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
include_trailing_comma = true
multi_line_output = 3
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
check_untyped_defs = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_no_return = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

# Enable strict mode for production code
[[tool.mypy.overrides]]
module = [
    "app.api.*",
    "app.core.*",
    "app.models.*",
    "app.schemas.*",
    "app.services.*",
]

# More permissive settings for tests and generated code
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "app.tests.*",
    "app.genkit_flows.*",
    "app.ai_operations.*",
    "app.models.database",  # Legacy database.py with many SQLAlchemy type issues
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:.*setuptools",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/tests/*",
    "app/__main__.py",
    "**/__pycache__/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 25
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "raise AssertionError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "FBT", # flake8-boolean-trap
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "B904",  # Use raise X from e (not always applicable)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when they are prefixed with _
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Use of assert detected
    "ARG001", # Unused method argument
]
