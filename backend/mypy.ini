[mypy]
python_version = 3.13
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
show_error_codes = True
explicit_package_bases = True
mypy_path = .

# Disable strict checks that cause many errors
disallow_untyped_defs = False
disallow_any_generics = False
disallow_subclassing_any = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False

# Allow dynamic typing for flexibility
allow_untyped_globals = True
allow_redefinition = True

# Suppress common errors in our codebase
[mypy-app.core.personal_cache]
ignore_errors = True

[mypy-app.core.nlp_model_manager]
ignore_errors = True

[mypy-app.core.ai_config]
ignore_errors = True

[mypy-app.utils.resume_parser]
ignore_errors = True

[mypy-app.ai.document_processor]
ignore_errors = True

[mypy-app.core.document_processing]
ignore_errors = True

[mypy-app.ai.document_analysis_service]
ignore_errors = True

[mypy-app.models.database]
ignore_errors = True

[mypy-app.core.genkit_init]
ignore_errors = True

[mypy-app.core.secure_config]
ignore_errors = True

[mypy-app.services.template_service]
ignore_errors = True

[mypy-app.tests.*]
ignore_errors = True
