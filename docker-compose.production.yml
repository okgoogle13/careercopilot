services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: careercopilot-postgres
    environment:
      POSTGRES_DB: careercopilot
      POSTGRES_USER: careercopilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-in-production}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
      # - "5432:5432"  # SECURITY: Removed host port exposure - postgres only accessible within container network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercopilot -d careercopilot"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: careercopilot-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-in-production}
    volumes:
      - redis_data:/data
    # ports:
      # - "6379:6379"  # SECURITY: Removed host port exposure - redis only accessible within container network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careercopilot-network
    restart: unless-stopped

  # CareerCopilot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: careercopilot-backend
    env_file:
      - .env.production
    environment:
      # Database configuration
      DATABASE_URL: postgresql://careercopilot:${DB_PASSWORD:-change-in-production}@postgres:5432/careercopilot
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: careercopilot
      DB_USER: careercopilot
      DB_PASSWORD: ${DB_PASSWORD:-change-in-production}

      # Redis configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379/0

      # Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

      # Genkit Configuration
      GENKIT_ENV: ${GENKIT_ENV:-prod}
      GENKIT_LOG_LEVEL: ${GENKIT_LOG_LEVEL:-INFO}
      ENABLE_GENKIT_FLOWS: ${ENABLE_GENKIT_FLOWS:-true}

      # AI Model Configuration
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gemini-2.0-flash}
      BACKUP_AI_MODEL: ${BACKUP_AI_MODEL:-gpt-4o}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.7}
      MAX_TOKENS: ${MAX_TOKENS:-4096}

      # Google Cloud & Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      VERTEX_AI_PROJECT_ID: ${VERTEX_AI_PROJECT_ID}
      VERTEX_AI_LOCATION: ${VERTEX_AI_LOCATION:-us-central1}

      # Application settings
      ENVIRONMENT: production
      DEBUG: false
      LOG_LEVEL: INFO

      # Caching
      CACHE_TTL_HOURS: 24
      ENABLE_CACHE: true

      # Rate limiting
      RATE_LIMIT_ENABLED: true
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW: 3600

      # Firebase/Google Cloud Authentication
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: careercopilot-worker
    command: python -m celery -A app.worker worker --loglevel=info --concurrency=4
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://careercopilot:${DB_PASSWORD:-change-in-production}@postgres:5432/careercopilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: production
    # volumes:
      # - ./data:/app/data
      # - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Celery Beat scheduler for periodic tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: careercopilot-scheduler
    command: python -m celery -A app.worker beat --loglevel=info
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://careercopilot:${DB_PASSWORD:-change-in-production}@postgres:5432/careercopilot
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-in-production}@redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: production
    # volumes:
      # - ./data:/app/data
      # - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: careercopilot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: careercopilot-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - careercopilot-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: careercopilot-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - careercopilot-network
    restart: unless-stopped

networks:
  careercopilot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
